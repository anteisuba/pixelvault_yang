<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 A · 灯箱馆 — Assets 独立设计（Claude）</title>
<style>
  :root{
    --bg:#0d0e10; --panel:#151619; --panel2:#1b1d21;
    --line:#26282d; --line2:#34373d;
    --text:#eceded; --sub:#9ba0a6; --dim:#6d7278;
    --amber:#d9b36a;
    --nav-w:56px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font:13px/1.5 system-ui,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  ::selection{background:rgba(255,255,255,.18)}

  /* ── 现有全局导航（非本设计对象，仅示意空间关系） ── */
  .gnav{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:#0a0b0c;border-right:1px solid #1c1e22;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:40}
  .gnav .logo{width:26px;height:26px;border-radius:7px;background:#212428;display:grid;place-items:center;font-weight:700;font-size:12px;color:#8b9096;margin-bottom:10px}
  .gnav .it{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#565b61}
  .gnav .it.on{background:#1d2024;color:#c9cccf}
  .gnav svg{width:17px;height:17px}

  /* ── 顶部薄杆 ── */
  .bar{position:fixed;top:0;left:var(--nav-w);right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30}
  .brand{display:flex;align-items:baseline;gap:8px;flex:none}
  .brand b{font-size:15px;font-weight:600;letter-spacing:.02em}
  .brand .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .scope{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:17px;color:var(--text);flex:none;transition:border-color .15s}
  .scope:hover{border-color:#4a4e55}
  .scope .crumb{color:var(--dim)}
  .scope svg{width:13px;height:13px;color:var(--sub)}
  .search{flex:1 1 200px;max-width:360px;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--panel);border:1px solid transparent;border-radius:8px;color:var(--dim)}
  .search:focus-within{border-color:var(--line2)}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--text)}
  .search input::placeholder{color:var(--dim)}
  .search svg{width:14px;height:14px;flex:none}
  .spacer{flex:1}
  .tfilter{display:flex;gap:2px;padding:3px;background:var(--panel);border-radius:9px;flex:none}
  .tfilter button{width:32px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dim);transition:.12s}
  .tfilter button:hover{color:var(--sub)}
  .tfilter button.on{background:var(--panel2);color:var(--text)}
  .tfilter svg{width:15px;height:15px}
  .act{display:flex;align-items:center;gap:8px;flex:none}
  .btn{height:34px;padding:0 14px;border-radius:8px;display:flex;align-items:center;gap:7px;font-weight:500;transition:.12s}
  .btn svg{width:14px;height:14px}
  .btn.pri{background:var(--text);color:#141518}
  .btn.pri:hover{background:#fff}
  .btn.gho{border:1px solid var(--line2);color:var(--text)}
  .btn.gho:hover{border-color:#4a4e55}
  .btn.gho.on{background:var(--panel2);border-color:var(--line2)}
  .dens{display:flex;gap:2px;padding:3px;background:var(--panel);border-radius:9px}
  .dens button{width:26px;height:28px;border-radius:6px;color:var(--dim);font-size:11px;font-weight:600}
  .dens button.on{background:var(--panel2);color:var(--text)}

  /* ── scope 下拉（树） ── */
  .pop{position:fixed;top:60px;left:calc(var(--nav-w) + 120px);width:320px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:50;display:none;padding:8px}
  .pop.open{display:block}
  .pop .psearch{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--bg);border-radius:7px;margin-bottom:6px;color:var(--dim)}
  .pop .psearch input{flex:1;background:none;border:0;outline:0;color:var(--text)}
  .pop .grp{padding:8px 8px 3px;font-size:11px;color:var(--dim);letter-spacing:.04em}
  .pop .row{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:7px;color:var(--text);width:100%;text-align:left}
  .pop .row:hover{background:var(--panel2)}
  .pop .row.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--text)}
  .pop .row svg{width:14px;height:14px;color:var(--dim);flex:none}
  .pop .row .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop .row .cnt{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .pop .row.sub{padding-left:30px}
  .pop .row .amber{color:var(--amber)}

  /* ── 大河 ── */
  main{padding:76px 24px 60px calc(var(--nav-w) + 24px)}
  .anchor{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;color:var(--dim);font-size:12px}
  .anchor:first-child{margin-top:0}
  .anchor .new{display:inline-flex;align-items:center;gap:5px;color:var(--amber);font-weight:500}
  .anchor .new i{width:5px;height:5px;border-radius:50%;background:var(--amber);font-style:normal}
  .anchor .rule{flex:1;height:1px;background:var(--line)}
  .row-j{display:flex;gap:8px;margin-bottom:8px}
  .tile{position:relative;border-radius:5px;overflow:hidden;background:var(--panel);flex:none;cursor:zoom-in;outline-offset:2px}
  .tile:focus-visible{outline:2px solid #fff}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile .veil{position:absolute;inset:auto 0 0 0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.74));opacity:0;transition:opacity .15s;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .tile:hover .veil{opacity:1}
  .tile .veil .m{font-size:11px;color:#e7e8ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .veil .wh{font-size:10px;color:#b7babf;font-variant-numeric:tabular-nums;flex:none}
  .tile .badge{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:rgba(10,11,12,.72);backdrop-filter:blur(4px);font-size:10px;color:#d6d8da;font-variant-numeric:tabular-nums}
  .tile:hover .badge{opacity:0}
  .tile .badge svg{width:11px;height:11px}
  .tile .dot-new{position:absolute;left:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px rgba(13,14,16,.6)}
  .tile .ck{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(10,11,12,.35);display:none;place-items:center;transition:.12s}
  body.selecting .ck{display:grid}
  body.selecting .dot-new{display:none}
  body.selecting .tile{cursor:pointer}
  .tile.sel .ck{background:#fff;border-color:#fff}
  .tile.sel .ck svg{width:12px;height:12px;color:#111}
  .tile.sel::after{content:"";position:absolute;inset:0;border-radius:5px;box-shadow:inset 0 0 0 2px #fff}
  /* 视频占位皮（真帧 seek 到后揭掉） */
  .vskin{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1e2126 0%,#141619 55%,#191c20 100%)}
  .vskin svg{width:22px;height:22px;color:#4c5158}
  /* 音频卡 */
  .tile.audio .cover{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 20%,#23262b,#141518)}
  .tile.audio .cover .ring{width:46%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
  .tile.audio .cover .ring::before{content:"";width:62%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line)}
  .tile.audio .play,{}
  .tile .play{position:absolute;left:50%;top:50%;translate:-50% -50%;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .tile .play svg{width:15px;height:15px;color:#141518;margin-left:2px}
  .tile.audio .play,.tile.video:hover .play{opacity:1}
  .tile.audio .play{opacity:.92;width:34px;height:34px}

  /* ── 灯箱 ── */
  .lb{position:fixed;inset:0;background:rgba(5,6,7,.94);z-index:100;display:none;flex-direction:column}
  .lb.open{display:flex}
  .lb .top{display:flex;align-items:center;gap:14px;padding:14px 20px;color:var(--sub)}
  .lb .top .t{color:var(--text);font-weight:500}
  .lb .top .meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .lb .top .sp{flex:1}
  .lb .icirc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
  .lb .icirc:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .lb .icirc svg{width:16px;height:16px}
  .lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 68px;position:relative}
  .lb .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
  .lb .nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--sub);background:rgba(20,21,24,.5)}
  .lb .nav:hover{color:var(--text);background:rgba(30,32,36,.8)}
  .lb .nav.l{left:14px}.lb .nav.r{right:14px}
  .lb .nav svg{width:18px;height:18px}
  .lb .film{display:flex;gap:6px;justify-content:center;padding:12px 20px 16px;overflow-x:auto}
  .lb .film img{height:52px;width:auto;border-radius:3px;opacity:.45;cursor:pointer;transition:.12s}
  .lb .film img:hover{opacity:.8}
  .lb .film img.on{opacity:1;box-shadow:0 0 0 2px #fff}
  .lb .side{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--panel);border-left:1px solid var(--line);padding:18px;transform:translateX(100%);transition:transform .2s;overflow:auto}
  .lb.info .side{transform:none}
  .lb.info .stage{padding-right:368px}
  .lb .side h4{font-size:11px;color:var(--dim);letter-spacing:.05em;margin:14px 0 6px}
  .lb .side h4:first-child{margin-top:0}
  .lb .side p{color:var(--sub);font-size:12px;line-height:1.6}
  .lb .side .kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--sub)}
  .lb .side .kv b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
  .lb .side .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .lb .side .acts button{height:30px;padding:0 11px;border:1px solid var(--line2);border-radius:7px;font-size:12px;color:var(--text)}
  .lb .side .acts button:hover{border-color:#4a4e55}

  /* ── 选择态底部条 ── */
  .selbar{position:fixed;left:50%;bottom:18px;translate:-50%;display:none;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:60}
  body.selecting .selbar{display:flex}
  .selbar .n{padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums}
  .selbar button{height:32px;padding:0 12px;border-radius:8px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .selbar button:hover{background:var(--panel);color:var(--text)}
  .selbar button svg{width:14px;height:14px}
  .selbar .div{width:1px;height:20px;background:var(--line2);margin:0 4px}
  .selbar .danger:hover{color:#e0836f}

  /* 角标 */
  .tag-proto{position:fixed;left:12px;bottom:12px;z-index:80;font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;letter-spacing:.04em}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- 全局导航（现状示意） -->
<nav class="gnav" aria-label="全局导航（现状，非本设计对象）">
  <div class="logo">P</div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>

  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16"/></svg></div>

<!-- 顶部薄杆 -->
<header class="bar">
  <div class="brand"><b>素材</b><span class="n" id="total">496</span></div>
  <button class="scope" id="scopeBtn" aria-haspopup="true" aria-expanded="false">
    <span id="scopeLbl">全部素材</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input placeholder="搜索提示词、模型…"></label>
  <div class="spacer"></div>
  <div class="tfilter" role="group" aria-label="媒体类型">
    <button class="on" title="图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 15-4.35-4.35a1 1 0 0 0-1.42 0L8 18"/></svg></button>
    <button class="on" title="视频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
    <button class="on" title="音频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v10.5a3.5 3.5 0 1 1-2-3.16"/><path d="M12 3c1.5 2 3.5 3 6 3"/></svg></button>
    <button class="on" title="3D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="M12 11 4 6.5M12 11l8-4.5M12 11v9"/></svg></button>
  </div>
  <div class="act">
    <button class="btn pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0 5 5m-5-5L7 9"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>上传</button>
    <button class="btn gho" id="selBtn">选择</button>
    <div class="dens" role="group" aria-label="密度">
      <button>S</button><button class="on">M</button><button>L</button>
    </div>
  </div>
</header>

<!-- scope 下拉 -->
<div class="pop" id="scopePop" role="menu">
  <label class="psearch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input placeholder="搜索文件夹…"></label>
  <div class="grp">视图</div>
  <button class="row on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">全部素材</span><span class="cnt">496</span></button>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 1 1 7.5-6.6 5 5 0 1 1 7.5 6.6Z"/></svg><span class="lbl">收藏</span><span class="cnt">23</span></button>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg><span class="lbl">已发布</span><span class="cnt">41</span></button>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0 5 5m-5-5L7 9"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg><span class="lbl">本地上传</span><span class="cnt">67</span></button>
  <div class="grp">文件夹</div>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl amber">未分类</span><span class="cnt amber">156</span></button>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">鸣潮</span><span class="cnt">34</span></button>
  <button class="row sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">dainia</span><span class="cnt">24</span></button>
  <button class="row sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">爱弥丝</span><span class="cnt">18</span></button>
  <button class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">ba</span><span class="cnt">12</span></button>
  <button class="row sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">キサキ</span><span class="cnt">5</span></button>

const FLAT = SEG.flatMap(s=>s.items);

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const GAP=8, TARGET_H=248, MAXW_SOLO=1.25;

function buildRow(items, W, h){
  const row=document.createElement('div'); row.className='row-j';
  for(const it of items){
    const ar=clamp(it.ar,0.5,2.2);
    const w=Math.floor(h*ar);
    row.appendChild(tile(it,w,h));
  }
  return row;
}
function tile(it,w,h){
  const d=document.createElement('div');
  d.className='tile'+(it.a?' audio':'')+(it.v?' video':'');
  d.style.width=w+'px'; d.style.height=h+'px';
  d.tabIndex=0;
  d.setAttribute('role','button');
  d.setAttribute('aria-label', it.name||it.p||it.m);
  if(it.a){
    d.innerHTML=`<div class="cover"><div class="ring"></div></div>
      <button class="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <span class="badge">♪ ${it.dur}</span>`;
  } else if(it.v){
    d.innerHTML=`<video muted preload="metadata" onloadedmetadata="this.currentTime=0.05" src="${it.u}"></video>
      <span class="vskin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></span>
      <button class="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>${it.dur}</span>
      <div class="veil"><span class="m">${it.m}</span><span class="wh">${it.w}×${it.h}</span></div>`;
    const v=d.querySelector('video');
    v.addEventListener('seeked',()=>d.querySelector('.vskin')?.remove(),{once:true});
    d.addEventListener('mouseenter',()=>{d.querySelector('.vskin')?.remove();v.play().catch(()=>{})});
    d.addEventListener('mouseleave',()=>{v.pause();v.currentTime=0});
  } else {
    d.innerHTML=`<img loading="lazy" src="${it.u}" alt="">
      ${it.m3?'<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="M12 11 4 6.5M12 11l8-4.5M12 11v9"/></svg>3D</span>':''}
      <div class="veil"><span class="m">${it.p||it.m}</span><span class="wh">${it.w}×${it.h}</span></div>`;
  }
  if(it.fresh) d.insertAdjacentHTML('beforeend','<span class="dot-new" title="新回流"></span>');
  d.insertAdjacentHTML('beforeend','<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></span>');
  d.addEventListener('click',()=>{
    if(document.body.classList.contains('selecting')){ d.classList.toggle('sel'); updSel(); }
    else if(!it.a) openLb(FLAT.indexOf(it));
  });
  d.addEventListener('keydown',e=>{ if(e.key==='Enter') d.click(); });
  return d;
}

function layout(){
  const river=document.getElementById('river');
  river.innerHTML='';
  const W=river.clientWidth-48;
  for(const seg of SEG){
    const an=document.createElement('div'); an.className='anchor';
    an.innerHTML=(seg.isNew?`<span class="new"><i></i>新回流 · ${seg.items.filter(i=>i.fresh).length}</span><span>${seg.label}</span>`:`<span>${seg.label}</span>`)+'<span class="rule"></span>';
    river.appendChild(an);
    let buf=[], arSum=0;
    const flush=(force)=>{
      if(!buf.length) return;
      let h=(W-GAP*(buf.length-1))/arSum;
      if(force && h>TARGET_H) h=TARGET_H; // 末行不放大
      h=Math.min(h,TARGET_H*1.3);
      river.appendChild(buildRow(buf,W,Math.floor(h)));
      buf=[];arSum=0;
    };
    for(const it of seg.items){
      if(it.ar>2.2){ // 超宽独占整行，完整显示
        flush(false);
        const h=Math.min(TARGET_H*MAXW_SOLO, W/it.ar);
        river.appendChild(buildRow([{...it,ar:it.ar}],W,Math.floor(h)));
        continue;
      }
      buf.push(it); arSum+=clamp(it.ar,0.5,2.2);
      if(arSum*TARGET_H>=W-GAP*(buf.length-1)) flush(false);
    }
    flush(true);
  }
}

/* scope 下拉 */
const scopeBtn=document.getElementById('scopeBtn'), scopePop=document.getElementById('scopePop');
scopeBtn.addEventListener('click',e=>{e.stopPropagation();scopePop.classList.toggle('open');scopeBtn.setAttribute('aria-expanded',scopePop.classList.contains('open'))});
document.addEventListener('click',e=>{ if(!scopePop.contains(e.target)) scopePop.classList.remove('open') });
scopePop.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
  scopePop.querySelectorAll('.row').forEach(x=>x.classList.remove('on'));
  r.classList.add('on');
  document.getElementById('scopeLbl').textContent=r.querySelector('.lbl').textContent;
  scopePop.classList.remove('open');
}));

/* 选择态 */
const selBtn=document.getElementById('selBtn');
selBtn.addEventListener('click',()=>{ document.body.classList.toggle('selecting'); selBtn.classList.toggle('on'); updSel(); });
document.getElementById('selCancel').addEventListener('click',()=>{ document.body.classList.remove('selecting'); selBtn.classList.remove('on'); document.querySelectorAll('.tile.sel').forEach(t=>t.classList.remove('sel')); });
function updSel(){ document.getElementById('selN').textContent='已选 '+document.querySelectorAll('.tile.sel').length; }

/* 灯箱 */
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lbImg');
let lbIdx=0;
const viewable = ()=>FLAT.filter(i=>!i.a);
function openLb(flatIdx){
  const list=viewable();
  lbIdx=Math.max(0,list.indexOf(FLAT[flatIdx]));
  renderLb();
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function renderLb(){
  const list=viewable(); const it=list[lbIdx];
  document.getElementById('lbTitle').textContent=it.p||it.name||it.m;
  document.getElementById('lbMeta').textContent=`${it.w}×${it.h} · ${it.m}`;
  document.getElementById('lbPrompt').textContent=it.p||'（无提示词 · '+(it.v?'视频':'素材')+'）';
  document.getElementById('lbModel').textContent=it.m;
  document.getElementById('lbSize').textContent=it.w+'×'+it.h;
  document.getElementById('lbDate').textContent='2026-'+it.d;
  if(it.v){ lbImg.style.display='none'; }
  else { lbImg.style.display=''; lbImg.src=it.u; }
  const film=document.getElementById('lbFilm'); film.innerHTML='';
  list.forEach((f,i)=>{
    if(f.v) return;
    const im=document.createElement('img'); im.src=f.u; im.loading='lazy';
    if(i===lbIdx) im.className='on';
    im.addEventListener('click',()=>{lbIdx=i;renderLb()});
    film.appendChild(im);
  });
  film.querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest'});
}
document.getElementById('lbClose').addEventListener('click',closeLb);
document.getElementById('lbInfo').addEventListener('click',()=>lb.classList.toggle('info'));
document.getElementById('lbPrev').addEventListener('click',()=>{lbIdx=(lbIdx-1+viewable().length)%viewable().length;renderLb()});
document.getElementById('lbNext').addEventListener('click',()=>{lbIdx=(lbIdx+1)%viewable().length;renderLb()});
function closeLb(){ lb.classList.remove('open','info'); document.body.style.overflow=''; }
lb.addEventListener('click',e=>{ if(e.target===lb.querySelector('.stage')) closeLb(); });
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') document.getElementById('lbPrev').click();
  if(e.key==='ArrowRight') document.getElementById('lbNext').click();
  if(e.key==='i') lb.classList.toggle('info');
});

layout();
addEventListener('resize',layout);
</script>
