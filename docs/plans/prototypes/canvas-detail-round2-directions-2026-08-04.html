<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixelVault · 详情展开层 Round 2</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17191d;
        --muted: #6e737b;
        --line: #dfe2e7;
        --line-strong: #cfd3d9;
        --paper: #ffffff;
        --wash: #f4f5f7;
        --well: #e9ebee;
        --accent: #16181c;
        --focus: #2f6df6;
        --danger: #c43c35;
        --shadow: 0 30px 80px rgba(28, 32, 38, 0.17),
          0 8px 24px rgba(28, 32, 38, 0.08);
        --soft-shadow: 0 10px 30px rgba(35, 39, 45, 0.1);
        --radius-panel: 22px;
        --radius-control: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.88), transparent 31%),
          radial-gradient(circle at 82% 82%, rgba(226, 230, 237, 0.64), transparent 34%),
          #e8eaed;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .canvas {
        position: fixed;
        inset: 0;
        background-image: radial-gradient(#bfc3c9 0.8px, transparent 0.8px);
        background-size: 22px 22px;
        opacity: 0.58;
      }

      .canvas::after {
        position: absolute;
        inset: 0;
        content: "";
        background: rgba(244, 245, 247, 0.72);
      }

      .prototype-bar {
        position: fixed;
        z-index: 30;
        top: 14px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 6px;
        transform: translateX(-50%);
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--soft-shadow);
      }

      .prototype-bar button,
      .family-select {
        min-height: 32px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }

      .prototype-bar button {
        padding: 0 13px;
        font-size: 12px;
        font-weight: 700;
      }

      .prototype-bar button[aria-pressed="true"] {
        color: white;
        background: var(--accent);
      }

      .family-select {
        padding: 0 28px 0 10px;
        border-left: 1px solid var(--line);
        border-radius: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .scope-note {
        position: fixed;
        z-index: 20;
        left: 18px;
        bottom: 18px;
        max-width: 280px;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        color: #545a63;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--soft-shadow);
        font-size: 11px;
        line-height: 1.55;
      }

      .overlay {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 74px 30px 26px;
      }

      .panel {
        position: relative;
        display: grid;
        width: min(1240px, calc(100vw - 60px));
        height: min(790px, calc(100vh - 102px));
        min-height: 620px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: var(--radius-panel);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .panel-header {
        position: relative;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 62px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.98);
      }

      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .sigil {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 11px;
        color: #4c5159;
        background: #eceef2;
        font-size: 12px;
        font-weight: 800;
      }

      .crumb {
        margin-bottom: 2px;
        color: #8a8f97;
        font-size: 10px;
      }

      .title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .header-actions {
        display: flex;
        gap: 6px;
      }

      .icon-button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--wash);
      }

      .panel-body {
        position: relative;
        min-width: 0;
        min-height: 0;
      }

      .media-stage {
        position: relative;
        display: grid;
        min-width: 0;
        min-height: 0;
        place-items: center;
        overflow: hidden;
        background: var(--well);
      }

      .media-stage::before {
        position: absolute;
        inset: 0;
        content: "";
        opacity: 0.34;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.75), transparent 36%),
          repeating-linear-gradient(135deg, transparent 0 18px, rgba(255, 255, 255, 0.18) 18px 19px);
      }

      .media-frame {
        position: relative;
        display: grid;
        width: min(100%, 860px);
        max-height: 100%;
        aspect-ratio: 16 / 9;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(55, 61, 70, 0.13);
        border-radius: 14px;
        background:
          radial-gradient(circle at 66% 34%, rgba(232, 159, 128, 0.4), transparent 15%),
          linear-gradient(180deg, #12334c 0%, #17334b 35%, #263d4e 35%, #687681 62%, #283139 63%, #171d22 100%);
        box-shadow: 0 14px 28px rgba(29, 39, 49, 0.2);
      }

      .media-frame::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 34%;
        content: "";
        opacity: 0.52;
        background: repeating-linear-gradient(90deg, transparent 0 74px, rgba(255, 255, 255, 0.15) 75px 77px);
        transform: perspective(300px) rotateX(58deg);
        transform-origin: bottom;
      }

      .media-caption {
        position: absolute;
        z-index: 2;
        right: 12px;
        bottom: 10px;
        display: flex;
        gap: 6px;
        color: white;
        font-family: "Iowan Old Style", "Songti SC", serif;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .media-caption span {
        padding: 5px 7px;
        border-radius: 7px;
        background: rgba(12, 15, 18, 0.55);
      }

      .empty-mark {
        position: relative;
        z-index: 2;
        display: none;
        text-align: center;
      }

      .empty-mark strong {
        display: block;
        margin-top: 8px;
        font-size: 14px;
      }

      .empty-mark small {
        color: var(--muted);
        font-size: 11px;
      }

      .character-grid {
        position: relative;
        z-index: 2;
        display: none;
        width: min(86%, 720px);
        grid-template-columns: 1.55fr 1fr 1fr;
        gap: 10px;
      }

      .character-grid div {
        min-height: 240px;
        border-radius: 12px;
        background:
          radial-gradient(circle at 50% 30%, #f2d6c7 0 12%, transparent 12.5%),
          linear-gradient(160deg, #777f8d 0 50%, #d7dbe1 50% 100%);
        box-shadow: inset 0 0 0 1px rgba(37, 42, 49, 0.1);
      }

      .character-grid div:nth-child(2) {
        background:
          radial-gradient(circle at 50% 31%, #efd2c1 0 12%, transparent 12.5%),
          linear-gradient(160deg, #8f776e 0 50%, #d9d0ca 50% 100%);
      }

      .character-grid div:nth-child(3) {
        background:
          radial-gradient(circle at 50% 32%, #f0d6c5 0 12%, transparent 12.5%),
          linear-gradient(160deg, #5d6571 0 50%, #c9cdd3 50% 100%);
      }

      body[data-family="shot"] .media-frame,
      body[data-family="frame"] .media-frame {
        display: none;
      }

      body[data-family="shot"] .empty-mark,
      body[data-family="frame"] .empty-mark {
        display: block;
      }

      body[data-family="character"] .media-frame,
      body[data-family="character"] .empty-mark {
        display: none;
      }

      body[data-family="character"] .character-grid {
        display: grid;
      }

      .workbench {
        min-width: 0;
        min-height: 0;
        background: var(--paper);
      }

      .section {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: 0;
      }

      .section-kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .prompt {
        width: 100%;
        min-height: 92px;
        resize: none;
        border: 0;
        outline: 0;
        color: #262a30;
        background: transparent;
        font-size: 13px;
        line-height: 1.62;
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .chip,
      .link-button,
      .model-trigger {
        min-height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        background: white;
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
      }

      .chip,
      .link-button {
        padding: 0 11px;
      }

      .model-trigger {
        display: flex;
        flex: 1 1 180px;
        align-items: center;
        justify-content: space-between;
        padding: 0 11px;
      }

      .model-trigger span:first-child::before {
        margin-right: 7px;
        content: "●";
        color: #21a36a;
        font-size: 8px;
      }

      .link-button {
        border-color: transparent;
        background: var(--wash);
      }

      .references {
        display: grid;
        gap: 7px;
      }

      .reference-row {
        display: grid;
        min-height: 42px;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 9px;
        padding: 5px;
        border-radius: 11px;
        background: var(--wash);
      }

      .reference-thumb {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(140deg, #8b9cac, #d9c5b7);
      }

      .reference-row strong {
        display: block;
        font-size: 11px;
      }

      .reference-row small {
        color: var(--muted);
        font-size: 9px;
      }

      .quiet-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 36px;
        color: var(--muted);
        font-size: 10px;
      }

      .action-dock {
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 58px;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 -9px 22px rgba(25, 29, 35, 0.05);
      }

      .action-meta strong {
        display: block;
        font-size: 11px;
      }

      .action-meta small {
        color: var(--muted);
        font-size: 9px;
      }

      .primary-action {
        min-width: 122px;
        min-height: 38px;
        padding: 0 18px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: var(--accent);
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }

      .asset-manager {
        display: none;
        min-height: 0;
        overflow: auto;
        background: #fafbfc;
      }

      .asset-manager[data-open="true"] {
        display: block;
      }

      .asset-head {
        position: sticky;
        z-index: 2;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        background: #fafbfc;
      }

      .asset-head strong {
        font-size: 12px;
      }

      .asset-tabs {
        display: flex;
        gap: 4px;
        padding: 10px 12px;
      }

      .asset-tabs button {
        flex: 1;
        min-height: 30px;
        border: 0;
        border-radius: 9px;
        color: var(--muted);
        background: transparent;
        font-size: 10px;
      }

      .asset-tabs button:first-child {
        color: var(--ink);
        background: #e9ecf0;
      }

      .asset-empty {
        display: grid;
        min-height: 150px;
        place-items: center;
        padding: 20px;
        color: var(--muted);
        text-align: center;
        font-size: 10px;
      }

      .model-menu {
        position: absolute;
        z-index: 12;
        right: 18px;
        bottom: 68px;
        display: none;
        width: 310px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: white;
        box-shadow: var(--soft-shadow);
      }

      .model-menu[data-open="true"] {
        display: block;
      }

      .model-search {
        margin: 10px;
        width: calc(100% - 20px);
        min-height: 38px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
      }

      .provider {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        align-items: center;
        gap: 9px;
        min-height: 50px;
        padding: 6px 11px;
      }

      .provider:hover {
        background: var(--wash);
      }

      .provider-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 9px;
        background: #eef0f3;
        font-size: 10px;
        font-weight: 800;
      }

      .provider strong {
        display: block;
        font-size: 11px;
      }

      .provider small,
      .provider > span:last-child {
        color: var(--muted);
        font-size: 9px;
      }

      /* Direction A — media-first split studio */
      body[data-direction="A"] .panel {
        grid-template-rows: 62px minmax(0, 1fr) 58px;
      }

      body[data-direction="A"] .panel-body {
        display: grid;
        grid-template-columns: minmax(0, 1.72fr) minmax(330px, 0.78fr);
      }

      body[data-direction="A"] .media-stage {
        padding: 20px;
        border-right: 1px solid var(--line);
      }

      body[data-direction="A"] .workbench {
        overflow-y: auto;
      }

      body[data-direction="A"] .model-menu {
        top: 150px;
        bottom: auto;
      }

      body[data-direction="A"] .asset-manager {
        position: absolute;
        top: 206px;
        right: 0;
        bottom: 0;
        width: 31.8%;
        min-width: 330px;
        border-left: 1px solid var(--line);
        box-shadow: -16px 0 32px rgba(36, 40, 46, 0.08);
      }

      /* Direction B — full-width stage + command deck */
      body[data-direction="B"] .panel {
        grid-template-rows: 62px minmax(0, 1fr) 58px;
      }

      body[data-direction="B"] .panel-body {
        display: grid;
        grid-template-rows: minmax(330px, 1.48fr) minmax(210px, 0.72fr);
      }

      body[data-direction="B"] .media-stage {
        padding: 16px 38px;
        border-bottom: 1px solid var(--line);
      }

      body[data-direction="B"] .media-frame {
        width: min(92%, 930px);
      }

      body[data-direction="B"] .workbench {
        display: grid;
        grid-template-columns: 1.25fr 0.82fr 0.72fr;
        overflow: hidden;
      }

      body[data-direction="B"] .workbench .section {
        overflow: auto;
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      body[data-direction="B"] .workbench .section:last-child {
        border-right: 0;
      }

      body[data-direction="B"] .asset-manager {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 55.2%;
        height: 220px;
        border-left: 1px solid var(--line);
        border-top: 1px solid var(--line);
        box-shadow: 0 -18px 30px rgba(36, 40, 46, 0.08);
      }

      body[data-direction="B"] .asset-manager .asset-empty {
        min-height: 78px;
      }

      body[data-direction="B"] .asset-tabs {
        max-width: 420px;
      }

      /* Direction C — adaptive three-rail console */
      body[data-direction="C"] .panel {
        width: min(1320px, calc(100vw - 38px));
        grid-template-rows: 62px minmax(0, 1fr) 58px;
      }

      body[data-direction="C"] .panel-body {
        display: grid;
        grid-template-columns: minmax(270px, 0.68fr) minmax(460px, 1.7fr) minmax(250px, 0.62fr);
      }

      body[data-direction="C"] .workbench {
        grid-column: 1;
        grid-row: 1;
        overflow-y: auto;
        border-right: 1px solid var(--line);
      }

      body[data-direction="C"] .media-stage {
        grid-column: 2;
        grid-row: 1;
        padding: 18px;
      }

      body[data-direction="C"] .asset-manager {
        display: block;
        grid-column: 3;
        grid-row: 1;
        border-left: 1px solid var(--line);
      }

      body[data-direction="C"] .asset-manager:not([data-open="true"]) .asset-head strong {
        font-size: 0;
      }

      body[data-direction="C"] .asset-manager:not([data-open="true"]) .asset-head strong::after {
        content: "关系与素材";
        font-size: 12px;
      }

      body[data-direction="C"] .asset-manager:not([data-open="true"]) .asset-empty::before {
        content: "参考图 0/3 · LoRA 0/5\A\A还没有被其他节点使用";
        white-space: pre;
      }

      body[data-direction="C"] .asset-manager:not([data-open="true"]) .asset-empty span,
      body[data-direction="C"] .asset-manager:not([data-open="true"]) .asset-tabs {
        display: none;
      }

      body[data-direction="C"] .model-menu {
        top: 150px;
        right: auto;
        bottom: auto;
        left: 18px;
      }

      body[data-family="character"] .primary-action {
        display: none;
      }

      body[data-family="character"] .action-meta strong::before {
        content: "编辑自动保存";
      }

      body[data-family="character"] .action-meta strong,
      body[data-family="character"] .action-meta small {
        font-size: 0;
      }

      body[data-family="character"] .action-meta small::before {
        content: "本页不生成图片，只维护身份与参考素材";
        color: var(--muted);
        font-size: 9px;
      }

      body[data-family="character"] .action-meta strong::before {
        font-size: 11px;
      }

      @media (max-width: 980px) {
        .scope-note {
          display: none;
        }

        .overlay {
          padding-right: 14px;
          padding-left: 14px;
        }

        .panel,
        body[data-direction="C"] .panel {
          width: calc(100vw - 28px);
        }

        body[data-direction="A"] .panel-body,
        body[data-direction="C"] .panel-body {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(300px, 1fr) minmax(220px, 0.72fr);
        }

        body[data-direction="A"] .media-stage,
        body[data-direction="C"] .media-stage {
          grid-column: 1;
          grid-row: 1;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        body[data-direction="A"] .workbench,
        body[data-direction="C"] .workbench {
          grid-column: 1;
          grid-row: 2;
          border-right: 0;
        }

        body[data-direction="C"] .asset-manager,
        body[data-direction="A"] .asset-manager {
          position: absolute;
          right: 0;
          bottom: 0;
          left: 0;
          width: auto;
          height: 230px;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        body[data-direction="B"] .workbench {
          grid-template-columns: 1.25fr 1fr;
        }

        body[data-direction="B"] .workbench .section:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body data-direction="A" data-family="video">
    <div class="canvas" aria-hidden="true"></div>

    <nav class="prototype-bar" aria-label="方向与状态切换">
      <button type="button" data-direction-button="A" aria-pressed="true">A 媒体优先</button>
      <button type="button" data-direction-button="B" aria-pressed="false">B 上下分幕</button>
      <button type="button" data-direction-button="C" aria-pressed="false">C 三轨控制</button>
      <select class="family-select" aria-label="节点族">
        <option value="video">视频生成 · 有内容</option>
        <option value="image">散图 · 有内容</option>
        <option value="shot">镜头图 · 空状态</option>
        <option value="frame">关键帧 · 空状态</option>
        <option value="character">角色 · 图集</option>
      </select>
    </nav>

    <p class="scope-note">
      仅比较详情展开层结构。首页、项目侧栏、节点卡空态与“收集”菜单不进入本轮方向。
    </p>

    <main class="overlay">
      <article class="panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <header class="panel-header">
          <div class="identity">
            <span class="sigil" aria-hidden="true">V</span>
            <div>
              <div class="crumb">画布 / <span data-family-crumb>视频生成</span></div>
              <div class="title" id="detail-title" data-family-title>镜头 07 · 海上夜景</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="icon-button" type="button" aria-label="适应窗口">↙↗</button>
            <button class="icon-button" type="button" aria-label="收起">×</button>
          </div>
        </header>

        <div class="panel-body">
          <section class="media-stage" aria-label="主体媒体">
            <div class="media-frame">
              <div class="media-caption"><span>00:05</span><span>16:9 · 720P</span></div>
            </div>
            <div class="empty-mark">
              <div aria-hidden="true">▧</div>
              <strong data-empty-title>添加镜头图</strong>
              <small>上传、从素材库选择，或直接生成</small>
            </div>
            <div class="character-grid" aria-label="角色参考图集">
              <div></div><div></div><div></div>
            </div>
          </section>

          <aside class="workbench" aria-label="编辑区">
            <section class="section">
              <div class="section-kicker"><span>本次编辑</span><span>0 / 2000</span></div>
              <textarea class="prompt" aria-label="生成提示词">5 秒镜头。人物靠在甲板栏杆旁，远处灯塔划过海面，风吹动衣角，镜头缓慢向前推进。</textarea>
              <div class="control-row">
                <button class="model-trigger" type="button" data-model-trigger>
                  <span>Seedance · 快速</span><span>⌄</span>
                </button>
                <button class="chip" type="button">720P · 5 秒 · 16:9 ⌄</button>
              </div>
            </section>

            <section class="section">
              <div class="section-kicker"><span>参考素材</span><span>0 / 3</span></div>
              <div class="control-row">
                <button class="link-button" type="button" data-manager-trigger>管理素材</button>
                <button class="link-button" type="button">素材库</button>
                <button class="link-button" type="button">Studio ↗</button>
              </div>
              <div class="references">
                <div class="reference-row">
                  <span class="reference-thumb"></span>
                  <span><strong>甲板夜景</strong><small>图片 · 上游节点</small></span>
                  <span aria-hidden="true">×</span>
                </div>
              </div>
            </section>

            <section class="section">
              <div class="quiet-line"><span>被 2 个节点使用</span><span>查看关系 →</span></div>
              <div class="quiet-line"><span>发送预览</span><span>6 项 ⌄</span></div>
            </section>
          </aside>

          <aside class="asset-manager" data-asset-manager data-open="false" aria-label="管理素材">
            <div class="asset-head"><strong>管理素材</strong><button class="icon-button" type="button" data-manager-close aria-label="关闭素材管理">×</button></div>
            <div class="asset-tabs"><button type="button">全部</button><button type="button">角色</button><button type="button">场景</button><button type="button">镜头</button></div>
            <div class="asset-empty"><span>没有匹配的素材<br />从底部动作添加，输入框始终保持可见。</span></div>
          </aside>

          <div class="model-menu" data-model-menu data-open="false" role="dialog" aria-label="选择视频模型">
            <input class="model-search" aria-label="搜索模型" placeholder="搜索视频模型…" />
            <div class="provider"><span class="provider-mark">V</span><span><strong>VolcEngine</strong><small>Seedance · 3 个模型</small></span><span>›</span></div>
            <div class="provider"><span class="provider-mark">F</span><span><strong>fal.ai</strong><small>8 个视频模型</small></span><span>›</span></div>
            <div class="provider"><span class="provider-mark">M</span><span><strong>MiniMax</strong><small>4 个视频模型</small></span><span>›</span></div>
          </div>
        </div>

        <footer class="action-dock">
          <div class="action-meta"><strong>全能参考</strong><small>当前素材可直接生成</small></div>
          <button class="primary-action" type="button" data-primary-action>重新生成视频</button>
        </footer>
      </article>
    </main>

    <script>
      const familyData = {
        video: { sigil: 'V', crumb: '视频生成', title: '镜头 07 · 海上夜景', empty: '', action: '重新生成视频' },
        image: { sigil: 'I', crumb: '图片', title: 'image.png', empty: '', action: '重新生成图片' },
        shot: { sigil: 'S', crumb: '镜头图', title: '镜头 07 · 主画面', empty: '添加镜头图', action: '生成镜头图' },
        frame: { sigil: 'F', crumb: '关键帧', title: '镜头 07 · 首帧', empty: '添加关键帧', action: '生成关键帧' },
        character: { sigil: 'C', crumb: '角色', title: '米塔 · 角色档案', empty: '', action: '' },
      };

      const params = new URLSearchParams(location.search);
      const initialView = params.get('view')?.split('-');
      const initialDirection = params.get('direction');
      const initialFamily = params.get('family');
      const requestedDirection = initialView?.[0] ?? initialDirection;
      const requestedFamily = initialView?.[1] ?? initialFamily;
      if (['A', 'B', 'C'].includes(requestedDirection)) document.body.dataset.direction = requestedDirection;
      if (Object.hasOwn(familyData, requestedFamily)) document.body.dataset.family = requestedFamily;

      const directionButtons = [...document.querySelectorAll('[data-direction-button]')];
      const familySelect = document.querySelector('.family-select');
      const assetManager = document.querySelector('[data-asset-manager]');
      const modelMenu = document.querySelector('[data-model-menu]');
      if (initialView?.[2] === 'manager') assetManager.dataset.open = 'true';
      if (initialView?.[2] === 'model') modelMenu.dataset.open = 'true';

      function syncDirection() {
        directionButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.directionButton === document.body.dataset.direction));
        });
      }

      function syncFamily() {
        const data = familyData[document.body.dataset.family];
        document.querySelector('.sigil').textContent = data.sigil;
        document.querySelector('[data-family-crumb]').textContent = data.crumb;
        document.querySelector('[data-family-title]').textContent = data.title;
        document.querySelector('[data-empty-title]').textContent = data.empty;
        document.querySelector('[data-primary-action]').textContent = data.action;
        familySelect.value = document.body.dataset.family;
      }

      directionButtons.forEach((button) => {
        button.addEventListener('click', () => {
          document.body.dataset.direction = button.dataset.directionButton;
          assetManager.dataset.open = 'false';
          syncDirection();
        });
      });

      familySelect.addEventListener('change', () => {
        document.body.dataset.family = familySelect.value;
        syncFamily();
      });

      document.querySelector('[data-manager-trigger]').addEventListener('click', () => {
        assetManager.dataset.open = assetManager.dataset.open === 'true' ? 'false' : 'true';
      });

      document.querySelector('[data-manager-close]').addEventListener('click', () => {
        assetManager.dataset.open = 'false';
      });

      document.querySelector('[data-model-trigger]').addEventListener('click', () => {
        modelMenu.dataset.open = modelMenu.dataset.open === 'true' ? 'false' : 'true';
      });

      syncDirection();
      syncFamily();
    </script>
  </body>
</html>
