<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 C · 装配抽屉 — Assets 独立设计（Claude）</title>
<style>
  :root{
    --bg:#eceef0; --panel:#f7f8f9; --panel2:#ffffff; --well:#e1e4e7;
    --line:#d6dade; --line2:#c3c8ce;
    --ink:#212428; --sub:#5c6167; --dim:#878c93;
    --amber:#9a5a08;
    --nav-w:56px; --drawer-w:320px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  .num{font-variant-numeric:tabular-nums}

  /* 全局导航（现状示意） */
  .gnav{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:#f2f3f5;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:40}
  .gnav .logo{width:26px;height:26px;border-radius:7px;background:#25282c;display:grid;place-items:center;font-weight:700;font-size:12px;color:#eee;margin-bottom:10px}
  .gnav .it{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#9aa0a7}
  .gnav .it.on{background:#e2e5e8;color:#2c2f33}
  .gnav svg{width:17px;height:17px}

  /* 顶栏 */
  .bar{position:fixed;top:0;left:var(--nav-w);right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in oklab,var(--bg) 84%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30}
  .brand{display:flex;align-items:baseline;gap:8px;flex:none}
  .brand b{font-size:15px;font-weight:650}
  .crumb{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;flex:none}
  .crumb .seg{color:var(--dim)}
  .crumb .seg.cur{color:var(--ink);font-weight:550}
  .crumb svg{width:12px;height:12px;color:var(--dim)}
  .crumb:hover{border-color:#a9b0b8}
  .search{flex:1 1 180px;max-width:340px;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--well);border:1px solid transparent;border-radius:8px;color:var(--dim)}
  .search:focus-within{background:var(--panel2);border-color:var(--line2)}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--ink)}
  .spacer{flex:1}
  .tfilter{display:flex;gap:2px;padding:3px;background:var(--well);border-radius:9px}
  .tfilter button{width:31px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
  .tfilter button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,25,.08)}
  .tfilter svg{width:15px;height:15px}
  .btn{height:34px;padding:0 13px;border-radius:8px;display:flex;align-items:center;gap:7px;font-weight:500;flex:none}
  .btn svg{width:14px;height:14px}
  .btn.pri{background:#25282c;color:#f2f3f4}
  .btn.pri:hover{background:#101215}
  .btn.gho{border:1px solid var(--line2)}
  .btn.gho:hover{background:var(--panel2)}
  .btn.gho.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--ink)}
  .dens{display:flex;gap:2px;padding:3px;background:var(--well);border-radius:9px}
  .dens button{width:25px;height:28px;border-radius:6px;color:var(--dim);font-size:11px;font-weight:600}
  .dens button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,25,.08)}

  /* 中央大河 */
  main{padding:74px 20px 60px calc(var(--nav-w) + 20px);transition:padding-right .2s}
  body.drawer main{padding-right:calc(var(--drawer-w) + 20px)}
  .row-j{display:flex;gap:7px;margin-bottom:7px}
  .tile{position:relative;border-radius:5px;overflow:hidden;background:var(--panel2);flex:none;cursor:pointer;box-shadow:0 1px 2px rgba(25,28,32,.1)}
  .tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile.cur{box-shadow:0 0 0 2px var(--ink),0 1px 2px rgba(25,28,32,.1)}
  .tile .veil{position:absolute;inset:auto 0 0 0;padding:24px 9px 7px;background:linear-gradient(transparent,rgba(18,20,23,.72));opacity:0;transition:opacity .13s;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .tile:hover .veil{opacity:1}
  .tile .veil .m{font-size:11px;color:#f0f1f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .veil .wh{font-size:10px;color:#c8cbd0}
  .tile .badge{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:rgba(20,22,25,.7);backdrop-filter:blur(4px);font-size:10px;color:#e2e4e6}
  .tile:hover .badge{opacity:0}
  .tile .badge svg{width:11px;height:11px}
  .vskin{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#33363b 0%,#26292d 55%,#2d3034 100%)}
  .vskin svg{width:22px;height:22px;color:#7d838a}
  .tile.audio .cover{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 20%,#fdfdfd,#e6e9ec)}
  .tile.audio .cover .ring{width:46%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
  .tile.audio .cover .ring::before{content:"";width:62%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line)}
  .tile .play{position:absolute;left:50%;top:50%;translate:-50% -50%;width:34px;height:34px;border-radius:50%;background:rgba(28,30,34,.86);display:grid;place-items:center;opacity:0;transition:.13s}
  .tile .play svg{width:14px;height:14px;color:#fff;margin-left:2px}
  .tile.audio .play{opacity:.95}
  .tile.video:hover .play{opacity:1}

  /* ── 右抽屉 ── */
  .dock{position:fixed;top:56px;right:0;bottom:0;width:var(--drawer-w);background:var(--panel);border-left:1px solid var(--line);z-index:35;display:none;flex-direction:column}
  body.drawer .dock{display:flex}
  /* 上窗格 · 目录 */
  .dtree{flex:1 1 52%;min-height:120px;overflow:auto;padding:12px}
  .dtree .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dtree .dhead h3{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.06em}
  .dtree .dhead button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--sub)}
  .dtree .dhead button:hover{background:var(--well)}
  .dtree .dhead svg{width:14px;height:14px}
  .tsearch{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;background:var(--well);border-radius:7px;color:var(--dim);margin-bottom:8px}
  .tsearch input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:12px}
  .trow{display:flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:7px;width:100%;text-align:left;font-size:12.5px;color:var(--ink);position:relative}
  .trow:hover{background:var(--well)}
  .trow.on{background:var(--well);box-shadow:inset 2px 0 0 var(--ink)}
  .trow svg{width:14px;height:14px;color:var(--dim);flex:none}
  .trow .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .cnt{font-size:11px;color:var(--dim)}
  .trow.sub{padding-left:28px}
  .trow.dropover{background:#dfe7f0;box-shadow:inset 0 0 0 1.5px #4a6b96}
  .trow .amber{color:var(--amber)}
  .tline{height:1px;background:var(--line);margin:8px 4px}
  /* 分割线 */
  .dsplit{height:5px;flex:none;cursor:row-resize;position:relative;background:var(--bg);border-block:1px solid var(--line)}
  .dsplit::after{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;width:32px;height:3px;border-radius:2px;background:var(--line2)}
  /* 下窗格 · 检视 */
  .dinspect{flex:1 1 48%;min-height:140px;overflow:auto;padding:14px}
  .dinspect .empty-stat{color:var(--sub);font-size:12px;line-height:1.7}
  .dinspect .empty-stat b{font-size:20px;font-weight:650;color:var(--ink);display:block;margin-bottom:2px}
  .dinspect .typebar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:10px 0 6px;background:var(--well)}
  .dinspect .typebar i{height:100%}
  .dinspect .tl{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .dinspect .tl i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:baseline}
  .pv{border-radius:8px;overflow:hidden;background:var(--well);margin-bottom:12px;display:grid;place-items:center}
  .pv img,.pv video{max-width:100%;max-height:220px;object-fit:contain;display:block}
  .dinspect h5{font-size:13px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dinspect .sub2{font-size:11.5px;color:var(--dim);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--sub)}
  .kv b{color:var(--ink);font-weight:500;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dprompt{font-size:12px;color:var(--sub);line-height:1.6;margin:10px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .dacts button{height:29px;padding:0 11px;border:1px solid var(--line2);border-radius:7px;font-size:12px;background:var(--panel2)}
  .dacts button:hover{border-color:#9aa2ab}
  .dacts .full{width:100%;justify-content:center;display:flex;align-items:center;gap:6px}
  /* 多选面板 */
  .dbatch .bign{font-size:20px;font-weight:650}
  .dbatch .thumbs{display:flex;margin:10px 0}
  .dbatch .thumbs img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:2px solid var(--panel);margin-left:-8px}
  .dbatch .thumbs img:first-child{margin-left:0}

  /* 拖拽替身 */
  .ghost{position:fixed;pointer-events:none;z-index:99;width:64px;height:64px;border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(20,22,26,.35);display:none}
  .ghost img{width:100%;height:100%;object-fit:cover}

  /* 提示条（回流） */
  .toastflow{position:fixed;top:66px;left:50%;translate:-50%;display:flex;align-items:center;gap:9px;height:36px;padding:0 8px 0 14px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(22,24,28,.12);z-index:45;font-size:12.5px}
  .toastflow i{width:6px;height:6px;border-radius:50%;background:var(--amber);font-style:normal}
  .toastflow button{height:26px;padding:0 10px;border-radius:13px;background:var(--well);font-size:12px;font-weight:550}
  .toastflow button:hover{background:var(--line)}

  .tag-proto{position:fixed;left:12px;bottom:12px;z-index:80;font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="drawer">

<nav class="gnav" aria-label="全局导航（现状，非本设计对象）">
  <div class="logo">P</div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div>
  <div class="it on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9m5 11V4m5 16v-8m5 8V6"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 15-4.35-4.35a1 1 0 0 0-1.42 0L8 18"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></div>
  <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v10.5a3.5 3.5 0 1 1-2-3.16"/><path d="M12 3c1.5 2 3.5 3 6 3"/></svg></div>
</nav>

<header class="bar">
  <div class="brand"><b>素材</b></div>
  <button class="crumb">
    <span class="seg">全部素材</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    <span class="seg cur">未分类</span>
    <span class="seg num" style="margin-left:2px">156</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input placeholder="搜索提示词、模型…"></label>
  <div class="spacer"></div>
  <div class="tfilter" role="group" aria-label="媒体类型">
    <button class="on" title="图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 15-4.35-4.35a1 1 0 0 0-1.42 0L8 18"/></svg></button>
    <button class="on" title="视频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></button>
    <button class="on" title="音频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v10.5a3.5 3.5 0 1 1-2-3.16"/><path d="M12 3c1.5 2 3.5 3 6 3"/></svg></button>
    <button class="on" title="3D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="M12 11 4 6.5M12 11l8-4.5M12 11v9"/></svg></button>
  </div>
  <button class="btn pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0 5 5m-5-5L7 9"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>上传</button>
  <button class="btn gho">选择</button>
  <div class="dens"><button>S</button><button class="on">M</button><button>L</button></div>
  <button class="btn gho on" id="drawerBtn" title="抽屉">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
</header>

<div class="toastflow" role="status">
  <i></i><span><b>3</b> 个新资源已回流</span>
  <button>查看</button>
</div>

<main id="river" aria-label="素材流"></main>

<!-- 右抽屉：上=目录 下=检视 -->
<aside class="dock" aria-label="目录与检视抽屉">
  <div class="dtree">
    <div class="dhead">
      <h3>目录</h3>
      <button title="新建文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <label class="tsearch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input placeholder="搜索文件夹…"></label>
    <button class="trow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">全部素材</span><span class="cnt num">496</span></button>
    <button class="trow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 1 1 7.5-6.6 5 5 0 1 1 7.5 6.6Z"/></svg><span class="lbl">收藏</span><span class="cnt num">23</span></button>
    <button class="trow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg><span class="lbl">已发布</span><span class="cnt num">41</span></button>
    <div class="tline"></div>
    <button class="trow on drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl amber">未分类</span><span class="cnt num amber">156</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">鸣潮</span><span class="cnt num">34</span></button>
    <button class="trow sub drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">dainia</span><span class="cnt num">24</span></button>
    <button class="trow sub drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">aimisi</span><span class="cnt num">14</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">ba</span><span class="cnt num">12</span></button>
    <button class="trow sub drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">キサキ</span><span class="cnt num">5</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">姿势参照图</span><span class="cnt num">12</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">AI 拟人化工程</span><span class="cnt num">15</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">Mygo</span><span class="cnt num">5</span></button>
    <button class="trow drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span class="lbl">3d</span><span class="cnt num">13</span></button>
  </div>
  <div class="dsplit" title="拖动调整分割"></div>
  <div class="dinspect" id="dinspect">
    <!-- 默认：范围统计（由 JS 填充） -->

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const GAP=7, TH=218;
let curTile=null;

function tile(it,w,h){
  const d=document.createElement('div');
  d.className='tile'+(it.a?' audio':'')+(it.v?' video':'');
  d.style.width=w+'px'; d.style.height=h+'px'; d.tabIndex=0;
  d.draggable=!it.a;
  if(it.a){
    d.innerHTML=`<div class="cover"><div class="ring"></div></div><button class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span class="badge">♪ ${it.dur}</span>`;
  } else if(it.v){
    d.innerHTML=`<video muted preload="metadata" onloadedmetadata="this.currentTime=0.05" src="${it.u}"></video><span class="vskin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></span><button class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>${it.dur}</span><div class="veil"><span class="m">${it.m}</span><span class="wh num">${it.w}×${it.h}</span></div>`;
    const v=d.querySelector('video');
    v.addEventListener('seeked',()=>d.querySelector('.vskin')?.remove(),{once:true});
    d.addEventListener('mouseenter',()=>{d.querySelector('.vskin')?.remove();v.play().catch(()=>{})});
    d.addEventListener('mouseleave',()=>{v.pause();v.currentTime=0});
  } else {
    d.innerHTML=`<img loading="lazy" src="${it.u}" alt="">${it.m3?'<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="M12 11 4 6.5M12 11l8-4.5M12 11v9"/></svg>3D</span>':''}<div class="veil"><span class="m">${it.p||it.m}</span><span class="wh num">${it.w}×${it.h}</span></div>`;
  }
  d.addEventListener('click',()=>{
    curTile?.classList.remove('cur');
    d.classList.add('cur'); curTile=d;
    inspect(it);
  });
  d.addEventListener('dragstart',e=>{
    e.dataTransfer.setData('text/plain','asset');
    const g=document.getElementById('ghost');
    if(!it.v&&!it.a){ g.querySelector('img').src=it.u; g.style.display='block';
      e.dataTransfer.setDragImage(g,32,32); }
    setTimeout(()=>g.style.display='none');
  });
  return d;
}

function layout(){
  const river=document.getElementById('river');
  river.innerHTML='';
  const W=river.clientWidth-40;
  let buf=[],arSum=0;
  const flush=(force)=>{
    if(!buf.length)return;
    let h=(W-GAP*(buf.length-1))/arSum;
    if(force&&h>TH)h=TH;
    h=Math.min(h,TH*1.3);
    const row=document.createElement('div');row.className='row-j';
    for(const it of buf){row.appendChild(tile(it,Math.floor(h*clamp(it.ar,0.5,2.2)),Math.floor(h)))}
    river.appendChild(row);buf=[];arSum=0;
  };
  for(const it of ASSETS){
    if(it.ar>2.2){flush(false);
      const h=Math.min(TH*1.25,W/it.ar);
      const row=document.createElement('div');row.className='row-j';
      row.appendChild(tile(it,Math.floor(h*it.ar),Math.floor(h)));
      river.appendChild(row);continue;}
    buf.push(it);arSum+=clamp(it.ar,0.5,2.2);
    if(arSum*TH>=W-GAP*(buf.length-1))flush(false);
  }
  flush(true);
}

function inspect(it){
  const el=document.getElementById('dinspect');
  const pv = it.a
    ? `<div class="pv" style="aspect-ratio:2.4;background:radial-gradient(120% 120% at 30% 20%,#fdfdfd,#e6e9ec)"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5c6167" stroke-width="1.5"><path d="M12 3v10.5a3.5 3.5 0 1 1-2-3.16"/><path d="M12 3c1.5 2 3.5 3 6 3"/></svg></div>`
    : it.v
    ? `<div class="pv"><video muted autoplay loop src="${it.u}"></video></div>`
    : `<div class="pv"><img src="${it.u}" alt=""></div>`;
  el.innerHTML=`${pv}
    <h5>${it.p||it.name||it.m}</h5>
    <div class="sub2 num">${it.a?'音频 · '+it.dur:it.v?'视频 · '+it.dur:it.w+' × '+it.h}${it.fresh?' · <span style="color:var(--amber)">新回流</span>':''}</div>
    <div class="kv"><span>模型</span><b>${it.m}</b></div>
    <div class="kv"><span>日期</span><b class="num">${it.d}</b></div>
    <div class="kv"><span>文件夹</span><b>未分类</b></div>
    ${it.p?`<p class="dprompt">${it.p}</p>`:''}
    <div class="dacts">
      <button>♡ 收藏</button><button>移动到…</button><button>下载</button><button>作参考图</button>
      <button class="full">打开完整详情 ⤢</button>
    </div>`;
}
