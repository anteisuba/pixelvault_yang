<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="">
  <!--
    音频素材的系统默认封面（回退链最后一级）。
    ⛔ 这里**故意不画波形**：`docs/references/pages/assets.md` §6 明写
    「没有真实波形数据时不画伪波形」—— 旧版画了 10 根等间距柱状条 + 一条起伏
    曲线，看着像波形，实际跟这段音频毫无关系，是假信息。
    改成抽象同心环（唱片/共振的语义），与瓦片内 CSS 兜底封面同一套语言。
    浅色中性场，配合 Assets 的白底与暗色药丸角标。
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f8" />
      <stop offset="0.55" stop-color="#efeff1" />
      <stop offset="1" stop-color="#e6e6e9" />
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#field)" />
  <g fill="none" stroke="#0c0c0c" stroke-opacity="0.14">
    <circle cx="320" cy="320" r="148" stroke-width="2" />
    <circle cx="320" cy="320" r="92" stroke-width="2" />
    <circle cx="320" cy="320" r="46" stroke-width="2" />
  </g>
  <circle cx="320" cy="320" r="12" fill="#0c0c0c" fill-opacity="0.18" />
  <circle cx="512" cy="120" r="120" fill="#0c0c0c" fill-opacity="0.03" />
  <circle cx="132" cy="500" r="164" fill="#0c0c0c" fill-opacity="0.025" />
</svg>
