<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作台方向 · 对比 7：画布节点卡</title>
    <style>
      :root {
        --surface: #c5b4b4;
        --dot: rgba(28, 22, 14, 0.14);
        --ink: #171411;
        --ink-2: #4b463f;
        --ink-3: #655f57;
        --fill: #f5f3ef;
        --sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        /* A：现在 —— 圆角 18，两层低不透明阴影（ui-defaults §3.1） */
        --r-node: 18px;
        --sh-node: 0 0 0 1px rgba(16, 18, 24, 0.05), 0 2px 6px rgba(16, 18, 24, 0.05),
          0 12px 28px rgba(16, 18, 24, 0.08);
        --pad-node: 10px;
      }
      body.b {
        /* B：ui-spec §9 —— 圆角 12，`pop` 影，内距 12 */
        --r-node: 12px;
        --sh-node: 0 0 0 1px rgba(16, 18, 24, 0.05), 0 12px 32px rgba(16, 18, 24, 0.14);
        --pad-node: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        background: #e9e6e0;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
      }
      .switch {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #101216;
        color: #fff;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }
      .seg button {
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.72);
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: #fff;
        color: #101216;
        font-weight: 600;
      }
      kbd {
        font-family: var(--mono);
        font-size: 11px;
        opacity: 0.55;
      }
      .hint {
        opacity: 0.6;
        font-size: 12px;
      }
      .canvas {
        position: relative;
        margin: 8px;
        height: calc(100vh - 66px);
        min-height: 520px;
        border-radius: 20px;
        overflow: hidden;
        background-color: var(--surface);
        background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
        background-size: 18px 18px;
      }
      .node {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .node .name {
        font-size: 13px;
        color: var(--ink-2);
      }
      .card {
        border-radius: var(--r-node);
        background: #fff;
        box-shadow: var(--sh-node);
        padding: var(--pad-node);
        transition:
          border-radius 0.2s,
          box-shadow 0.2s,
          padding 0.2s;
      }
      .card.media {
        padding: 0;
        overflow: hidden;
      }
      .card.media img {
        display: block;
        width: 100%;
      }
      .card.empty {
        background: transparent;
        box-shadow: none;
        border: 2px dashed rgba(23, 20, 17, 0.24);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 22px 12px;
        color: var(--ink-3);
        font-size: 11px;
      }
      .card.empty .row {
        display: flex;
        gap: 6px;
      }
      .pill {
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-size: 11px;
      }
      .card.text p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink);
      }
      .card .meta {
        margin-top: 8px;
        display: flex;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--fill);
        color: var(--ink-2);
        font-size: 11px;
      }
      svg.edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .bar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(16, 18, 24, 0.06), 0 1px 2px rgba(16, 18, 24, 0.08),
          0 2px 6px rgba(16, 18, 24, 0.05);
      }
      .bar span {
        width: 32px;
        height: 28px;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="switch" role="toolbar" aria-label="对比开关">
      <span>节点卡</span>
      <span class="seg">
        <button aria-pressed="true" data-v="a">A 现在：圆角 18 · 柔影</button>
        <button aria-pressed="false" data-v="b">B 规范 §9：圆角 12 · 浮层影</button>
      </span>
      <kbd>1 / 2</kbd>
      <span class="hint">只变卡的圆角、影子和内距；底色是你这个项目现在的灰紫</span>
    </div>

    <div class="canvas">
      <svg class="edges" viewBox="0 0 1200 800" preserveAspectRatio="none">
        <path d="M300 250 C 380 250, 400 330, 470 330" stroke="#655f57" stroke-width="1.6" fill="none" />
        <path d="M300 250 C 380 250, 400 140, 470 140" stroke="#655f57" stroke-width="1.6" fill="none" />
        <path d="M700 330 C 760 330, 780 300, 830 300" stroke="#655f57" stroke-width="1.6" fill="none" />
      </svg>

      <div class="node" style="left: 120px; top: 90px; width: 180px">
        <span class="name">生成图</span>
        <div class="card media">
          <img src="../home-v6/media/production/quad/quad-gemini-3-pro.webp" alt="" />
        </div>
      </div>

      <div class="node" style="left: 470px; top: 90px; width: 230px">
        <span class="name">镜头 1 · 馆长巡夜</span>
        <div class="card text">
          <p>闭馆后的大厅，橘猫馆长沿着长椅慢慢走过，停在那幅油画前。</p>
          <div class="meta"><span class="chip">5 秒</span><span class="chip">推镜</span></div>
        </div>
      </div>

      <div class="node" style="left: 470px; top: 290px; width: 230px">
        <span class="name">镜头 2 · 回头</span>
        <div class="card empty">
          上传一张，或从素材库挑
          <div class="row"><span class="pill">上传</span><span class="pill">素材库</span></div>
        </div>
      </div>

      <div class="node" style="left: 830px; top: 250px; width: 220px">
        <span class="name">片段 · 馆长巡夜</span>
        <div class="card media">
          <img src="../home-v6/media/production/quad/quad-seedream-5-0.webp" alt="" />
        </div>
      </div>

      <div class="bar"><span>↖</span><span>✋</span><span>−</span><span>52%</span><span>＋</span><span>⤢</span></div>
    </div>

    <script>
      const set = (v) => {
        document.body.classList.toggle('b', v === 'b')
        document
          .querySelectorAll('.seg button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)))
      }
      document.querySelector('.seg').addEventListener('click', (e) => {
        const b = e.target.closest('button')
        if (b) set(b.dataset.v)
      })
      addEventListener('keydown', (e) => {
        if (e.key === '1') set('a')
        if (e.key === '2') set('b')
      })
      const q = new URLSearchParams(location.search).get('v')
      if (q) set(q)
    </script>
  </body>
</html>
