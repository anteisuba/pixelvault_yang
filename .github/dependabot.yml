version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 5 曾被 4 个长期挂着的 major PR + 1 个分组 PR 占满，新分组开不出来。
    open-pull-requests-limit: 10
    # 新版本发布后先观望几天再提 PR（供应链投毒通常在几天内被撤下）。
    # 只作用于版本更新，安全更新不受影响。
    cooldown:
      default-days: 3
      semver-major-days: 7
    # 生产 / 开发依赖分两组：2026-09～10 的单一大组里一个包（@xyflow/react 的
    # OnNodeDrag 类型变更）类型检查失败，就让整组 40 个包连续红了一个月。
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # three 与 @google/model-viewer 必须成对升级，交给人工。
    #
    # model-viewer 的 peer 是 `three@^0.18x.0`，而 0.x 版本号下 caret 锁死小
    # 版本（^0.183.0 只接受 0.183.x）。dependabot 分组升级不看 peer 约束，会
    # 给出内部矛盾的组合：2026-08-17 的 #210 把 model-viewer 升到 4.3.1（要
    # three ^0.183.0）却同时把 three 升到 0.185.1 → `npm ci` 直接 ERESOLVE，
    # 装都装不上，于是那个 PR 里另外 40 个包（aws-sdk / prisma 等）也跟着全红
    # 打不进来。package.json 里 three 被精确钉在 0.182.0（没有 caret）就是这个
    # 耦合的痕迹。
    #
    # 两个都是直接依赖（three → WireframeModelPreview.tsx，model-viewer →
    # ModelViewerInner.tsx），要升就一起升并真机验 3D 预览，不适合自动化。
    ignore:
      - dependency-name: three
      - dependency-name: '@google/model-viewer'
    labels:
      - dependencies
