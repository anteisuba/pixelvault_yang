<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assets Context Dock — Key Slice</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Segoe UI Variable", "Noto Sans SC", system-ui, sans-serif;
        --ink: #171717;
        --muted: #737373;
        --line: #e7e7e5;
        --surface: #ffffff;
        --wash: #f7f7f5;
        --accent: #181818;
        --dock: 304px;
        --rail: 48px;
        --source: url("file:///C:/Users/15620/AppData/Local/Temp/codex-clipboard-32dd35ec-8692-44a4-a680-31263cb852d1.png");
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #efefed; color: var(--ink); }
      button, input { font: inherit; }
      button { color: inherit; }

      .app {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) var(--dock);
        width: 100vw;
        height: 100vh;
        background: var(--surface);
        transition: grid-template-columns 180ms ease;
      }

      .app[data-dock="closed"] { grid-template-columns: var(--rail) minmax(0, 1fr) 0; }

      .global-rail {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-right: 1px solid var(--line);
        background: #fafafa;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin-bottom: 8px;
        border: 1px solid #d9d9d6;
        border-radius: 8px;
        font-weight: 800;
        font-size: 12px;
      }

      .nav-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #656565;
        font-size: 15px;
      }

      .nav-icon.active { background: #e9e9e6; color: #111; }
      .rail-spacer { flex: 1; }
      .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(145deg, #9eb4cc, #d9c0c9); }

      .workspace { min-width: 0; display: grid; grid-template-rows: 62px 45px minmax(0, 1fr); background: #fff; }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .title { font-size: 17px; font-weight: 720; letter-spacing: -0.02em; }
      .count { margin-left: -8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

      .scope {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 11px;
        border: 1px solid #dededb;
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
        font-weight: 620;
      }

      .scope .folder { color: #d59b1f; }
      .search {
        display: flex;
        align-items: center;
        width: min(340px, 30vw);
        height: 34px;
        margin-left: 4px;
        padding: 0 11px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--wash);
        color: #858585;
        font-size: 12px;
      }

      .toolbar-spacer { flex: 1; }
      .tool-btn {
        height: 34px;
        padding: 0 11px;
        border: 1px solid #dededb;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        font-weight: 620;
      }
      .tool-btn.primary { border-color: #161616; background: #161616; color: #fff; }
      .tool-btn[aria-pressed="true"] { background: #efefec; border-color: #cececa; }

      .filterbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 18px;
        border-bottom: 1px solid #efefed;
      }

      .filter {
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #6d6d6d;
        font-size: 12px;
      }
      .filter.active { background: #191919; color: #fff; }
      .filter-divider { width: 1px; height: 16px; margin: 0 3px; background: var(--line); }
      .filter.more { border: 1px solid var(--line); }

      .library {
        position: relative;
        overflow: auto;
        padding: 12px 14px 22px;
        background: #fcfcfb;
      }

      .new-strip {
        display: flex;
        align-items: center;
        justify-content: center;
        width: max-content;
        height: 28px;
        margin: 0 auto 10px;
        padding: 0 10px;
        border: 1px solid #dfdfdc;
        border-radius: 999px;
        background: rgba(255,255,255,.96);
        color: #555;
        box-shadow: 0 3px 16px rgba(0,0,0,.05);
        font-size: 11px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 180px;
        gap: 8px;
      }

      .asset {
        position: relative;
        overflow: hidden;
        min-width: 0;
        border: 1px solid #e4e4e0;
        border-radius: 7px;
        background-color: #f1f1ee;
        background-image: var(--source);
        background-repeat: no-repeat;
        background-size: 1420px 683px;
        transition: border-color 140ms ease, transform 140ms ease;
      }

      .asset:hover { border-color: #9f9f9a; transform: translateY(-1px); }
      .asset::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); pointer-events: none; }
      .asset .meta { position: absolute; right: 7px; bottom: 7px; padding: 3px 6px; border-radius: 5px; background: rgba(20,20,20,.74); color: #fff; font-size: 9px; letter-spacing: .01em; opacity: 0; transition: opacity 120ms ease; }
      .asset:hover .meta { opacity: 1; }
      .asset.video .kind { position: absolute; left: 7px; top: 7px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.9); font-size: 10px; }
      .a1 { grid-column: span 2; background-position: -54px -61px; }
      .a2 { grid-column: span 3; background-position: -244px -61px; }
      .a3 { grid-column: span 2; background-position: -430px -61px; }
      .a4 { grid-column: span 3; background-position: -620px -61px; }
      .a5 { grid-column: span 2; background-position: -810px -61px; }
      .a6 { grid-column: span 3; background-position: -54px -249px; }
      .a7 { grid-column: span 2; background-position: -244px -249px; }
      .a8 { grid-column: span 3; background-position: -430px -249px; }
      .a9 { grid-column: span 2; background-position: -620px -249px; }
      .a10 { grid-column: span 2; background-position: -810px -249px; }
      .a11 { grid-column: span 4; background-position: -54px -437px; }
      .a12 { grid-column: span 3; background-position: -430px -437px; }
      .a13 { grid-column: span 3; background-position: -620px -437px; }
      .a14 { grid-column: span 2; background-position: -996px -249px; }

      .dock {
        position: relative;
        z-index: 2;
        min-width: 0;
        overflow: hidden;
        border-left: 1px solid var(--line);
        background: #fafaf9;
        opacity: 1;
        transition: opacity 120ms ease;
      }
      .app[data-dock="closed"] .dock { opacity: 0; pointer-events: none; }

      .dock-head {
        display: flex;
        align-items: center;
        height: 54px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }

      .tabs { display: flex; gap: 18px; height: 100%; }
      .tab { position: relative; border: 0; background: transparent; color: #777; font-size: 12px; font-weight: 650; }
      .tab.active { color: #151515; }
      .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #171717; }
      .dock-close { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: #777; }

      .panel { display: none; height: calc(100vh - 54px); overflow: auto; padding: 12px 14px 22px; }
      .panel.active { display: block; }

      .folder-tools { display: grid; grid-template-columns: 1fr 30px; gap: 7px; margin-bottom: 12px; }
      .folder-search { height: 32px; padding: 0 9px; border: 1px solid #dededb; border-radius: 7px; background: #fff; color: #888; font-size: 11px; }
      .add { border: 1px solid #dededb; border-radius: 7px; background: #fff; }
      .section-label { margin: 15px 5px 6px; color: #999; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

      .folder-row {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 0 8px;
        border-radius: 7px;
        color: #444;
        font-size: 12px;
      }
      .folder-row.active { background: #ecece8; color: #111; font-weight: 650; }
      .folder-row.child { padding-left: 26px; }
      .folder-row.grandchild { padding-left: 44px; }
      .folder-row .n { color: #aaa; font-size: 10px; font-variant-numeric: tabular-nums; }
      .folder-row.active .n { color: #666; }

      .detail-cover {
        aspect-ratio: 4 / 3;
        width: 100%;
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background-image: var(--source);
        background-position: -244px -61px;
        background-size: 1420px 683px;
      }
      .detail-title { margin-bottom: 4px; font-size: 13px; font-weight: 700; }
      .detail-sub { color: #888; font-size: 11px; }
      .detail-grid { display: grid; grid-template-columns: 82px 1fr; gap: 9px; margin-top: 18px; font-size: 11px; }
      .detail-grid dt { color: #999; }
      .detail-grid dd { margin: 0; color: #333; }

      @media (max-width: 1280px) {
        .app { grid-template-columns: var(--rail) minmax(0, 1fr); }
        .dock { position: fixed; z-index: 10; right: 0; top: 0; bottom: 0; width: min(320px, calc(100vw - 48px)); box-shadow: -18px 0 44px rgba(0,0,0,.12); transform: translateX(0); transition: transform 180ms ease; }
        .app[data-dock="closed"] .dock { transform: translateX(100%); }
        .search { width: 240px; }
      }
    </style>
  </head>
  <body>
    <div class="app" data-dock="folders">
      <nav class="global-rail" aria-label="全局导航">
        <div class="mark">PV</div>
        <button class="nav-icon">⌂</button>
        <button class="nav-icon">▦</button>
        <button class="nav-icon active" aria-current="page">▥</button>
        <button class="nav-icon">◇</button>
        <button class="nav-icon">◫</button>
        <button class="nav-icon">◉</button>
        <div class="rail-spacer"></div>
        <button class="nav-icon">?</button>
        <div class="avatar"></div>
      </nav>

      <section class="workspace">
        <header class="toolbar">
          <div class="title">素材</div>
          <div class="count">496</div>
          <button class="scope"><span class="folder">▰</span><span>全部素材</span><span>⌄</span></button>
          <div class="search">⌕&nbsp;&nbsp;搜索提示词、模型或来源</div>
          <div class="toolbar-spacer"></div>
          <button class="tool-btn primary">⇧&nbsp; 上传</button>
          <button class="tool-btn">✓&nbsp; 选择</button>
          <button id="dockToggle" class="tool-btn" aria-pressed="true">☷&nbsp; 整理</button>
        </header>

        <div class="filterbar" aria-label="素材筛选">
          <button class="filter active">全部</button>
          <button class="filter">图片</button>
          <button class="filter">视频</button>
          <button class="filter">声音</button>
          <button class="filter">3D</button>
          <div class="filter-divider"></div>
          <button class="filter more">来源⌄</button>
          <button class="filter more">模型⌄</button>
          <button class="filter more">日期⌄</button>
          <div class="toolbar-spacer"></div>
          <button class="filter">最新生成⌄</button>
          <button class="filter more">密度&nbsp; 6</button>
        </div>

        <main class="library">
          <div class="new-strip">3 个新资源已回流 · 查看</div>
          <div class="grid">
            <button class="asset a1"><span class="meta">832 × 1216</span></button>
            <button class="asset a2"><span class="meta">1536 × 1024</span></button>
            <button class="asset a3"><span class="meta">1024 × 1536</span></button>
            <button class="asset a4"><span class="meta">1536 × 1024</span></button>
            <button class="asset a5 video"><span class="kind">▶</span><span class="meta">16:9 · 06s</span></button>
            <button class="asset a6"><span class="meta">1024 × 1536</span></button>
            <button class="asset a7"><span class="meta">1024 × 1024</span></button>
            <button class="asset a8"><span class="meta">1536 × 1024</span></button>
            <button class="asset a9"><span class="meta">1024 × 1024</span></button>
            <button class="asset a10"><span class="meta">832 × 1216</span></button>
            <button class="asset a11"><span class="meta">1792 × 1024</span></button>
            <button class="asset a12 video"><span class="kind">▶</span><span class="meta">16:9 · 10s</span></button>
            <button class="asset a13"><span class="meta">1536 × 1024</span></button>
            <button class="asset a14"><span class="meta">1024 × 1536</span></button>
          </div>
        </main>
      </section>

      <aside class="dock" aria-label="素材上下文面板">
        <div class="dock-head">
          <div class="tabs">
            <button class="tab active" data-panel="folders">目录</button>
            <button class="tab" data-panel="details">详情</button>
          </div>
          <button id="dockClose" class="dock-close" aria-label="关闭面板">×</button>
        </div>

        <div id="foldersPanel" class="panel active">
          <div class="folder-tools">
            <div class="folder-search">⌕&nbsp; 搜索文件夹</div>
            <button class="add" aria-label="新建文件夹">＋</button>
          </div>
          <div class="section-label">智能视图</div>
          <div class="folder-row active"><span>◫</span><span>未分类</span><span class="n">150</span></div>
          <div class="folder-row"><span>♡</span><span>收藏</span><span class="n">32</span></div>
          <div class="folder-row"><span>◷</span><span>最近生成</span><span class="n">48</span></div>
          <div class="section-label">我的目录</div>
          <div class="folder-row"><span>▰</span><span>米诺</span><span class="n">4</span></div>
          <div class="folder-row"><span>▰</span><span>群星璀璨 PV</span><span class="n">7</span></div>
          <div class="folder-row"><span>▾</span><span>ba</span><span class="n">55</span></div>
          <div class="folder-row child"><span>▰</span><span>キサキ</span><span class="n">5</span></div>
          <div class="folder-row"><span>▰</span><span>姿势参照图</span><span class="n">12</span></div>
          <div class="folder-row"><span>▰</span><span>ootd</span><span class="n">10</span></div>
          <div class="folder-row"><span>▾</span><span>AI拟人化工程</span><span class="n">15</span></div>
          <div class="folder-row child"><span>▰</span><span>kimi</span><span class="n">2</span></div>
          <div class="folder-row child"><span>▰</span><span>grok</span><span class="n">2</span></div>
          <div class="folder-row child"><span>▰</span><span>claude</span><span class="n">4</span></div>
          <div class="folder-row child"><span>▰</span><span>openai</span><span class="n">4</span></div>
          <div class="folder-row"><span>▰</span><span>测试</span><span class="n">38</span></div>
          <div class="folder-row"><span>▰</span><span>3d</span><span class="n">13</span></div>
        </div>

        <div id="detailsPanel" class="panel">
          <div class="detail-cover"></div>
          <div class="detail-title">角色设定图 · 变体 03</div>
          <div class="detail-sub">今天 14:32 · Image Studio</div>
          <dl class="detail-grid">
            <dt>媒体</dt><dd>图片</dd>
            <dt>尺寸</dt><dd>1536 × 1024</dd>
            <dt>模型</dt><dd>Seedream 5.0</dd>
            <dt>来源</dt><dd>Image Studio</dd>
            <dt>所在目录</dt><dd>未分类</dd>
          </dl>
        </div>
      </aside>
    </div>

    <script>
      const app = document.querySelector('.app')
      const toggle = document.querySelector('#dockToggle')
      const close = document.querySelector('#dockClose')
      const tabs = [...document.querySelectorAll('.tab')]
      const panels = {
        folders: document.querySelector('#foldersPanel'),
        details: document.querySelector('#detailsPanel'),
      }

      function setDock(next) {
        app.dataset.dock = next
        const open = next !== 'closed'
        toggle.setAttribute('aria-pressed', String(open))
        if (open) setPanel(next)
      }

      function setPanel(name) {
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.panel === name))
        Object.entries(panels).forEach(([key, panel]) => panel.classList.toggle('active', key === name))
        app.dataset.dock = name
      }

      toggle.addEventListener('click', () => setDock(app.dataset.dock === 'closed' ? 'folders' : 'closed'))
      close.addEventListener('click', () => setDock('closed'))
      tabs.forEach((tab) => tab.addEventListener('click', () => setPanel(tab.dataset.panel)))
      document.querySelectorAll('.asset').forEach((asset) => asset.addEventListener('click', () => setDock('details')))
    </script>
  </body>
</html>
