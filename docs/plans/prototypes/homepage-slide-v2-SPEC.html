<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首页翻页 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">

<style>
  /* ═══ 首页翻页 v2 · 按 2026-08-28 核对拍板 ═══════════════════════
     翻页引擎（owner 配方）：滚轮阈值累计 · 切换锁定 · 850ms 缓动 ·
     transform GPU · 竖直上推 + 三层错速（l1 慢 / l2 中 / l3 快）。
     结构：登录条 + 开场 + 功能 6 页（图片生成页为单独设计的样板，
     其余暂为骨架）+ 模型区五模态站（竖翻模态、横翻模型；图片站
     7 页真资料 + 官方样图，其余站占位）+ 尾页。白底。
     图片模态资料为联网实测评价，来源见各页脚注与交付说明。 */
  :root {
    --paper:  #ffffff;
    --ink:    #0a0a0a;
    --dim:    #75757a;
    --line:   #e6e6e2;
    --panel:  #f4f4f1;
    --panel2: #ebebe7;

    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "Noto Sans", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
    /* 2026-08-28 字体拍板 B：标题走衬线（刊物重量），正文与数据字不变 */
    --serif: "Noto Serif SC", "Songti SC", serif;
    --gut: clamp(22px, 5vw, 80px);
    --bar: 54px;
    --dur: .85s;
    --easing: cubic-bezier(.65, .05, .28, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow: hidden; height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ─── 登录条 ────────────────────────────────────────────────── */
  .topbar {
    position: fixed; z-index: 80; inset: 0 0 auto 0; height: var(--bar);
    display: flex; align-items: center; gap: 18px;
    padding: 0 var(--gut);
    background: color-mix(in srgb, var(--paper) 86%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .logo { font-weight: 700; letter-spacing: -.02em; font-size: 15px; }
  .topbar .links { display: flex; gap: 22px; margin-left: 26px; font-size: 13px; color: var(--dim); }
  .topbar .login {
    margin-left: auto; padding: 8px 20px;
    background: var(--ink); color: var(--paper);
    border: 0; border-radius: 999px; font-size: 13px; cursor: pointer;
  }

  /* ─── 翻页引擎：竖站 ────────────────────────────────────────── */
  #deck { position: fixed; inset: 0; }
  .vp {
    position: absolute; inset: 0;
    background: var(--paper);
    overflow: hidden; /* 错速层在待命位会探出页界（横向 11-18vw），必须就地裁剪 */
    transform: translateY(100vh);
    transition: transform var(--dur) var(--easing);
    will-change: transform;
  }
  .vp[data-pos="on"] { transform: translateY(0); }
  .vp[data-pos="before"] { transform: translateY(-100vh); }

  /* 三层错速：层的过渡时长与页错开，翻页瞬间层在页内继续滑，产生深度。
     l1 背景最慢（1.05s）· l2 文字中速（.85s）· l3 视觉块最快（.68s）。 */
  .l1, .l2, .l3 { transition: transform var(--dur) var(--easing); will-change: transform; }
  .l1 { transition-duration: 1.05s; }
  .l3 { transition-duration: .68s; }
  .vp[data-pos="after"] .l1, .hpg[data-pos="on"] .vp-none { }
  .vp[data-pos="after"] .l1 { transform: translateY(-7vh); }
  .vp[data-pos="after"] .l2 { transform: translateY(-13vh); }
  .vp[data-pos="after"] .l3 { transform: translateY(-22vh); }
  .vp[data-pos="before"] .l1 { transform: translateY(7vh); }
  .vp[data-pos="before"] .l2 { transform: translateY(13vh); }
  .vp[data-pos="before"] .l3 { transform: translateY(22vh); }
  .vp[data-pos="on"] .l1, .vp[data-pos="on"] .l2, .vp[data-pos="on"] .l3 { transform: none; }

  .page-inner {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 2.4vh, 26px);
    padding: calc(var(--bar) + 16px) var(--gut) 44px;
    position: relative;
  }

  /* ─── 横站（模型区）：站内横排页 ────────────────────────────── */
  .hwrap { position: absolute; inset: 0; overflow: hidden; }
  /* 横向切换语法（08-28 四轮）：不平推 —— 背景交叉淡化，内容层错速滑入。
     竖向保持上推；横向像画廊换灯箱片，「硬切换」由此消除。 */
  .hpg {
    position: absolute; inset: 0;
    background: var(--paper);
    overflow: hidden;
    opacity: 0; pointer-events: none;
    transition: opacity .75s ease;
    will-change: opacity;
  }
  .hpg[data-pos="on"] { opacity: 1; pointer-events: auto; z-index: 2; }
  .hpg[data-pos="before"], .hpg[data-pos="after"] { z-index: 1; }
  .hpg[data-pos="after"] .l1 { transform: translateX(-6vw); }
  .hpg[data-pos="after"] .l2 { transform: translateX(-11vw); }
  .hpg[data-pos="after"] .l3 { transform: translateX(-18vw); }
  .hpg[data-pos="before"] .l1 { transform: translateX(6vw); }
  .hpg[data-pos="before"] .l2 { transform: translateX(11vw); }
  .hpg[data-pos="before"] .l3 { transform: translateX(18vw); }
  .hpg[data-pos="on"] .l1, .hpg[data-pos="on"] .l2, .hpg[data-pos="on"] .l3 { transform: none; }

  /* ─── 通用排版 ──────────────────────────────────────────────── */
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
  h1, h2 { margin: 0; font-family: var(--serif); font-weight: 900; letter-spacing: .015em; line-height: 1.24; text-align: center; text-wrap: balance; }
  h1 { font-size: clamp(2.2rem, 5.6vw, 4.6rem); }
  h2 { font-size: clamp(1.9rem, 4.6vw, 3.6rem); }
  .sub { margin: 0; font-size: clamp(.92rem, 1.4vw, 1.05rem); color: var(--dim); text-align: center; }
  .cta {
    display: inline-block; padding: 13px 34px;
    background: var(--ink); color: var(--paper);
    border-radius: 999px; text-decoration: none; font-size: 14.5px; font-weight: 600;
  }

  /* 背景层大序号（l1 慢层的载体） */
  .bgno { display: none; /* 2026-08-28 owner:背景数字全部退役 */ }
  .fg { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.4vh, 26px); width: 100%; }

  /* ─── 图片生成功能页（单独设计的样板） ──────────────────────── */
  .imgfn { width: min(860px, 100%); display: flex; flex-direction: column; gap: 20px; align-items: center; }
  /* ── 开场页 · 现状 hero 的翻页版（作品墙+跑马灯+SCROLL cue；owner 拍板文案克制/沿用现状原句） ── */
  .op-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .op-stat { opacity: 0; transition: opacity .7s ease .1s; }
  .op-hero.in .op-stat { opacity: 1; }
  .op-hero h1 { margin: 0; }
  .opl { display: block; overflow: hidden; }
  .opl > span { display: inline-block; transform: translateY(112%); transition: transform .85s cubic-bezier(.2,.7,.2,1); }
  .opl:nth-child(2) > span { transition-delay: .12s; }
  .op-hero.in .opl > span { transform: none; }
  .op-strip {
    flex: none; width: min(1270px, 94vw);
    display: flex; gap: 10px; justify-content: center;
  }
  .op-strip figure {
    position: relative; margin: 0; flex: 1 1 0; min-width: 0; max-width: 120px;
    aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--panel);
    box-shadow: 0 16px 40px -22px rgba(10,10,10,.35);
    opacity: 0; transform: translateY(26px);
    transition: opacity .55s ease, transform .6s cubic-bezier(.2,.8,.25,1);
  }
  .op-strip figure.in { opacity: 1; transform: none; }
  .op-strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .op-strip img.b { opacity: 0; transition: opacity .85s ease; }
  .op-strip figure.swap img.b { opacity: 1; }
  .op-note {
    margin: 0; font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--dim);
    opacity: 0; transition: opacity .8s ease;
  }
  .op-note.in { opacity: 1; }
  .op-mq {
    position: absolute; left: 0; right: 0; bottom: 44px; overflow: hidden;
    opacity: 0; transition: opacity .9s ease;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .op-mq.in { opacity: 1; }
  .op-track { display: flex; width: max-content; animation: opmq 44s linear infinite; }
  .op-track .half {
    display: flex; gap: 56px; padding-right: 56px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--dim); white-space: nowrap;
  }
  @keyframes opmq { to { transform: translateX(-50%); } }
  .op-cue {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 9px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .9s ease;
  }
  .op-cue.in { opacity: 1; }
  .op-cue i { width: 1px; height: 20px; background: var(--ink); animation: opcue 1.9s ease-in-out infinite; }
  @keyframes opcue {
    0% { transform: scaleY(.15); transform-origin: top; opacity: .15; }
    50% { transform: scaleY(1); transform-origin: top; opacity: .8; }
    100% { transform: scaleY(.15); transform-origin: bottom; opacity: .15; }
  }
  .op-cue span { font-family: var(--mono); font-size: 8px; letter-spacing: .34em; color: var(--dim); }

  /* ── 功能页 06 · 资源库回流（owner 拍板：归档飞入是钩子，回流飞出是主语） ── */
  .fn-vault {
    width: min(1020px, 100%); position: relative;
    border: 1px solid var(--line); border-radius: 18px; background: var(--paper);
    box-shadow: 0 30px 80px -40px rgba(10,10,10,.28);
    overflow: hidden; text-align: left;
  }
  .fn-vault .bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .fn-vault .bar .t { font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; }
  .fn-vault .bar .p { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
  .fn-vault .vbody { display: flex; }
  .fn-vault .vleft { flex: 1; padding: 12px 14px; border-right: 1px solid var(--line); }
  .fn-vault .chips2 { display: flex; gap: 6px; margin-bottom: 10px; }
  .fn-vault .chips2 span {
    font-family: var(--mono); font-size: 9.5px; padding: 3px 10px;
    border: 1px solid var(--line-2); border-radius: 999px; color: var(--dim);
  }
  .fn-vault .chips2 .on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .fn-vault .vgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .fn-vault .vc {
    position: relative; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--panel);
    opacity: 0; transform: translateY(14px);
    transition: opacity .4s ease, transform .55s cubic-bezier(.2,.9,.3,1.2), border-color .35s, box-shadow .35s;
  }
  .fn-vault .vc.far { transform: translateY(-270px) scale(.72); }
  .fn-vault .vc.in { opacity: 1; transform: none; }
  .fn-vault .vc.lift { border-color: var(--ink); box-shadow: 0 12px 28px -12px rgba(10,10,10,.42); }
  .fn-vault .vc img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fn-vault .vc .vk {
    position: absolute; left: 6px; bottom: 6px;
    font-family: var(--mono); font-size: 8px; letter-spacing: .05em; white-space: nowrap;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(10,10,10,.55); color: #f4f2ec; backdrop-filter: blur(3px);
  }
  .fn-vault .vc .wvc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 12px; }
  .fn-vault .vc .wvc i { width: 3px; border-radius: 2px; background: var(--ink); opacity: .7; height: calc(var(--h) * 1%); }
  .fn-vault .vc.tcard { background: var(--paper); padding: 10px 9px; }
  .fn-vault .vc.tcard .tp { font-family: var(--mono); font-size: 9px; line-height: 1.65; color: var(--ink); display: block; }
  .fn-vault .vc.ncard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: var(--paper); }
  .fn-vault .vc.ncard b { font-size: 15px; letter-spacing: -.01em; }
  .fn-vault .vc.ncard .nk { font-family: var(--mono); font-size: 8px; color: var(--dim); letter-spacing: .12em; }
  .fn-vault .vright { width: 240px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .fn-vault .rk2 { font-family: var(--mono); font-size: 9px; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
  .fn-vault .slot {
    position: relative; height: 122px; border: 1.5px dashed var(--line-2); border-radius: 11px;
    display: grid; place-items: center; overflow: hidden;
    transition: border-color .4s;
  }
  .fn-vault .slot .ph { font-family: var(--mono); font-size: 9.5px; color: var(--dim); letter-spacing: .12em; }
  .fn-vault .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s; }
  .fn-vault .slot .gk {
    position: absolute; left: 7px; bottom: 7px; opacity: 0; transition: opacity .45s;
    font-family: var(--mono); font-size: 8.5px; padding: 2px 8px; border-radius: 999px;
    background: rgba(10,10,10,.55); color: #f4f2ec; backdrop-filter: blur(3px);
  }
  .fn-vault .slot.got { border-color: var(--ink); border-style: solid; }
  .fn-vault .slot.got .ph { opacity: 0; }
  .fn-vault .slot.got img, .fn-vault .slot.got .gk { opacity: 1; }
  .fn-vault .vnote { margin: 0; font-size: 11.5px; line-height: 1.7; color: var(--dim); }
  .fn-vault .cta2 {
    align-self: flex-start; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    padding: 6px 14px; border: 1px solid var(--ink); border-radius: 999px; color: var(--ink);
    opacity: .3; transition: opacity .35s, background .35s, color .35s;
  }
  .fn-vault .cta2.on { opacity: 1; background: var(--ink); color: var(--paper); }

  /* ── 功能页 05 · 画布三步走（owner 拍板：助手→剧本→节点→成片；接续=产物飞递） ── */
  .fn-canvas {
    width: min(1250px, 100%); position: relative;
    display: flex; align-items: flex-start; justify-content: center;
    text-align: left;
  }
  .fn-step {
    flex: none; border: 1px solid var(--line); border-radius: 16px; background: var(--paper);
    box-shadow: 0 30px 80px -40px rgba(10,10,10,.28); overflow: hidden;
    transition: opacity .5s ease, border-color .5s ease;
  }
  .fn-step .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .fn-step .bar .no {
    font-family: var(--mono); font-size: 9px; width: 18px; height: 18px; border-radius: 999px;
    border: 1px solid var(--ink); display: grid; place-items: center; flex: none;
  }
  .fn-step .bar .t { font-size: 12px; font-weight: 700; letter-spacing: -.01em; }
  .fn-step .bar .p { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--dim); white-space: nowrap; }
  .fn-step.dimmed { opacity: .5; }
  .fn-step.dimmed.on { opacity: 1; border-color: var(--ink); }
  .fn-hand {
    flex: none; width: 42px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 15px; color: var(--line-2); transition: color .4s;
  }
  .fn-hand.on { color: var(--ink); }
  .fn-hand[data-h="0"] { margin-top: 158px; }
  .fn-hand[data-h="1"] { margin-top: 176px; }
  /* 步 ① 助手聊天 */
  .fn-step.s1 { width: 296px; margin-top: 38px; }
  .fn-step.s1 .body { padding: 12px; display: flex; flex-direction: column; gap: 9px; min-height: 208px; }
  .s1 .m { display: flex; gap: 7px; opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s; }
  .s1 .m.in { opacity: 1; transform: none; }
  .s1 .m.me { flex-direction: row-reverse; }
  .s1 .av {
    width: 26px; height: 26px; border-radius: 999px; flex: none;
    display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--paper); background: var(--ink);
  }
  .s1 .m.me .av { background: var(--line-2); color: var(--ink); }
  .s1 .b { border: 1px solid var(--line); background: var(--panel); border-radius: 3px 11px 11px 11px; padding: 7px 10px; font-size: 11.5px; line-height: 1.55; }
  .s1 .m.me .b { border-radius: 11px 3px 11px 11px; background: var(--paper); }
  .s1 .chip {
    align-self: flex-start; margin-left: 33px;
    border: 1px solid var(--ink); background: var(--panel); border-radius: 9px; padding: 6px 11px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .03em;
    opacity: 0; transform: scale(.7);
    transition: opacity .35s, transform .35s cubic-bezier(.2,.9,.3,1.4);
  }
  .s1 .chip.in { opacity: 1; transform: none; }
  /* 步 ② 剧本 */
  .fn-step.s2 { width: 330px; margin-top: 86px; }
  .fn-step.s2 .body { padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
  .s2 .row {
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
    display: flex; gap: 9px; align-items: center;
    opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s;
  }
  .s2 .row.in { opacity: 1; transform: none; }
  .s2 .row .ix { font-family: var(--mono); font-size: 9px; color: var(--dim); white-space: nowrap; }
  .s2 .row .tx { font-size: 11.5px; line-height: 1.5; flex: 1; }
  .s2 .row .np {
    font-family: var(--mono); font-size: 8.5px; white-space: nowrap;
    border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 8px; color: var(--dim);
    transition: background .35s, color .35s, border-color .35s;
  }
  .s2 .row.sent .np { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  /* 步 ③ 画布 */
  .fn-step.s3 { width: 450px; }
  .s3 .cv {
    position: relative; height: 378px;
    background-image: radial-gradient(rgba(10,10,10,.13) 1px, transparent 1.5px);
    background-size: 16px 16px;
  }
  .s3 .cn {
    position: absolute; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
    box-shadow: 0 10px 24px -14px rgba(10,10,10,.35); padding: 5px;
    opacity: 0; transform: scale(.6);
    transition: opacity .4s, transform .45s cubic-bezier(.2,.9,.3,1.35);
  }
  .s3 .cn.in { opacity: 1; transform: none; }
  .s3 .cn img { display: block; width: 110px; height: 62px; object-fit: cover; border-radius: 6px; }
  .s3 .cn .cl { font-family: var(--mono); font-size: 8px; color: var(--dim); padding: 4px 2px 1px; letter-spacing: .06em; }
  .s3 .cn.cnv { padding: 6px; }
  .s3 .cn.cnv video { display: block; width: 222px; height: 125px; object-fit: cover; border-radius: 7px; background: var(--panel); }
  .s3 svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .s3 .wires path {
    fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: .6;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    transition: stroke-dashoffset .7s ease;
  }
  .s3 .wires path:nth-child(2) { transition-delay: .16s; }
  .s3 .wires path:nth-child(3) { transition-delay: .32s; }
  .s3 .wires path.draw { stroke-dashoffset: 0; }
  /* 接续飞行元素 */
  .fn-canvas .flyer, .fn-vault .flyer {
    position: absolute; z-index: 60; pointer-events: none;
    transition: transform .78s cubic-bezier(.45,.05,.25,1), opacity .78s ease;
  }
  .fly-chip {
    display: inline-block; white-space: nowrap;

  /* ── 功能页 04 · 全能参考输入框（owner 拍板二轮：胶囊+说明混排的聊天式输入框，形式对齐站内 composer 真机） ── */

  .fn-video .say { font-size: 11px; color: var(--dim); opacity: 0; transition: opacity .4s ease .18s; }
  .fn-video .iline.in .say { opacity: 1; }
  .fn-video .iline.ptxt { min-height: 20px; gap: 2px; }
  .fn-video .tw { font-family: var(--mono); font-size: 11.5px; line-height: 1.6; }
  .fn-video .cur3 { width: 7px; height: 14px; background: var(--ink); animation: blink 1s steps(2) infinite; flex: none; }
  .fn-video .itools { margin-top: auto; display: flex; align-items: center; gap: 13px; padding: 8px 3px 0; border-top: 1px solid var(--line); }

  .fn-video .itools .meta { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--dim); }
  .fn-video .itools .up {
    width: 30px; height: 30px; border-radius: 999px; border: 0; flex: none;
    background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1;
    display: grid; place-items: center; opacity: .3; transition: opacity .3s;
  }
  .fn-video .itools .up.on { opacity: 1; }
  .fn-video .out {
    flex: 1; min-width: 0; border-radius: 13px; overflow: hidden; position: relative;
    border: 1px solid var(--line); background: var(--panel);
    opacity: 0; transition: opacity .7s ease;
  }
  .fn-video .out.in { opacity: 1; }
  .fn-video .out video { width: 100%; height: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .fn-video .out .src2 {

  /* ── 功能页 03 · 配音聊天室（owner 拍板：聊天框式 —— 头像 + 语音气泡逐条到达） ── */
  .fn-audio {

  .fn-audio .who { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--dim); }

  .fn-audio .voice .dur { font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
  .fn-audio .inrow {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-top: 1px solid var(--line);
  }
  .fn-audio .picks { display: flex; gap: 6px; }
  .fn-audio .pick {
    width: 30px; height: 30px; border-radius: 999px;

  .fn-audio .inrow .tx { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .fn-audio .inrow .cur2 { width: 7px; height: 14px; background: var(--ink); animation: blink 1s steps(2) infinite; }
  .fn-audio .inrow .go { font-size: 11.5px; font-weight: 600; padding: 7px 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); }

  /* ── 功能页 02 · LoRA 挂载工作台（拍板：主语=挂载生态 + 提示词搭配；演出=逐个挂载→触发词弹入→出图） ── */
  .fn-lora {
    width: min(1000px, 100%);
    border: 1px solid var(--line); border-radius: 18px; background: var(--paper);
    box-shadow: 0 30px 80px -40px rgba(10,10,10,.28);
    overflow: hidden; text-align: left;
  }
  .fn-lora .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  .fn-lora .bar .t { font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; }
  .fn-lora .bar .cnt { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
  .fn-lora .bar .cnt b { color: var(--ink); font-weight: 600; }
  .fn-lora .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .fn-lora .lib { border-right: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .fn-lora .search {
    display: flex; align-items: center; gap: 8px;

  .fn-lora .lcard {

  }
  .fn-lora .lcard .cv { width: 34px; height: 34px; border-radius: 7px; flex: none; }
  .fn-lora .lcard .nm { font-size: 12px; font-weight: 600; line-height: 1.25; }
  .fn-lora .lcard .bm { font-family: var(--mono); font-size: 8.5px; color: var(--dim); }
  .fn-lora .lcard .add {
    margin-left: auto; font-family: var(--mono); font-size: 9.5px;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--dim);

  .fn-lora .lcard.hot { border-color: var(--ink); background: var(--panel); }

  .fn-lora .rig { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .fn-lora .rk { font-family: var(--mono); font-size: 9px; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
  .fn-lora .mrow {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px;

  .fn-lora .mrow.in { opacity: 1; transform: none; }
  .fn-lora .mrow .nm { font-size: 11.5px; font-weight: 600; }
  .fn-lora .mrow .w { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .fn-lora .mrow .track2 { width: 74px; height: 3px; border-radius: 3px; background: var(--line); position: relative; }
  .fn-lora .mrow .track2 i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
  .fn-lora .mrow .wv { font-family: var(--mono); font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .fn-lora .prow2 {

  .fn-lora .trig {

  }
  .fn-lora .oq.in { opacity: 1; }
  .fn-lora .oq .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }

  /* ── 功能页 01 · 图片工作台还原（08-28 反问拍板：工作台 + 同题四对比 + 进页自动演） ── */
  .fn-studio {
    width: min(980px, 100%);
    border: 1px solid var(--line); border-radius: 18px; background: var(--paper);
    box-shadow: 0 30px 80px -40px rgba(10,10,10,.28);
    overflow: hidden; text-align: left;
  }
  .fn-studio .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  .fn-studio .bar .t { font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; margin-right: 6px; }
  .fn-studio .mchip {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--dim);
  }
  .fn-studio .mchip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .fn-studio .bar .p { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
  .fn-studio .prow {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .fn-studio .prow .txt { font-family: var(--mono); font-size: 12.5px; min-height: 19px; flex: 1; }
  .fn-studio .prow .cur { width: 8px; height: 16px; background: var(--ink); animation: blink 1s steps(2) infinite; flex: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .fn-studio .go {
    flex: none; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    padding: 8px 20px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--paper); cursor: default;
    opacity: .35; transition: opacity .3s;
  }
  .fn-studio.typed .go { opacity: 1; }
  .fn-quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 16px 16px; }
  .fn-quad .fq {
    position: relative; aspect-ratio: 3 / 4; border-radius: 11px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    opacity: 0; transform: translateY(14px) scale(.97);
    transition: opacity .6s ease, transform .6s ease;
  }
  .fn-studio.reveal .fq { opacity: 1; transform: none; }
  .fn-studio.reveal .fq:nth-child(2) { transition-delay: .3s; }
  .fn-studio.reveal .fq:nth-child(3) { transition-delay: .6s; }
  .fn-studio.reveal .fq:nth-child(4) { transition-delay: .9s; }
  .fn-quad .fq img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fn-quad .fq .mtag {
    position: absolute; left: 8px; top: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    padding: 3px 9px; border-radius: 999px;
    background: rgba(10,10,10,.62); color: #f4f2ec; backdrop-filter: blur(4px);
  }
  .fn-quad .fq .want {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; padding: 12px; text-align: center;
  }
  .fn-quad .fq .want .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .26em; color: var(--dim); text-transform: uppercase; }
  .fn-quad .fq .want p { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 12px; line-height: 1.55; color: var(--dim); }
  .fn-note { margin: 12px 0 0; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--dim); }

  .promptbar {
    display: flex; align-items: center; gap: 12px;
    width: min(600px, 100%);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 18px; background: var(--paper);
    font-family: var(--mono); font-size: 13px;
    box-shadow: 0 10px 30px -18px rgba(10,10,10,.25);
  }
  .promptbar .cursor { width: 8px; height: 16px; background: var(--ink); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .quad { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 11px; width: 100%; }
  .quad .cell {
    aspect-ratio: 1; border-radius: 12px; position: relative; overflow: hidden;
    border: 1px solid var(--line);
  }
  .quad .cell i { position: absolute; inset: 0; }
  .quad .cell:nth-child(1) i { background: radial-gradient(140% 120% at 20% 15%, #e8cf9e, #a06b38 55%, #35200f 100%); }
  .quad .cell:nth-child(2) i { background: radial-gradient(130% 130% at 80% 20%, #c3d7e6, #5b7f9e 55%, #16283b 100%); }
  .quad .cell:nth-child(3) i { background: radial-gradient(120% 140% at 30% 85%, #e6c2b3, #9e5568 60%, #2c1420 100%); }
  .quad .cell:nth-child(4) i { background: radial-gradient(150% 110% at 70% 80%, #cfe0c3, #6d9161 55%, #1c2b18 100%); }
  .quad .seed { position: absolute; left: 9px; bottom: 7px; font-family: var(--mono); font-size: 8.5px; color: rgba(255,255,255,.75); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    padding: 7px 15px; border: 1px solid var(--line); border-radius: 999px;
    background: none; cursor: pointer; color: var(--dim);
    transition: border-color .2s, color .2s;
  }
  .chips button:hover { border-color: var(--ink); color: var(--ink); }
  .chips .hint { align-self: center; font-family: var(--mono); font-size: 9.5px; color: var(--dim); letter-spacing: .2em; }

  /* ─── 功能骨架页的占位视觉（沿用 v1 语汇） ──────────────────── */
  .quad.lora i { background: linear-gradient(160deg,#e6ddf0,#c3b2d9); }
  .quad.lora .cell:nth-child(2) i { background: linear-gradient(200deg,#e6ddf0,#b9a7d2); }
  .quad.lora .cell:nth-child(3) i { background: linear-gradient(120deg,#e2d8ee,#c3b2d9); }
  .quad.lora .cell:nth-child(4) i { background: linear-gradient(240deg,#e6ddf0,#beadd6); }
  .wave { display: flex; align-items: center; gap: 3px; height: 84px; width: min(540px,100%); justify-content: center; }
  .wave i { width: 5px; border-radius: 3px; background: var(--ink); opacity: .85; height: calc(8% + var(--h) * 1%); }
  .film { display: flex; gap: 8px; width: min(700px,100%); }
  .film i { flex: 1; aspect-ratio: 16/10; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .film i.key { border: 2px solid var(--ink); background: var(--panel); position: relative; }
  .film i.key::after { position: absolute; left: 6px; bottom: 4px; font-family: var(--mono); font-size: 8.5px; color: var(--dim); content: attr(data-k); }
  .mini-graph { position: relative; width: min(620px,100%); aspect-ratio: 16/7; }
  .mini-graph .nd { position: absolute; transform: translate(-50%,-50%); border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-family: var(--mono); font-size: 11px; box-shadow: 0 6px 18px -12px rgba(10,10,10,.3); }
  .mini-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mini-graph path { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .shelf { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; width: min(660px,100%); }
  .shelf i { aspect-ratio: 1; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .shelf i:nth-child(3n) { background: var(--panel2); }
  .todo { font-family: var(--mono); font-size: 9.5px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }

  /* ─── 模型页 v3：整图背景 + 玻璃内容板（2026-08-28 三轮拍板） ────
     官方样图铺满整页当背景（l1 慢层，错速时像镜头微移）；内容圈进
     两块毛玻璃：左下主板（identity，l2）+ 底部横条（强/弱/规格，l3）。
     无图页 = 浅灰底 + 中央提示词水印卡（owner 生成任务单），内容板不变。 */
  .mpage-v3 { justify-content: flex-end; align-items: stretch; gap: 12px; padding-bottom: 64px; }

  .m-bg { position: absolute; inset: -4%; z-index: 0; }
  /* 铺满不糊：单层 cover 占满整页，「不丢信息」由图的构图负责
     （代表作按 16:9 满幅、主体偏右创作）；object-position 逐图可调。 */
  .m-bg img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    object-position: var(--pos, center);
  }
  /* 暗 scrim：左缘与底缘轻压一层黑，给玻璃板和读数托底，不碰画面主体 */
  .m-bg .veil { position: absolute; inset: 0; background: linear-gradient(96deg, rgba(0,0,0,.34), rgba(0,0,0,0) 52%), linear-gradient(0deg, rgba(0,0,0,.30), rgba(0,0,0,0) 34%); }
  /* 竖图布局（08-28 owner 拍板）：整图靠右完整摆放，左侧白底 + 大序号水印补位，
     玻璃板照常压左下；strip 玻璃横跨时压住图下缘一段，正是玻璃的层次。 */
  .m-bg.side { background: transparent; } /* 透出底下的 bgno 大序号水印，左侧留白有了纹理 */
  /* 竖图墙（08-28 owner 定稿）：几张竖照等高并排，三联铺满整页当背景。
     每张作为一联 cover 微裁（竖图对 1/3 视口竖条比例几乎吻合），玻璃板照常压上。 */
  .m-bg.wall { display: flex; gap: 12px; background: var(--void, #0b0b0c); }
  .m-bg.wall img {
    position: static; flex: 1 1 0; min-width: 0;
    height: 100%; width: auto;
    object-fit: cover; object-position: center top;
    border-radius: 0; box-shadow: none;
  }
  .m-bg.wall .veil2 { position: absolute; inset: 0; background: linear-gradient(96deg, rgba(0,0,0,.30), rgba(0,0,0,0) 50%), linear-gradient(0deg, rgba(0,0,0,.26), rgba(0,0,0,0) 32%); }
  .m-bg.side img {
    position: absolute; right: 4.5%; top: 7%; height: 86%; width: auto; left: auto;
    object-fit: contain; border-radius: 14px;
    box-shadow: 0 30px 80px -34px rgba(0,0,0,.4);
    object-position: center;
  }
  .m-bg.side .src { background: rgba(10,10,10,.07); color: #55555a; }
  .m-bg .src {
    position: absolute; right: 6%; top: calc(4% + var(--bar) + 10px);

    color: rgba(255,255,255,.9); background: rgba(10,10,10,.42);

  }
  .m-bg.plain { background: transparent; } /* 透出 bgno 大序号，无图页左侧不空 */
  .m-bg .want {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    width: min(430px, 70%);

  }
  .m-bg .want .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
  .m-bg .want p { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 15px; line-height: 1.6; }

  .m-glass {
    position: relative; z-index: 1;

    width: min(500px, 62%);

  }
  .m-glass .toprow { display: flex; align-items: center; gap: 12px; }
  .m-glass .lg { width: 34px; height: 34px; flex: none; }
  .m-glass .lg svg { width: 100%; height: 100%; }
  .m-glass .lg.textmark { display: flex; align-items: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; color: var(--dim); width: auto; }
  .m-glass .lg.seedmark { display: flex; align-items: center; gap: 7px; width: auto; }
  .m-glass .lg.seedmark svg { width: 26px; height: 26px; }

  .m-glass .prov { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
  .m-glass h2 { text-align: left; font-size: clamp(1.7rem, 3.1vw, 2.5rem); line-height: 1.12; }
  .m-glass .pos { margin: 0; font-size: .92rem; color: #3c3c40; }
  .m-glass .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
  .m-glass .fare { font-family: var(--mono); font-size: 12px; }
  .m-glass .fare b { font-weight: 500; }
  .m-glass .routes { font-family: var(--mono); font-size: 9.5px; color: var(--dim); letter-spacing: .08em; }
  .m-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .m-tags i { font-style: normal; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; padding: 4px 11px; border: 1px solid rgba(10,10,10,.16); border-radius: 999px; color: #3c3c40; background: rgba(255,255,255,.5); }

  .m-strip {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;
    background: linear-gradient(160deg, rgba(13,13,16,.58), rgba(13,13,16,.38));
    backdrop-filter: blur(9px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 16px;
    box-shadow: 0 20px 50px -28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    color: #f4f2ec;
    padding: 15px 20px 14px;
    text-align: left;
  }
  .m-strip .pm { border: 0; border-radius: 0; padding: 0; background: none; }
  .m-strip .pm + .pm { border-left: 1px solid rgba(10,10,10,.1); padding-left: 20px; }
  /* 暗玻璃 → 白字体系 */
  .m-glass h2, .m-strip { color: #f4f2ec; }
  .m-glass .prov, .m-glass .routes, .m-strip .k, .m-strip dt { color: rgba(244,242,236,.6); }
  .m-glass .pos { color: rgba(244,242,236,.8); }
  .m-glass .fare, .m-strip dd { color: #f4f2ec; }
  .m-strip .pm ul { color: rgba(244,242,236,.92); }
  .m-strip .pm.minus li { color: rgba(244,242,236,.58); }
  .m-strip .pm + .pm { border-left-color: rgba(255,255,255,.14); }
  .m-glass .lg.textmark, .m-glass .lg.seedmark b { color: #f4f2ec; }
  .m-glass .lg svg { color: #f4f2ec; }
  .m-tags i { border-color: rgba(255,255,255,.28); color: rgba(244,242,236,.85); background: rgba(255,255,255,.08); }
  .pm .k { font-family: var(--mono); font-size: 9px; letter-spacing: .26em; color: var(--dim); text-transform: uppercase; }
  .pm ul { margin: 7px 0 0; padding-left: 1.05em; font-size: .82rem; display: flex; flex-direction: column; gap: 3px; }
  .pm.minus li { color: #55555a; }
  .pm.spec dl { margin: 7px 0 0; display: flex; flex-direction: column; gap: 4px; }
  .pm.spec div { display: flex; justify-content: space-between; gap: 10px; font-size: .78rem; }
  .pm.spec dt { color: var(--dim); font-family: var(--mono); font-size: .7rem; letter-spacing: .04em; flex: none; padding-top: 2px; }
  .pm.spec dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  /* 站内横向进度（模型站底部） */
  .hnav {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 18px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim);
  }
  .hnav button {
    border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    width: 30px; height: 30px; cursor: pointer; display: grid; place-items: center; font-size: 13px;
  }
  .hnav button:hover { border-color: var(--ink); }
  .hnav .hdots { display: flex; gap: 6px; }
  .hnav .hdots i { width: 16px; height: 2px; background: var(--line); border-radius: 2px; transition: background .3s; }
  .hnav .hdots i[data-on="true"] { background: var(--ink); }

  /* ─── 竖轴页点 ──────────────────────────────────────────────── */
  /* 页导航（08-28 owner 拍板：放左侧；hover 整个区域展开全部页名；每个 title 自带 hover 动效） */
  .dots {
    position: fixed; z-index: 70; left: clamp(8px, 1.6vw, 22px); top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    padding: 12px 14px 12px 10px; border-radius: 14px;
    border: 1px solid transparent;
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;

  .dots:hover {

    backdrop-filter: blur(10px);
  }
  .dots button { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 3px 4px; cursor: pointer; }
  .dots i { width: 7px; height: 7px; border-radius: 999px; background: var(--line-2); transition: background .25s, transform .25s; display: block; flex: none; }
  .dots button[data-on="true"] i { background: var(--ink); }
  .dots .nm {
    font-family: var(--mono); font-size: 9.5px; color: var(--dim); white-space: nowrap;
    opacity: 0; transform: translateX(-6px);
    transition: opacity .28s ease, transform .28s ease, color .2s ease;
    transition-delay: calc(var(--i, 0) * 18ms);
  }
  .dots button[data-on="true"] .nm { opacity: 1; transform: none; color: var(--ink); }
  .dots:hover .nm { opacity: 1; transform: none; }
  /* title hover 动效：点亮 + 点放大 + 名字前移一步 */
  .dots button:hover i { background: var(--ink); transform: scale(1.5); }
  .dots button:hover .nm { color: var(--ink); transform: translateX(2px); transition-delay: 0s; }

  /* 尾页 */
  .fin-foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 18px var(--gut) 20px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 9.5px; color: var(--dim); letter-spacing: .12em;
    opacity: 0; transition: opacity .8s ease .3s;
  }
  .fin-foot.in { opacity: 1; }
  .fin-hero { display: flex; flex-direction: column; align-items: center; gap: 17px; }
  .fin-hero h2 { margin: 0; }
  .fin-hero.in .opl > span { transform: none; }
  .fin-sub {
    margin: 0; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--dim);
    opacity: 0; transition: opacity .7s ease .35s;
  }
  .fin-hero.in .fin-sub { opacity: 1; }
  .fin-hero .cta { opacity: 0; transform: translateY(9px); transition: opacity .6s ease .5s, transform .6s ease .5s; }
  .fin-hero.in .cta { opacity: 1; transform: none; }
  .fin-mark {
    position: absolute; left: 0; right: 0; bottom: -.16em; z-index: 1;
    text-align: center;
    font-size: clamp(150px, 19vw, 370px); font-weight: 900; line-height: .8; letter-spacing: .01em;
    color: color-mix(in srgb, var(--ink) 6%, var(--paper));
    white-space: nowrap; pointer-events: none; user-select: none;
    opacity: 0; transition: opacity 1.1s ease;
  }
  .fin-mark.in { opacity: 1; }

  /* ─── 窄屏 / 减少动态：退普通滚动 ───────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .vp, .hpg, .vp .l1, .vp .l2, .vp .l3, .hpg .l1, .hpg .l2, .hpg .l3 { transition: none !important; }
  }

  /* ═══ Mobile 层（≤768px）：翻页保留（swipe 即手机原生手势），内容按手机理念重排 ═══ */
  .mdots, .mtoc, .cue-m { display: none; }
  @media (max-width: 768px) {
    :root { --bar: 48px; --gut: 16px; }
    html, body { overscroll-behavior: none; }
    body { touch-action: none; }
    .op-strip { touch-action: pan-x; }
    .mtoc, .m-strip.as-sheet { touch-action: pan-y; }
    .topbar .links { display: none; }
    .dots { display: none !important; }
    h1 { font-size: clamp(26px, 8.2vw, 36px); }
    h2 { font-size: clamp(20px, 6.2vw, 29px); }
    .eyebrow { font-size: 9px; letter-spacing: .2em; }
    .page-inner { padding: calc(var(--bar) + 12px) var(--gut) 40px; }
    .fg { gap: 14px; }
    .imgfn { width: 100%; gap: 14px; }
    /* 导航：右缘细点条（拇指区）→ 点击弹全屏目录 */
    .mdots {
      display: flex; position: fixed; right: 7px; top: 50%; transform: translateY(-50%);
      z-index: 60; flex-direction: column; gap: 7px; padding: 10px 5px;
    }
    .mdots i {
      width: 4px; height: 4px; border-radius: 999px; background: var(--ink);
      opacity: .22; transition: opacity .3s, height .3s;
    }
    .mdots i.on { opacity: .95; height: 14px; }
    .mtoc {
      position: fixed; inset: 0; z-index: 95; background: var(--paper);
      display: flex; flex-direction: column; padding: 60px 26px 30px;
      opacity: 0; pointer-events: none; transition: opacity .35s ease;
      overflow-y: auto;
    }
    .mtoc.on { opacity: 1; pointer-events: auto; }
    .mtoc .mt-k { font-family: var(--mono); font-size: 9px; letter-spacing: .3em; color: var(--dim); margin: 14px 0 6px; text-transform: uppercase; }
    .mtoc button {
      display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink);
      font-family: var(--serif); font-weight: 900; font-size: 21px; letter-spacing: .01em;
      padding: 7px 0; border-bottom: 1px solid var(--line);
    }
    .mtoc button.on { text-decoration: underline; text-underline-offset: 7px; text-decoration-thickness: 2px; }
    .mtoc button.on .no { color: var(--ink); font-weight: 700; }
    .mtoc button .no { font-family: var(--mono); font-weight: 400; font-size: 9px; color: var(--dim); margin-right: 10px; letter-spacing: .1em; }
    .mtoc .mt-x {
      position: absolute; top: 12px; right: 14px; width: 38px; height: 38px;
      border: 1px solid var(--line-2); border-radius: 999px; background: var(--paper);
      font-size: 15px; line-height: 1; color: var(--ink); padding: 0;
    }
    /* 开场：作品墙改横滑胶片带（手机原生卡带），cue 换 SWIPE */
    .op-strip {
      width: 100%; justify-content: flex-start; overflow-x: auto; padding: 4px 2px 10px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .op-strip::-webkit-scrollbar { display: none; }
    .op-strip figure { flex: 0 0 34vw; max-width: none; scroll-snap-align: center; }
    .op-note { font-size: 8px; letter-spacing: .12em; text-align: center; }
    .op-mq { bottom: 56px; }

    .cue-m { display: inline; }
    /* 收尾 */

    .fin-foot { justify-content: center; gap: 8px; text-align: center; font-size: 8.5px; }
    /* 横向站导航钮：拇指触达尺寸 */
    .hnav { bottom: 12px; }
    .hnav button { display: grid; width: 38px; height: 38px; }
    /* ── 功能页 · 一屏一焦点 ── */
    /* 01 图片：焦点=同题四格 2×2 */
    .fn-studio { width: 100%; }
    .fn-studio .bar { gap: 6px; padding: 9px 12px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }

    .fn-quad { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 10px 12px; }
    /* 02 LoRA：焦点=挂载态（库列表收起） */
    .fn-lora { width: 100%; }
    .fn-lora .cols { grid-template-columns: 1fr; }
    .fn-lora .lib { display: none; }
    .fn-lora .rig { padding: 11px 12px; }

    /* 03 声音：聊天框天然竖版 */
    .fn-audio { width: 100%; }

    .fn-audio .bar .p { display: none; }

    .fn-audio .inrow .tx { font-size: 10px; }
    /* 04 视频：手机回竖排（PC 左右是桌面拍板），输入框上、成片下 */
    .fn-video { width: 100%; }
    .fn-video .bar .p { display: none; }
    .fn-video .vrow { flex-direction: column; gap: 10px; padding: 10px 12px 12px; }
    .fn-video .ibox { width: auto; }

    /* 05 画布：三步改竖向接力，箭头右转 90°，迷你画布整体 zoom 缩放 */
    /* 05 画布：分步轮播——同一位置只站一步，跳到后一步前一步退场（owner 拍板） */
    .fn-canvas { width: 100%; display: grid; }

    /* 06 资源库：网格 3×3（文字卡收起），回流条横排在下 */

    .fn-vault .vgrid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .fn-vault .vc.tcard { display: none; }
    .fn-vault .chips2 span { font-size: 8.5px; padding: 3px 8px; }
    .fn-vault .vright { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 11px 12px; }
    .fn-vault .rk2 { width: 100%; }
    .fn-vault .slot { width: 116px; height: 82px; flex: none; }
    .fn-vault .vnote { flex: 1; min-width: 160px; font-size: 10.5px; line-height: 1.55; }
    /* ── 模型站 · 图当主角，信息压底，强弱规格收进上拉 sheet ── */
    .m-glass { width: 100%; padding: 13px 15px 12px; }
    .m-glass .m-more { display: inline-block; }
    .m-glass .m-tags { display: none; }
    .m-glass .pos { font-size: 12px; line-height: 1.55; }
    .m-glass .meta { flex-wrap: wrap; gap: 4px 10px; }
    .m-more { display: inline-block; }
    .m-strip { display: none; }
    .m-strip.as-sheet {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 92;
      flex-direction: column; gap: 15px;
      background: var(--paper); border-radius: 18px 18px 0 0;
      padding: 22px 20px 30px; max-height: 74vh; overflow-y: auto;

    }
    .m-strip.as-sheet, .m-strip.as-sheet li, .m-strip.as-sheet dd,
    .m-strip.as-sheet .pm li, .m-strip.as-sheet .pm.minus li { color: var(--ink); opacity: 1; }
    .m-strip.as-sheet .k, .m-strip.as-sheet dt { color: var(--dim); }
    .m-strip.as-sheet::before { content: ""; width: 38px; height: 4px; border-radius: 999px; background: var(--line-2); margin: -6px auto 2px; flex: none; }
    .hwrap.sheet-on .hnav { opacity: 0; pointer-events: none; }
    .m-bg.wall img:not(:first-of-type) { display: none; }

  var deck = document.getElementById('deck');

  function modelPage(m, i, total) {
    var lg = m.logo === 'seed'
      ? '<span class="lg seedmark">' + LOGO_BYTEDANCE + '<b>Seed</b></span>'
      : m.logo ? '<span class="lg">' + LOGOS[m.logo] + '</span>'
               : '<span class="lg textmark">' + m.mark + '</span>';

    // 背景：官方样图整页铺满；无图 = 浅底 + 提示词水印卡（owner 生成任务单）
    var wantPrompt = (m.gallery || []).filter(function (g) { return g.t === 'prompt'; });
    var bg;
    if (m.layout === 'wall' && m.img) {
      var walls = [m.img].concat(m.wallImgs || []);
      // 墙内各张格式可能不同，按 base64 魔数判 mime（/9j/=jpeg · UklGR=webp · iVBOR=png）
      var sniff = function (d) { return d.slice(0, 5) === 'UklGR' ? 'image/webp' : d.slice(0, 5) === 'iVBOR' ? 'image/png' : 'image/jpeg'; };
      bg = '<div class="m-bg wall l1">' +
        walls.map(function (d) { return '<img src="data:' + sniff(d) + ';base64,' + d + '" alt="' + m.name + ' 代表图">'; }).join('') +
        '<span class="veil2"></span><span class="src">' + m.src + '</span></div>';
    } else bg = m.img
      ? '<div class="m-bg' + (m.layout === 'side' ? ' side' : '') + ' l1"' + (m.bgPos ? ' style="--pos:' + m.bgPos + '"' : '') + '><img src="data:' + m.mime + ';base64,' + m.img + '" alt="' + m.name + ' 代表图">' + (m.layout === 'side' ? '' : '<span class="veil"></span>') + '<span class="src">' + m.src + '</span></div>'
      : '<div class="m-bg plain l1">' + (wantPrompt.length
          ? '<div class="want"><span class="k">背景样图待生成 · 站内出图</span><p>' + wantPrompt[0].p + '</p></div>'
          : '') + '</div>';

    var specRows = m.specs.map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
    }).join('');

    return '<div class="page-inner mpage-v3">' + bg +
      '<div class="m-glass l2">' +
      '  <div class="toprow">' + lg + '<span class="prov">' + m.prov + '</span></div>' +
      '  <h2>' + m.name + '</h2>' +
      '  <p class="pos">' + m.pos + '</p>' +
      '  <div class="m-tags">' + m.tags.map(function (t) { return '<i>' + t + '</i>'; }).join('') + '</div>' +
      '  <div class="meta"><span class="fare"><b>' + m.fare + '</b></span><span class="routes">' + m.routes + '</span></div>' +
      '  <button type="button" class="m-more">详情 · 强弱与规格 ↑</button>' +
      '</div>' +
      '<div class="m-strip l3">' +
      '  <div class="pm"><span class="k">强在哪</span><ul>' + m.plus.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' +

    V_PAGES.forEach(function (pg, i) {
      dotsHtml += '<i data-i="' + i + '"></i>';
      var group = i === 0 ? '开场' : pg.horizontal ? '模型' : i <= 6 ? '功能' : '收尾';
      if (group !== lastGroup) { tocHtml += '<span class="mt-k">' + group + '</span>'; lastGroup = group; }
      var label = pg.horizontal ? pg.name + ' · ' + STATIONS[pg.horizontal].length + ' 页' : pg.name;
      tocHtml += '<button type="button" data-i="' + i + '"><span class="no">' + (i < 9 ? '0' + (i + 1) : i + 1) + '</span>' + label + '</button>';
    });
    md.innerHTML = dotsHtml;
    toc.innerHTML = tocHtml;
    md.addEventListener('click', function () { toc.classList.add('on'); });
    toc.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.classList.contains('mt-x')) { toc.classList.remove('on'); return; }
      toc.classList.remove('on');
      vGo(+b.dataset.i, true);
    });
    window.__syncMnav = function () {
      md.querySelectorAll('i').forEach(function (d, i) { d.classList.toggle('on', i === vIdx); });
      toc.querySelectorAll('button[data-i]').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === vIdx); });
    };
    window.__syncMnav();
  })();

  /* 模型站 mobile：强弱规格上拉 sheet */
  (function () {
    var veil = document.createElement('div');
    veil.className = 'msheet-veil';
    document.body.appendChild(veil);
    var openStrip = null;
    function closeSheet() {
      if (openStrip) {
        openStrip.classList.remove('as-sheet');
        if (openStrip.__home) {
          openStrip.__home.parent.insertBefore(openStrip, openStrip.__home.next);
          var hw = openStrip.closest('.hwrap'); if (hw) hw.classList.remove('sheet-on');
          delete openStrip.__home;
        }
      }
      openStrip = null;
      veil.classList.remove('on');
    }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.m-more');
      if (btn) {
        var pg = btn.closest('.hpg') || btn.closest('.vp');
        var strip = pg && pg.querySelector('.m-strip');
        if (strip) {
          closeSheet(); openStrip = strip;
          var hw = strip.closest('.hwrap'); if (hw) hw.classList.add('sheet-on');
          strip.__home = { parent: strip.parentNode, next: strip.nextSibling };
          document.body.appendChild(strip);
          strip.classList.add('as-sheet'); veil.classList.add('on');
        }
        return;
      }
      if (e.target === veil) closeSheet();
    });
    window.__closeMSheet = closeSheet;
  })();

  function lock() { locked = true; setTimeout(function () { locked = false; }, LOCK_MS); }

  function vGo(i, force) {
    i = Math.max(0, Math.min(V_PAGES.length - 1, i));
    if (!lab()) { vps[i].scrollIntoView({ behavior: 'smooth' }); vIdx = i; return; }
    if (i === vIdx && !force) return;
    vIdx = i; layout(); lock();
    if (vIdx === 1) setTimeout(fnPlay, 500); else fnReset();
    if (vIdx === 2) setTimeout(fn2Play, 400); else fn2Reset();
    if (vIdx === 3) setTimeout(fn3Play, 400); else fn3Reset();
    if (vIdx === 4) setTimeout(fn4Play, 400); else fn4Reset();
    if (vIdx === 5) setTimeout(fn5Play, 400); else fn5Reset();
    if (vIdx === 6) setTimeout(fn6Play, 400); else fn6Reset();
    if (vIdx === 0) setTimeout(op0Play, 300); else op0Reset();
    if (vIdx === 12) setTimeout(finPlay, 350); else finReset();
    if (window.__syncMnav) window.__syncMnav();
    if (window.__closeMSheet) window.__closeMSheet();
  }
  function hGo(i) {
    var k = curStation();
    if (!k) return;
    i = Math.max(0, Math.min(STATIONS[k].length - 1, i));
    if (i === hIdxs[k]) return;
    hIdxs[k] = i; layout(); lock();
  }

  /* 输入路由：横站里先翻完模型，再继续竖走 */
  function next() {
    var k = curStation();
    if (k && hIdxs[k] < STATIONS[k].length - 1) hGo(hIdxs[k] + 1);
    else vGo(vIdx + 1);
  }
  function prev() {
    var k = curStation();
    if (k && hIdxs[k] > 0) hGo(hIdxs[k] - 1);
    else vGo(vIdx - 1);
  }

  var acc = 0;
  window.addEventListener('wheel', function (e) {
    if (!lab()) return;
    e.preventDefault();
    if (locked) { acc = 0; return; }
    acc += e.deltaY;
    if (acc > 46) { acc = 0; next(); }
    else if (acc < -46) { acc = 0; prev(); }
  }, { passive: false });

  var tY = null, tX = null;
  window.addEventListener('touchstart', function (e) { tY = e.touches[0].clientY; tX = e.touches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', function (e) {
    if (!lab() || tY === null) return;
    var dy = tY - e.changedTouches[0].clientY, dx = tX - e.changedTouches[0].clientX;
    tY = tX = null;
    if (locked) return;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 52 && curStation()) hGo(hIdxs[curStation()] + (dx > 0 ? 1 : -1));
    else if (Math.abs(dy) > 52) (dy > 0 ? next : prev)();
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    if (!lab()) return;
    if (locked) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight' && curStation()) { e.preventDefault(); hGo(hIdxs[curStation()] + 1); }
    else if (e.key === 'ArrowLeft' && curStation()) { e.preventDefault(); hGo(hIdxs[curStation()] - 1); }
  });

  document.querySelectorAll('.hnav button').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = curStation();
      if (!locked && k) hGo(hIdxs[k] + (+b.dataset.h));
    });
  });

  window.__lab = {
    vGo: vGo, hGo: hGo,
    get v() { return vIdx; },
    get h() { var k = curStation(); return k ? hIdxs[k] : 0; },
    get station() { return curStation(); },
    hIdxs: hIdxs, stations: VP_OF,
    vCount: V_PAGES.length,
    hCount: function (k) { return STATIONS[k].length; },
    names: V_PAGES.map(function (p) { return p.name; })
  };

  layout();
</script>
</body>
</html>
