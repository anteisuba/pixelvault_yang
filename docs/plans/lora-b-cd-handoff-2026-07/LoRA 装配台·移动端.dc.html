        <span style="font-size:14px; color:var(--muted); padding:4px 8px;">库</span>
        <span style="font-size:14px; color:var(--faint); padding:4px 8px;">训练</span>
        <div style="flex:1"></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.44 0.02 252)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>

          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.44 0.02 252)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
          底模 WAI
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="oklch(0.565 0.018 250)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
        <span style="display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; font-size:12px; background:var(--panel); border:1px solid var(--hairline); border-radius:999px; box-shadow:var(--sh-raise); white-space:nowrap;"><span style="width:6px; height:6px; border-radius:50%; background:var(--ok);"></span>今汐</span>

      <div style="display:flex; align-items:center; gap:10px; padding:12px 16px 22px 16px; background:var(--panel); border-top:1px solid var(--hairline); box-shadow:0 -2px 8px rgba(30,42,66,.06);">

        <div style="flex:1"></div>

    <div data-screen-label="移动端·装配 sheet" style="width:390px; height:800px; background:var(--page); border:1px solid var(--hairline2); border-radius:28px; box-shadow:0 8px 32px rgba(30,42,66,.12); overflow:hidden; position:relative; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; gap:2px; padding:14px 18px 6px 18px; opacity:.45;">
        <span style="font-size:14px; font-weight:600; padding:4px 8px;">生成</span>
        <span style="font-size:14px; color:var(--muted); padding:4px 8px;">库</span>
      </div>
      <div style="position:absolute; inset:0; background:oklch(0.29 0.022 255 / 0.32);"></div>
      <div style="position:absolute; left:0; right:0; bottom:0; top:64px; background:var(--panel); border-radius:20px 20px 0 0; box-shadow:0 -8px 32px rgba(30,42,66,.18); display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:center; padding:9px 0 2px 0;"><span style="width:36px; height:4px; border-radius:999px; background:var(--hairline2);"></span></div>

          <span style="margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint);">已挂 3</span>
        </div>
        <div style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; box-shadow:var(--sh-raise); padding:12px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.44 0.02 252)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.565 0.018 250)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>
          </div>

              <span style="font-family:var(--mono); font-size:12px; color:var(--ink2);">0.8</span>
            </div>
            <div style="margin-top:9px; height:3px; border-radius:999px; background:var(--well);"><div style="height:100%; width:53%; background:var(--graphite); border-radius:999px;"></div></div>
          </div>
          <div style="background:var(--panel); border:1px solid var(--hairline); border-radius:12px; box-shadow:var(--sh-raise); padding:12px;">
            <div style="display:flex; align-items:center; gap:9px;">
              <span style="width:7px; height:7px; border-radius:50%; background:var(--ok);"></span>
              <span style="flex:1; font-size:13.5px; font-weight:500;">丹瑾</span>
              <span style="font-family:var(--mono); font-size:12px; color:var(--ink2);">1.0</span>
            </div>
            <div style="margin-top:9px; height:3px; border-radius:999px; background:var(--well);"><div style="height:100%; width:67%; background:var(--graphite); border-radius:999px;"></div></div>
          </div>
          <div style="background:var(--warn-tint); border:1px solid var(--warn-line); border-radius:12px; box-shadow:var(--sh-raise); padding:12px;">
            <div style="display:flex; align-items:center; gap:9px;">

          </div>
          <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding:11px; font-size:13px; color:var(--muted); border:1px dashed var(--hairline2); border-radius:12px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            添加 LoRA
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; padding-top:2px;">
            <span style="display:inline-flex; align-items:center; height:26px; padding:0 11px; font-family:var(--mono); font-size:11.5px; background:var(--panel); border:1px solid var(--hairline); border-radius:999px;">jinhsi</span>
            <span style="display:inline-flex; align-items:center; height:26px; padding:0 11px; font-family:var(--mono); font-size:11.5px; background:var(--panel); border:1px solid var(--hairline); border-radius:999px;">danjin</span>

</div>
