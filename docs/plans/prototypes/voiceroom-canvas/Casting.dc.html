<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #0a0a0a; }
    a { color: #0a0a0a; } a:hover { color: #616167; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; }
    .ava { border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 700; }
    .chip { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 10.5px; padding: 5px 11px; border: 1px solid #d3d3ce; border-radius: 999px; background: #ffffff; color: #0a0a0a; }
    .f { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 10.5px; padding: 5px 11px; border: 1px solid #d3d3ce; border-radius: 999px; color: #616167; }
    .vc { border: 1px solid #e6e6e2; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 9px; background: #ffffff; }
    .wv { display: flex; align-items: center; gap: 2px; height: 14px; }
    .wv i { display: block; width: 3px; border-radius: 2px; background: #0a0a0a; opacity: 0.75; }
    .play { width: 20px; height: 20px; border-radius: 999px; flex: none; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; }
    .join { font-size: 11px; font-weight: 600; padding: 6px 0; border-radius: 999px; border: 1px solid #0a0a0a; background: #ffffff; color: #0a0a0a; text-align: center; }
  </style>
</helmet>
<div style="width: 960px; height: 720px; background: #f4f4f1; padding: 20px; overflow: hidden;">
  <div style="width: 100%; height: 100%; background: #ffffff; border: 1px solid #e6e6e2; border-radius: 18px; box-shadow: 0 30px 80px -40px rgba(10,10,10,0.28); display: flex; flex-direction: column; overflow: hidden; position: relative;">

    <div style="display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid #e6e6e2;">
      <span style="font-size: 13px; font-weight: 700;">画展之夜</span>
      <span class="mono" style="margin-left: auto; font-size: 10.5px; color: #616167;">多说话人 ×8 · 音色库 + 克隆 · Fish S2.1</span>
      <span class="chip">素材库 <span style="color: #616167;">· 23</span></span>
      <span style="font-size: 11.5px; font-weight: 600; padding: 7px 16px; border-radius: 999px; background: #0a0a0a; color: #ffffff;">合成整场 · 0:12</span>
    </div>

    <div style="flex: 1;"></div>

    <div style="position: absolute; left: 0; right: 0; top: 45px; bottom: 0; background: rgba(10,10,10,0.22); border-radius: 0 0 18px 18px;"></div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; background: #ffffff; border-top: 1px solid #e6e6e2; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -20px 60px -30px rgba(10,10,10,0.4);">

      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid #e6e6e2;">
        <span style="font-size: 13px; font-weight: 700;">选角</span>
        <span style="display: flex; gap: 2px; margin-left: 2px;">
          <span class="mono" style="font-size: 10.5px; letter-spacing: 0.1em; padding: 4px 10px; color: #0a0a0a; border-bottom: 2px solid #0a0a0a;">音色库</span>
          <span class="mono" style="font-size: 10.5px; letter-spacing: 0.1em; padding: 4px 10px; color: #616167; border-bottom: 2px solid transparent;">我的克隆</span>
        </span>
        <span class="mono" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: #616167; font-size: 12px;">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="#616167" stroke-width="1.3"></path></svg>
          <span>关闭</span>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-bottom: 1px solid #e6e6e2;">
        <span class="mono" style="flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid #e6e6e2; border-radius: 999px; padding: 7px 13px; font-size: 11.5px; color: #616167;">搜嗓子——「低沉的男声」「像电台深夜节目」…</span>
        <span class="f" style="border-color: #0a0a0a; color: #0a0a0a;">全部</span>
        <span class="f">中文</span>
        <span class="f">英文</span>
        <span class="f">日文</span>
        <span class="f">女</span>
        <span class="f">男</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 18px 18px;">
        <div class="vc">
          <div style="display: flex; align-items: center; gap: 9px;">
            <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #c98da8, #8a4160);">晴</span>
            <div>
              <div style="font-size: 12.5px; font-weight: 700;">晴</div>
              <div class="mono" style="font-size: 9.5px; color: #616167;">女 · 温柔 · zh · Fish</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 12px;"></i><i style="height: 8px;"></i><i style="height: 13px;"></i><i style="height: 9px;"></i><i style="height: 12px;"></i><i style="height: 10px;"></i></span>
            <span class="mono" style="font-size: 10px; color: #616167;">0:06</span>
          </div>
          <span class="join" style="border-color: #d3d3ce; color: #616167;">已在班底</span>
        </div>
        <div class="vc">
          <div style="display: flex; align-items: center; gap: 9px;">
            <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #7fb8b0, #2f5e57);">澜</span>
            <div>
              <div style="font-size: 12.5px; font-weight: 700;">澜</div>
              <div class="mono" style="font-size: 9.5px; color: #616167;">女 · 电台夜话 · zh · Fish</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 9px;"></i><i style="height: 12px;"></i><i style="height: 7px;"></i><i style="height: 11px;"></i><i style="height: 9px;"></i><i style="height: 12px;"></i></span>
            <span class="mono" style="font-size: 10px; color: #616167;">0:07</span>
          </div>
          <span class="join">请进房间</span>
        </div>
        <div class="vc">
          <div style="display: flex; align-items: center; gap: 9px;">
            <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #b89a7f, #6b4a2f);">沉</span>
            <div>
              <div style="font-size: 12.5px; font-weight: 700;">沉</div>
              <div class="mono" style="font-size: 9.5px; color: #616167;">男 · 低音纪录片 · zh · Fish</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 11px;"></i><i style="height: 14px;"></i><i style="height: 9px;"></i><i style="height: 15px;"></i><i style="height: 12px;"></i><i style="height: 13px;"></i></span>
            <span class="mono" style="font-size: 10px; color: #616167;">0:05</span>
          </div>
          <span class="join">请进房间</span>
        </div>
        <div class="vc">
          <div style="display: flex; align-items: center; gap: 9px;">
            <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #a58ac9, #5c3f82);">雨</span>
            <div>
              <div style="font-size: 12.5px; font-weight: 700;">小雨（我的克隆）</div>
              <div class="mono" style="font-size: 9.5px; color: #616167;">克隆 · 8 段样本</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 10px;"></i><i style="height: 12px;"></i><i style="height: 8px;"></i><i style="height: 13px;"></i><i style="height: 9px;"></i><i style="height: 11px;"></i></span>
            <span class="mono" style="font-size: 10px; color: #616167;">0:04</span>
          </div>
          <span class="join">请进房间</span>
        </div>
        <div class="vc" style="border-style: dashed; align-items: center; justify-content: center; text-align: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1v14M1 8h14" stroke="#616167" stroke-width="1.6"></path></svg>
          <span style="font-size: 12px; font-weight: 600;">克隆新声音</span>
          <span class="mono" style="font-size: 9.5px; color: #616167; line-height: 1.6;">最多 8 段样本 · 每段 ≤10MB<br>两分钟就有自己的嗓子</span>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
