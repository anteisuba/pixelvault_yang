<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首页暗厅方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&display=swap">

<style>
  /* ═══ 暗厅方案 · demo 无约束轮 ═══════════════════════════════════
     视觉世界整个换掉：画廊暗厅 —— 全站深黑，生成物是唯一光源；
     中文巨词用衬线（美术馆立牌），数据用 mono，一点档案金。
     结构承自五幕拍板但收得更紧：开场 → 功能长廊（五功能自演）→
     模型时刻表（61 条线路的隐喻实体化）→ 收尾。
     单一视觉世界：不做浅色分支，底色与文色全部显式。 */
  :root {
    --void:  #09090b;   /* 厅外 */
    --hall:  #101013;   /* 厅内面板 */
    --edge:  #232329;
    --ink:   #f2efe8;   /* 暖白 */
    --dim:   #77746c;
    --gold:  #d0a75f;   /* 档案金：只给读数、票价、开关 */
    --glow:  rgba(240, 234, 220, .07);

    --serif: "Noto Serif SC", "Songti SC", serif;
    --mono:  "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans:  "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
    --gut: clamp(20px, 4.5vw, 72px);
  }

  * , *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: auto; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ═══ 幕 01 · 开场：灯暗了，开演 ═══════════════════════════════ */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(26px, 4.5vh, 44px);
    padding: 0 var(--gut);
    text-align: center;
  }
  .hero .stat {
    font-family: var(--mono); font-size: 11px; letter-spacing: .34em;
    color: var(--dim); text-transform: uppercase;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(2.5rem, 6.8vw, 5.6rem);
    line-height: 1.28; letter-spacing: .02em;
    text-wrap: balance;
  }
  .hero h1 .w { display: inline-block; opacity: 0; transform: translateY(.35em); animation: word .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes word { to { opacity: 1; transform: none; } }

  .hero .cta {
    display: inline-block; padding: 15px 44px;
    border: 1px solid var(--ink); border-radius: 999px;
    color: var(--ink); text-decoration: none;
    font-size: 15px; letter-spacing: .12em;
    transition: background .25s, color .25s;
  }
  .hero .cta:hover { background: var(--ink); color: var(--void); }
  .hero .sub { font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: .2em; }

  /* 微光带：全页唯一的横向流动 */
  .belt {
    position: absolute; inset: auto 0 0 0;
    border-top: 1px solid var(--edge);
    padding: 15px 0; overflow: hidden; white-space: nowrap;
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .belt-inner { display: inline-block; animation: belt 52s linear infinite; }
  .belt span { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-right: 54px; letter-spacing: .1em; }
  @keyframes belt { to { transform: translateX(-50%); } }
  .hero { position: relative; }

  /* ═══ 幕 02 · 功能长廊（钉住，五个功能自演） ══════════════════ */
  #hall { height: 640vh; position: relative; }
  .stage {
    position: sticky; top: 0; height: 100vh; min-height: 560px;
    overflow: hidden;
  }
  .piece {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 var(--gut);
    will-change: opacity;
  }

  /* 巨词静场：功能名先满屏一拍，再缩小上移让位给演示 */
  .piece .title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    will-change: transform, opacity;
  }
  .piece .title .no { font-family: var(--mono); font-size: 12px; letter-spacing: .5em; color: var(--gold); }
  .piece .title h2 {
    margin: 0; font-family: var(--serif); font-weight: 900;
    font-size: clamp(3.4rem, 11vw, 8.6rem); line-height: 1.06; letter-spacing: .04em;
    text-align: center;
  }
  .piece .title .en { font-family: var(--mono); font-size: clamp(11px, 1.2vw, 14px); letter-spacing: .5em; color: var(--dim); text-transform: uppercase; }

  .piece .demo {
    width: min(880px, 100%);
    will-change: transform, opacity;
    display: flex; flex-direction: column; gap: 18px; align-items: center;
  }
  .demo .label { font-family: var(--mono); font-size: 11px; letter-spacing: .4em; color: var(--dim); text-transform: uppercase; }
  .demo .label b { color: var(--ink); font-weight: 500; }

  /* ── 演示 1 · 图片生成：打字机 → 四格显影；LoRA 开关可点 ───── */
  .d-image { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
  .promptbar {
    display: flex; align-items: center; gap: 12px;
    width: min(620px, 100%);
    border: 1px solid var(--edge); border-radius: 12px;
    padding: 13px 18px; background: var(--hall);
    font-family: var(--mono); font-size: 13px;
  }
  .promptbar .cursor { width: 8px; height: 17px; background: var(--gold); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .plates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
  .plate {
    aspect-ratio: 1; border-radius: 12px; overflow: hidden;
    background: var(--hall); border: 1px solid var(--edge);
    position: relative;
    opacity: 0; transform: scale(.94);
    transition: opacity .8s ease, transform .8s ease;
  }
  .live .plate { opacity: 1; transform: none; }
  .live .plate:nth-child(2) { transition-delay: .25s; }
  .live .plate:nth-child(3) { transition-delay: .5s; }
  .live .plate:nth-child(4) { transition-delay: .75s; }
  .plate i {
    position: absolute; inset: 0;
    transition: filter 1s ease, opacity 1s ease;
  }
  /* API 轨：四张各是各的世界 */
  .plate:nth-child(1) i { background: radial-gradient(140% 120% at 20% 15%, #d8b26a, #7a4522 45%, #17100c 90%); }
  .plate:nth-child(2) i { background: radial-gradient(130% 130% at 80% 20%, #9fb7c9, #33506b 50%, #0d1420 92%); }
  .plate:nth-child(3) i { background: radial-gradient(120% 140% at 30% 85%, #cf8f7f, #6d3245 55%, #170d14 95%); }
  .plate:nth-child(4) i { background: radial-gradient(150% 110% at 70% 80%, #a8c39a, #3c5f42 50%, #0c130e 92%); }
  /* LoRA 轨：同一支笔 —— 四张统一成一个风格族 */
  .lora-on .plate i { filter: hue-rotate(310deg) saturate(.72) contrast(1.12); }
  .plate .seed {
    position: absolute; left: 9px; bottom: 7px;
    font-family: var(--mono); font-size: 8.5px; color: rgba(242,239,232,.55);
  }

  .lora-switch {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--dim);
    background: none; border: 0; cursor: pointer; padding: 6px 10px;
  }
  .lora-switch .track {
    width: 46px; height: 24px; border-radius: 999px;
    border: 1px solid var(--edge); background: var(--hall);
    position: relative; transition: background .3s, border-color .3s;
  }
  .lora-switch .knob {
    position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 999px;
    background: var(--dim); transition: transform .3s, background .3s;
  }
  .lora-switch[aria-pressed="true"] .track { border-color: var(--gold); background: rgba(208,167,95,.12); }
  .lora-switch[aria-pressed="true"] .knob { transform: translateX(22px); background: var(--gold); }
  .lora-switch em { font-style: normal; }
  .lora-switch[aria-pressed="true"] em.on-label { color: var(--gold); }

  /* ── 演示 2 · 声音生成：波形生长 + 播放头扫过 ─────────────── */
  .d-audio { width: min(680px, 100%); display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .wavebox {
    position: relative; width: 100%; height: 130px;
    border: 1px solid var(--edge); border-radius: 14px; background: var(--hall);
    display: flex; align-items: center; justify-content: center; gap: 3px;
    padding: 0 22px; overflow: hidden;
  }
  .wavebox i {
    flex: 1; max-width: 7px; height: 8%;
    background: var(--ink); border-radius: 2px; opacity: .8;
  }
  .live .wavebox i { animation: wave 1.7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -0.09s); }
  @keyframes wave { from { height: 6%; } to { height: var(--h); } }
  .wavebox .head {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: var(--gold); box-shadow: 0 0 14px rgba(208,167,95,.8);
    left: 4%;
  }
  .live .wavebox .head { animation: sweep 4.5s linear infinite; }
  @keyframes sweep { from { left: 4%; } to { left: 96%; } }

  /* ── 演示 3 · 视频生成：胶片帧展开 + 播放头 ───────────────── */
  .d-video { width: min(820px, 100%); display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .film {
    position: relative; width: 100%;
    display: flex; gap: 8px; padding: 14px;
    border: 1px solid var(--edge); border-radius: 14px; background: var(--hall);
    overflow: hidden;
  }
  .film i {
    flex: 1; aspect-ratio: 16/10; border-radius: 6px;
    background:
      linear-gradient(rgba(9,9,11,var(--fade,0)), rgba(9,9,11,var(--fade,0))),
      radial-gradient(130% 130% at calc(20% + var(--i) * 10%) 30%, #b9955c, #513a20 55%, #120d07 95%);
    opacity: 0; transform: translateX(18px);
    transition: opacity .5s ease, transform .5s ease;
    transition-delay: calc(var(--i) * .12s);
  }
  .live .film i { opacity: 1; transform: none; }
  .film .head {
    position: absolute; top: 8px; bottom: 8px; width: 1px;
    background: var(--gold); box-shadow: 0 0 12px rgba(208,167,95,.75);
    left: 2%;
  }
  .live .film .head { animation: sweep2 5s linear infinite; }
  @keyframes sweep2 { from { left: 2%; } to { left: 98%; } }

  /* ── 演示 4 · 画布：节点亮起 + 连线生长 ───────────────────── */
  .d-canvas { width: min(760px, 100%); }
  .graph {
    position: relative; width: 100%; aspect-ratio: 16/8.4;
    border: 1px solid var(--edge); border-radius: 14px; background: var(--hall);
    background-image: radial-gradient(circle, rgba(242,239,232,.05) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .graph svg path {
    fill: none; stroke: rgba(208,167,95,.55); stroke-width: 1.2;
    stroke-dasharray: 400; stroke-dashoffset: 400;
  }
  .live .graph svg path { animation: wire 1.4s ease forwards; }
  .live .graph svg path:nth-child(2) { animation-delay: .45s; }
  .live .graph svg path:nth-child(3) { animation-delay: .9s; }
  .live .graph svg path:nth-child(4) { animation-delay: 1.35s; }
  @keyframes wire { to { stroke-dashoffset: 0; } }
  .gnode {
    position: absolute; transform: translate(-50%, -50%) scale(.8);
    border: 1px solid var(--edge); background: var(--void);
    border-radius: 9px; padding: 8px 13px;
    font-family: var(--mono); font-size: 11px; color: var(--ink); white-space: nowrap;
    opacity: 0; transition: opacity .5s ease, transform .5s ease;
  }
  .gnode small { display: block; font-size: 8.5px; color: var(--dim); }
  .live .gnode { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .live .gnode:nth-of-type(2) { transition-delay: .4s; }
  .live .gnode:nth-of-type(3) { transition-delay: .8s; }
  .live .gnode:nth-of-type(4) { transition-delay: 1.2s; }
  .live .gnode:nth-of-type(5) { transition-delay: 1.6s; }

  /* ── 演示 5 · 资源库：生成物飞入格栅 + 计数器 ─────────────── */
  .d-vault { width: min(720px, 100%); display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .shelf { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; width: 100%; }
  .cell {
    aspect-ratio: 1; border-radius: 9px;
    border: 1px dashed var(--edge); background: transparent;
    position: relative; overflow: hidden;
  }
  .cell i {
    position: absolute; inset: 0; border-radius: 8px;
    background: radial-gradient(120% 120% at 30% 25%, var(--c1), var(--c2) 60%, #0b0b0d 96%);
    opacity: 0; transform: translateY(-46px) scale(.7);
    transition: opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1.2);
    transition-delay: calc(var(--i) * .12s);
  }
  .live .cell i { opacity: 1; transform: none; }
  .counter { font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--dim); }
  .counter b { color: var(--gold); font-weight: 500; }

  /* ═══ 幕 03 · 模型时刻表（DEPARTURES） ════════════════════════ */
  .board-sec { padding: clamp(90px, 16vh, 170px) var(--gut); }
  .board-head { max-width: 1180px; margin: 0 auto clamp(30px, 5vh, 52px); }
  .board-head .k { font-family: var(--mono); font-size: 11px; letter-spacing: .5em; color: var(--gold); text-transform: uppercase; }
  .board-head h2 {
    margin: 10px 0 0; font-family: var(--serif); font-weight: 900;
    font-size: clamp(2.6rem, 7vw, 5.4rem); letter-spacing: .03em; line-height: 1.1;
  }
  .board-head p { margin: 12px 0 0; font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: .12em; }

  .board {
    max-width: 1180px; margin: 0 auto;
    border: 1px solid var(--edge); border-radius: 16px; overflow: hidden;
    background: var(--hall);
  }
  .board-bar {
    display: grid; grid-template-columns: 92px 1fr 170px 90px 150px 40px;
    gap: 14px; align-items: center;
    padding: 12px 22px; border-bottom: 1px solid var(--edge);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .28em; color: var(--dim); text-transform: uppercase;
  }
  .modality-row {
    padding: 16px 22px 7px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .4em; color: var(--gold); text-transform: uppercase;
  }
  .frow { border-top: 1px solid rgba(35,35,41,.6); perspective: 900px; }
  .frow > button {
    display: grid; grid-template-columns: 92px 1fr 170px 90px 150px 40px;
    gap: 14px; align-items: baseline; width: 100%;
    padding: 15px 22px; background: none; border: 0; text-align: left; cursor: pointer;
    transform-origin: 50% 0;
    transition: transform .55s cubic-bezier(.2,.8,.25,1), opacity .5s ease, background .2s;
  }
  /* 翻牌的初始隐藏由 JS 挂 .pre 才生效 —— 没有 JS / IO 不跑时，行天生可见 */
  .frow.pre > button { transform: rotateX(-84deg); opacity: 0; }
  .frow > button:hover { background: var(--glow); }
  .frow .cell-mod { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .18em; }
  .frow .cell-name { font-family: var(--serif); font-weight: 600; font-size: clamp(15px, 1.7vw, 21px); letter-spacing: .02em; }
  .frow .cell-prov, .frow .cell-fare { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .frow .cell-routes { font-family: var(--mono); font-size: 11px; color: var(--ink); }
  .frow .cell-routes b { color: var(--gold); font-weight: 500; }
  .frow .cell-x { font-family: var(--mono); font-size: 13px; color: var(--dim); text-align: right; transition: transform .3s; }
  .frow[data-open="true"] .cell-x { transform: rotate(45deg); color: var(--gold); }

  .routes { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease; }
  .routes > div { overflow: hidden; }
  .routes ol {
    margin: 0; padding: 4px 22px 16px calc(92px + 36px); list-style: none;
    display: flex; flex-direction: column; gap: 2px;
  }
  .routes li {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 7px 14px; border-radius: 7px;
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: rgba(9,9,11,.55);
  }
  .routes li b { color: var(--ink); font-weight: 400; }
  .frow[data-open="true"] .routes { grid-template-rows: 1fr; }

  /* ═══ 幕 04 · 收尾 ════════════════════════════════════════════ */
  .fin {
    min-height: 90vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    padding: 0 var(--gut); text-align: center;
  }
  .fin h2 {
    margin: 0; font-family: var(--serif); font-weight: 900;
    font-size: clamp(2.4rem, 6.4vw, 5rem); letter-spacing: .03em;
  }
  .fin .cta {
    display: inline-block; padding: 16px 52px;
    background: var(--ink); color: var(--void); border-radius: 999px;
    text-decoration: none; font-size: 15px; letter-spacing: .14em;
    transition: background .25s;
  }
  .fin .cta:hover { background: var(--gold); }
  .fin .sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .3em; color: var(--dim); }
  .foot {
    padding: 30px var(--gut); border-top: 1px solid var(--edge);
    font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--dim);
    display: flex; justify-content: space-between; gap: 18px;
  }

  /* ═══ 读数器 ══════════════════════════════════════════════════ */
  .readout {
    position: fixed; z-index: 60; inset: auto 0 0 0;
    display: flex; align-items: center; gap: 16px;
    padding: 12px var(--gut) 14px;
    background: rgba(9,9,11,.78); backdrop-filter: blur(12px);
    border-top: 1px solid var(--edge);
    font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--dim);
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  .readout.on { opacity: 1; pointer-events: auto; }
  .readout .now { color: var(--ink); min-width: 11em; }
  .readout .rail { position: relative; flex: 1; height: 1px; background: var(--edge); }
  .readout .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--gold); box-shadow: 0 0 8px rgba(208,167,95,.6); }
  .readout .jumps { display: flex; gap: 8px; }
  .readout .jumps button {
    background: none; border: 0; cursor: pointer; padding: 4px 2px;
    display: grid; align-items: center;
  }
  .readout .jumps button i { display: block; width: 22px; height: 2px; background: var(--edge); transition: background .3s; }
  .readout .jumps button[data-on="true"] i { background: var(--gold); }

  /* ═══ 窄屏 / 减少动态：退静态堆叠 ═════════════════════════════ */
  @media (max-width: 900px), (prefers-reduced-motion: reduce) {
    #hall { height: auto; }
    .stage { position: static; height: auto; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 70px; padding: 70px 0; }
    .piece { position: static; inset: auto; opacity: 1 !important; display: flex; gap: 26px; }
    .piece .title { position: static; inset: auto; transform: none !important; opacity: 1 !important; }
    .piece .title h2 { font-size: clamp(2.4rem, 9vw, 4rem); }
    .piece .demo { transform: none !important; opacity: 1 !important; }
    .plate, .film i, .gnode, .cell i { opacity: 1 !important; transform: none !important; }
    .graph svg path { stroke-dashoffset: 0 !important; }
    .board-bar { grid-template-columns: 1fr 90px 40px; }
    .board-bar span:nth-child(1), .board-bar span:nth-child(3), .board-bar span:nth-child(5) { display: none; }
    .frow > button, .frow.pre > button { grid-template-columns: 1fr 90px 40px; transform: none; opacity: 1; }
    .frow .cell-mod, .frow .cell-prov, .frow .cell-fare { display: none; }
    .routes ol { padding-left: 22px; }
    .readout { display: none; }
    .belt-inner { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero h1 .w { animation: none; opacity: 1; transform: none; }
    .live .wavebox i, .live .wavebox .head, .live .film .head { animation: none; }
    .wavebox i { height: var(--h); }
  }
</style>
</head>
<body>

<!-- ══ 幕 01 · 开场 ═════════════════════════════════════════════ -->
<section class="hero" data-jump aria-label="开场">
  <p class="stat">19 MODELS · 61 ROUTES · 4 MODALITIES</p>
  <h1 id="h1"></h1>
  <a class="cta" href="#" onclick="return false">打开画布</a>
  <p class="sub">FREE START · NO CARD</p>

<!-- ══ 幕 02 · 功能长廊 ═════════════════════════════════════════ -->
<div id="hall" data-jump aria-label="功能长廊">
  <div class="stage" id="stage"></div>
</div>

<!-- ══ 幕 03 · 模型时刻表 ═══════════════════════════════════════ -->
<section class="board-sec" data-jump aria-label="模型时刻表">
  <div class="board-head">
    <p class="k">DEPARTURES</p>
    <h2>61 条线路。</h2>
    <p>19 个模型 · 4 种模态 —— 点开任意一行看全部接入线路</p>
  </div>
  <div class="board" id="board">
    <div class="board-bar">
      <span>MODALITY</span><span>MODEL</span><span>PROVIDER</span><span>ROUTES</span><span>FARE</span><span></span>

<!-- ══ 幕 04 · 收尾 ═════════════════════════════════════════════ -->
<section class="fin" data-jump aria-label="收尾">
  <h2>生成完，才是开始。</h2>
  <a class="cta" href="#" onclick="return false">打开画布</a>
  <p class="sub">EVERY RESULT, ARCHIVED</p>
</section>

<footer class="foot">
  <span>PIXELVAULT</span>
  <span>暗厅方案 · DEMO · 2026-08-27</span>
</footer>

<nav class="readout" id="readout" aria-label="页面导航">
  <span>PIXELVAULT</span>
  <span class="now" id="ro-now">开场</span>
  <span class="rail"><span class="fill" id="ro-fill"></span></span>
  <span class="jumps" id="ro-jumps"></span>
</nav>

<script>
  /* ═══ 数据 ═══════════════════════════════════════════════════ */
  var WORDS = ['用','每一个','模型','生成，', '留住','每一次','结果。'];

  var PROVIDERS = ['OpenAI','Google Gemini','fal.ai','NovelAI','ByteDance','ElevenLabs','Fish Audio','Replicate','Hyper3D','KLING','MiniMax','Hugging Face'];

  var PIECES = [
    { no: '01', zh: '图片生成', en: 'IMAGE · API × LORA', kind: 'image' },
    { no: '02', zh: '声音生成', en: 'AUDIO',              kind: 'audio' },
    { no: '03', zh: '视频生成', en: 'VIDEO',              kind: 'video' },
    { no: '04', zh: '画布',     en: 'CANVAS',             kind: 'canvas' },
    { no: '05', zh: '资源库',   en: 'VAULT',              kind: 'vault' }
  ];

  var BOARD = [
    { mod: 'IMAGE', rows: [
      ['GPT Image 2','OpenAI',1,'按用量',[['OpenAI GPT Image 2','按用量']]],
      ['Gemini Image','Google',3,'$0.03–0.13 / 张',[['Gemini 3 Pro Image','$0.13 / 张'],['Gemini 3.1 Flash Image','$0.07 / 张'],['Gemini 3.1 Flash Lite','$0.03 / 张']]],
      ['FLUX','BFL · fal.ai',5,'$0.005–0.08 / 张',[['Flux 2 Pro','$0.03 / 张'],['FLUX.2 Pro 编辑','$0.04 / 张'],['FLUX 2 Flash','$0.005 / 张'],['FLUX LoRA','$0.04 / 张'],['FLUX Kontext Max','$0.08 / 张']]],
      ['Seedream 5.0','ByteDance',5,'$0.03–0.09 / 张',[['Pro（fal.ai）','$0.07 / 张'],['Lite（fal.ai）','$0.04 / 张'],['标准（火山引擎）','按用量'],['Pro（火山引擎）','$0.09 / 张'],['Lite（火山引擎）','$0.03 / 张']]],
      ['NovelAI Diffusion','NovelAI',4,'$0.01 / 张起',[['V4.5 Full','$0.01 / 张'],['V4.5 Curated','$0.01 / 张'],['V5 Full','按用量'],['V5 Curated','按用量']]],
      ['Recraft V4 Pro','Recraft',1,'$0.21 / 张',[['Recraft V4 Pro','$0.21 / 张']]],
      ['Illustrious XL','开源底模',1,'$0.14 / 张',[['Illustrious XL','$0.14 / 张']]],
      ['自建 Runner','SELF-HOST',5,'按用量',[['WAI-Illustrious','按用量'],['Anima Pencil-XL','按用量'],['Pony Diffusion V6 XL','按用量'],['SDXL 1.0','按用量'],['Anima','按用量']]]
    ]},
    { mod: 'VIDEO', rows: [
      ['Seedance','ByteDance',18,'$0.12–0.30 / 秒',[['2.0 Fast · fal.ai','$0.24 / 秒'],['2.0 · fal.ai','$0.30 / 秒'],['2.0 Fast 参考 · fal.ai','$0.24 / 秒'],['2.0 参考 · fal.ai','$0.30 / 秒'],['2.0 Fast · 火山引擎','按用量'],['2.0 · 火山引擎','$0.14 / 秒'],['2.0 Fast 参考 · 火山引擎','按用量'],['2.0 参考 · 火山引擎','$0.14 / 秒'],['2.0 Fast · BytePlus','$0.12 / 秒'],['2.0 · BytePlus','$0.15 / 秒'],['2.0 Fast 参考 · BytePlus','$0.12 / 秒'],['2.0 参考 · BytePlus','$0.15 / 秒'],['2.5 · fal.ai','按用量'],['2.5 参考 · fal.ai','按用量'],['2.5 · BytePlus','$0.23 / 秒'],['2.5 参考 · BytePlus','$0.23 / 秒'],['2.5 · 火山方舟','$0.21 / 秒'],['2.5 参考 · 火山方舟','$0.21 / 秒']]],
      ['MiniMax H3','MiniMax',4,'$0.11–0.13 / 秒',[['H3','$0.13 / 秒'],['H3 参考','$0.13 / 秒'],['H3 国内','$0.11 / 秒'],['H3 参考 · 国内','$0.11 / 秒']]],
      ['通义万相 / HappyHorse','Alibaba',3,'$0.10–0.14 / 秒',[['Wan 3.0','$0.10 / 秒'],['Wan 3.0 参考生成','$0.10 / 秒'],['HappyHorse 1.1','$0.14 / 秒']]],
      ['可灵','KLING',2,'$0.14–0.17 / 秒',[['可灵 3.0 Pro','$0.17 / 秒'],['可灵 O3 Pro · Omni','$0.14 / 秒']]],
      ['Gemini Omni Flash','Google',1,'按用量',[['Gemini Omni Flash','按用量']]]
    ]},
    { mod: 'AUDIO', rows: [
      ['Fish Audio S2.1 Pro','Fish Audio',1,'$0.20 / 千字符',[['S2.1 Pro','$0.20 / 千字符']]],
      ['ElevenLabs','ElevenLabs',2,'按用量起',[['SFX v2','按用量'],['Music v2','$0.15 / 秒']]]
    ]},
    { mod: '3D', rows: [
      ['Rodin Gen-2.5','Hyper3D',1,'按用量',[['Rodin Gen-2.5','按用量']]],
      ['Hunyuan3D','Tencent',2,'按用量',[['v3.1 Pro','按用量'],['v3','按用量']]],
      ['Trellis 2','Microsoft',1,'按用量',[['Trellis 2','按用量']]],
      ['TripoSR','Tripo',1,'按用量',[['TripoSR','按用量']]]
    ]}
  ];

  /* ═══ 开场 ═══════════════════════════════════════════════════ */
  (function hero() {
    var h1 = document.getElementById('h1');
    WORDS.forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w';
      s.textContent = w;
      s.style.animationDelay = (0.15 + i * 0.14) + 's';
      h1.appendChild(s);
      if (w.slice(-1) === '，') h1.appendChild(document.createElement('br'));
    });
    var belt = document.getElementById('belt');
    var run = PROVIDERS.map(function (p) { return '<span>' + p + '</span>'; }).join('');
    belt.innerHTML = run + run;
  })();

  /* ═══ 功能长廊 ═══════════════════════════════════════════════ */
  (function hall() {
    var stage = document.getElementById('stage');

    function demoFor(kind) {
      if (kind === 'image') return '' +
        '<div class="d-image">' +
        '  <div class="promptbar"><span id="typer"></span><span class="cursor"></span></div>' +
        '  <div class="plates" id="plates">' +
        '    <div class="plate"><i></i><span class="seed">seed 8841</span></div>' +
        '    <div class="plate"><i></i><span class="seed">seed 8842</span></div>' +
        '    <div class="plate"><i></i><span class="seed">seed 8843</span></div>' +
        '    <div class="plate"><i></i><span class="seed">seed 8844</span></div>' +
        '  </div>' +
        '  <button type="button" class="lora-switch" id="lora" aria-pressed="false">' +
        '    <em>API</em><span class="track"><span class="knob"></span></span><em class="on-label">LORA · 同一支笔</em>' +
        '  </button>' +
        '</div>';
      if (kind === 'audio') {
        var bars = '';
        for (var i = 0; i < 42; i++) {
          bars += '<i style="--i:' + i + ';--h:' + (14 + Math.round(62 * Math.abs(Math.sin(i * 0.55)))) + '%"></i>';
        }
        return '<div class="d-audio"><div class="wavebox">' + bars + '<span class="head"></span></div>' +
               '<p class="label">「夜里最后一班渡轮。」 → <b>0:18</b></p></div>';
      }
      if (kind === 'video') {
        var frames = '';
        for (var j = 0; j < 7; j++) frames += '<i style="--i:' + j + ';--fade:' + (j * 0.06) + '"></i>';
        return '<div class="d-video"><div class="film">' + frames + '<span class="head"></span></div>' +
               '<p class="label">一张图 → <b>5s · 24fps</b></p></div>';
      }
      if (kind === 'canvas') return '' +
        '<div class="d-canvas"><div class="graph">' +
        '  <svg viewBox="0 0 760 400" preserveAspectRatio="none" aria-hidden="true">' +
        '    <path d="M 150 110 C 230 110, 250 180, 330 190" />' +
        '    <path d="M 150 290 C 230 290, 250 210, 330 200" />' +
        '    <path d="M 400 195 C 470 195, 490 130, 560 128" />' +
        '    <path d="M 400 195 C 470 195, 490 265, 560 268" />' +
        '  </svg>' +
        '  <span class="gnode" style="left:19%;top:27%">剧本<small>GPT-5.5 · 412 字</small></span>' +
        '  <span class="gnode" style="left:19%;top:73%">角色<small>Flux 2 Pro · 4/4</small></span>' +
        '  <span class="gnode" style="left:48%;top:49%">镜头<small>Seedream · seed 8841</small></span>' +
        '  <span class="gnode" style="left:78%;top:32%">音频<small>Fish Audio · 0:18</small></span>' +
        '  <span class="gnode" style="left:78%;top:67%">视频<small>Seedance · 5s</small></span>' +
        '</div></div>';
      // vault
      var cells = '';
      var tints = [['#caa268','#5a4426'],['#9fb7c9','#2f4a63'],['#cf8f7f','#63303f'],['#a8c39a','#37573d'],['#b9a4cd','#4a3a63'],['#c9c19a','#585134'],
                   ['#8fb3ab','#2f4d47'],['#c99a8f','#5c3a33'],['#a4b6cd','#3a4763'],['#c3b09a','#544736'],['#9ac3b7','#345349'],['#cda4b8','#5c3a4d']];
      for (var k = 0; k < 12; k++) {
        cells += '<div class="cell"><i style="--i:' + k + ';--c1:' + tints[k][0] + ';--c2:' + tints[k][1] + '"></i></div>';
      }
      return '<div class="d-vault"><div class="shelf">' + cells + '</div>' +
             '<p class="counter">ARCHIVED <b id="count">0</b> / 2,481</p></div>';
    }

    PIECES.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'piece';
      el.dataset.kind = p.kind;
      el.innerHTML =
        '<div class="title"><span class="no">' + p.no + ' / 05</span><h2>' + p.zh + '</h2><span class="en">' + p.en + '</span></div>' +
        '<div class="demo">' + demoFor(p.kind) + '<p class="label demo-cap"></p></div>';
      stage.appendChild(el);
    });

    // LoRA 双轨开关（可点交互）
    var lora = document.getElementById('lora');
    var plates = document.getElementById('plates');
    lora.addEventListener('click', function () {
      var on = lora.getAttribute('aria-pressed') !== 'true';
      lora.setAttribute('aria-pressed', String(on));
      plates.classList.toggle('lora-on', on);
    });

    // 打字机（进入图片幕时跑一次）
    window.__typeOnce = function () {
      var t = document.getElementById('typer');
      if (!t || t.dataset.done) return;
      t.dataset.done = '1';
      var line = '海边小城，黄昏，胶片颗粒';
      var i = 0;
      (function tick() {
        t.textContent = line.slice(0, ++i);
        if (i < line.length) setTimeout(tick, 70);
      })();
    };

    // 归档计数器（进入资源库幕时滚一次）
    window.__countOnce = function () {
      var c = document.getElementById('count');
      if (!c || c.dataset.done) return;
      c.dataset.done = '1';
      var v = 0, target = 2481;
      (function tick() {
        v = Math.min(target, v + Math.ceil((target - v) * 0.12) + 7);
        c.textContent = v.toLocaleString();
        if (v < target) setTimeout(tick, 40);
      })();
    };
  })();

  /* ═══ 时刻表 ═════════════════════════════════════════════════ */
  (function board() {
    var host = document.getElementById('board');
    BOARD.forEach(function (grp) {
      var mrow = document.createElement('div');
      mrow.className = 'modality-row';
      mrow.textContent = grp.mod;
      host.appendChild(mrow);

      grp.rows.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'frow';
        row.dataset.open = 'false';
        var lis = r[4].map(function (l) {
          return '<li><b>' + l[0] + '</b><span>' + l[1] + '</span></li>';
        }).join('');
        row.innerHTML =
          '<button type="button" aria-expanded="false">' +
          '  <span class="cell-mod">' + grp.mod + '</span>' +
          '  <span class="cell-name">' + r[0] + '</span>' +
          '  <span class="cell-prov">' + r[1] + '</span>' +
          '  <span class="cell-routes"><b>' + r[2] + '</b> 条</span>' +
          '  <span class="cell-fare">' + r[3] + '</span>' +
          '  <span class="cell-x">＋</span>' +
          '</button>' +
          '<div class="routes"><div><ol>' + lis + '</ol></div></div>';
        row.querySelector('button').addEventListener('click', function () {
          var open = row.dataset.open !== 'true';
          row.dataset.open = String(open);
          row.querySelector('button').setAttribute('aria-expanded', String(open));
        });
        host.appendChild(row);
      });
    });

    // 逐行翻牌入场：JS 先挂 .pre 藏起来，进入视口摘掉 —— IO 不在就全程可见
    if ('IntersectionObserver' in window && window.matchMedia('(min-width: 901px)').matches
        && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var seen = 0;
      var rows = document.querySelectorAll('.frow');
      rows.forEach(function (r) { r.classList.add('pre'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          var row = e.target;
          row.style.transitionDelay = (Math.min(seen++, 8) * 0.06) + 's';
          row.classList.remove('pre');
          io.unobserve(row);
        });
      }, { rootMargin: '0px 0px -8% 0px' });
      rows.forEach(function (r) { io.observe(r); });
    }
  })();

  /* ═══ 滚动驱动：经黑转场 + 巨词让位 + 读数器 ═════════════════ */
  var pieces = [].slice.call(document.querySelectorAll('.piece'));
  var hallEl = document.getElementById('hall');
  var jumps  = [].slice.call(document.querySelectorAll('[data-jump]'));
  var NAMES  = ['开场', '', 'DEPARTURES', '收尾'];
  var readout = document.getElementById('readout');
  var roNow = document.getElementById('ro-now');
  var roFill = document.getElementById('ro-fill');
  var pinned = true;

  (function dots() {
    var host = document.getElementById('ro-jumps');
    jumps.forEach(function (el, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '跳到第 ' + (i + 1) + ' 幕');
      b.innerHTML = '<i></i>';
      b.addEventListener('click', function () {
        window.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
      });
      host.appendChild(b);
    });
  })();
  var roDots = [].slice.call(document.querySelectorAll('#ro-jumps button'));

  function hallProgress() {
    var span = hallEl.offsetHeight - window.innerHeight;
    return Math.min(1, Math.max(0, -hallEl.getBoundingClientRect().top / span));
  }

  function paintHall(p) {
    var n = pieces.length, span = 1 / n;
    var liveIndex = Math.min(n - 1, Math.floor(p / span + 0.0001));

    pieces.forEach(function (piece, i) {
      var t = (p - i * span) / span;

      /* 经黑：退场在 [0.86, 0.94] 归零，进场在 [0.06, 0.14] 从零起 ——
         中间是一拍纯黑，两件展品永不同厅。 */
      var o;
      if (t < 0.06 || t > 0.94) o = 0;
      else if (t < 0.14) o = (t - 0.06) / 0.08;
      else if (t > 0.86) o = (0.94 - t) / 0.08;
      else o = 1;
      if (i === 0 && t < 0.14) o = 1;
      if (i === n - 1 && t > 0.86 && t <= 1) o = 1;
      piece.style.opacity = o.toFixed(3);
      piece.inert = o < 0.5;

      /* 巨词静场 → 缩小上移让位给演示 */
      var title = piece.querySelector('.title');
      var demo  = piece.querySelector('.demo');
      var so, sc, sy, dop, dy;
      if (t < 0.26) { so = 1; sc = 1; sy = 0; }
      else if (t < 0.42) {
        var k = (t - 0.26) / 0.16;
        so = 1 - k; sc = 1 - 0.22 * k; sy = -k * 26;
      } else { so = 0; sc = 0.78; sy = -26; }
      if (t < 0.30) { dop = 0; dy = 40; }
      else if (t < 0.46) { var k2 = (t - 0.30) / 0.16; dop = k2; dy = (1 - k2) * 40; }
      else { dop = 1; dy = 0; }

      title.style.opacity = so.toFixed(3);
      title.style.transform = 'translate3d(0,' + sy.toFixed(1) + 'vh,0) scale(' + sc.toFixed(3) + ')';
      demo.style.opacity = dop.toFixed(3);
      demo.style.transform = 'translate3d(0,' + dy.toFixed(1) + 'px,0)';

      /* 演示激活：这一件在演，别的停 */
      var isLive = i === liveIndex && t > 0.28 && t < 0.96;
      piece.classList.toggle('live', isLive);
      if (isLive && piece.dataset.kind === 'image') window.__typeOnce();
      if (isLive && piece.dataset.kind === 'vault') window.__countOnce();
    });

    return liveIndex;
  }

  function paint() {
    if (!pinned) return;
    var mid = window.innerHeight / 2;
    var current = 0;
    jumps.forEach(function (el, i) { if (el.getBoundingClientRect().top <= mid) current = i; });

    var label = NAMES[current], prog = 0;
    if (current === 1) {
      var p = hallProgress();
      var li = paintHall(p);
      label = PIECES[li].no + ' · ' + PIECES[li].zh;
      prog = p;
    } else {
      var el = jumps[current];
      var span = el.offsetHeight - window.innerHeight;
      prog = span > 0
        ? Math.min(1, Math.max(0, -el.getBoundingClientRect().top / span))
        : Math.min(1, Math.max(0, (window.innerHeight - el.getBoundingClientRect().top) / (window.innerHeight + el.offsetHeight)));
    }

    roNow.textContent = label;
    roFill.style.width = (prog * 100).toFixed(1) + '%';
    roDots.forEach(function (d, i) { d.dataset.on = String(i === current); });
    readout.classList.toggle('on', jumps[0].getBoundingClientRect().bottom < mid);
  }

  function measure() {
    pinned = window.matchMedia('(min-width: 901px)').matches
          && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!pinned) {
      readout.classList.remove('on');
      pieces.forEach(function (p) { p.classList.add('live'); });
      window.__typeOnce(); window.__countOnce();
      return;
    }
    paint();
  }

  // scroll 直连、不做 rAF 节流（隐藏页里 rAF 会冻结）
  window.addEventListener('scroll', paint, { passive: true });
  window.addEventListener('resize', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  window.addEventListener('load', measure);
  measure();
</script>
