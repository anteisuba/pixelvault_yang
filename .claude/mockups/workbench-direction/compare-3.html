<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作台方向 · 对比 3：落地时的四处细节</title>
    <style>
      /* 已定的方向全部照 globals.css 现值：偏暖、四档字号、只有输入框浮起 */
      :root {
        --ground: #e9e6e0;
        --panel: #ffffff;
        --fill: #f5f3ef;
        --fill-strong: #eeebe5;
        --line: rgba(28, 22, 14, 0.08);
        --line-strong: rgba(28, 22, 14, 0.15);
        --ink: #171411;
        --ink-2: #4b463f;
        --ink-3: #655f57;
        --bubble: #f2efea;
        --card: 0 0 0 1px rgba(16, 18, 24, 0.05), 0 2px 6px rgba(16, 18, 24, 0.05),
          0 12px 28px rgba(16, 18, 24, 0.08);
        --soft: 0 0 0 1px rgba(16, 18, 24, 0.06), 0 1px 2px rgba(16, 18, 24, 0.08),
          0 2px 6px rgba(16, 18, 24, 0.05);
        --sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

        /* ① 按钮字重  A 中等 500 / B 常规 400（主按钮两档都是 600） */
        --w-btn: 500;
        /* ② 舞台标题  A 15 / B 20 */
        --t-head: 15px;
        /* ③ 舞台内距  A 18 / B 32 */
        --pad-stage: 18px;
        --gap-stage-comp: 12px;
        /* ④ 搜索框和键的圆角  A 小圆角 / B 全圆 */
        --r-field: 8px;
      }
      body.w-b {
        --w-btn: 400;
      }
      body.h-b {
        --t-head: 20px;
      }
      body.p-b {
        --pad-stage: 32px;
        --gap-stage-comp: 28px;
      }
      body.r-b {
        --r-field: 999px;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
      }
      button {
        cursor: pointer;
      }

      .switch {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #101216;
        color: #fff;
        font-size: 13px;
      }
      .switch .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }
      .switch .seg button {
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.72);
      }
      .switch .seg button[aria-pressed='true'] {
        background: #fff;
        color: #101216;
        font-weight: 600;
      }
      .switch kbd {
        font-family: var(--mono);
        font-size: 11px;
        opacity: 0.55;
      }

      .frame {
        margin: 0 auto;
        transition: max-width 0.2s;
      }
      body.narrow .frame {
        max-width: 820px;
      }
      .board {
        display: flex;
        margin: 8px;
        height: calc(100vh - 70px);
        min-height: 460px;
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 0 0 1px rgba(16, 18, 24, 0.06), 0 1px 2px rgba(16, 18, 24, 0.04);
        overflow: hidden;
      }
      .chat {
        width: 300px;
        flex: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 14px;
        padding: 20px;
        border-right: 1px solid var(--line);
        font-size: 15px;
        line-height: 1.7;
      }
      @media (max-width: 640px) {
        .chat {
          display: none;
        }
      }
      .me {
        align-self: flex-end;
        padding: 8px 14px;
        border-radius: 18px;
        background: var(--bubble);
      }

      .bench {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap-stage-comp);
        padding: var(--pad-stage);
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
      }
      .head h1 {
        margin: 0 auto 0 0;
        flex: none;
        white-space: nowrap;
        font-size: var(--t-head);
        font-weight: 600;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        width: 240px;
        height: 36px;
        padding: 0 12px;
        border-radius: var(--r-field);
        background: var(--fill);
        color: var(--ink-3);
      }
      .search input {
        min-width: 0;
        flex: 1;
        outline: none;
      }
      .btn {
        flex: none;
        height: 32px;
        padding: 0 14px;
        border-radius: 999px;
        background: var(--panel);
        box-shadow: var(--soft);
        font-size: 13px;
        font-weight: var(--w-btn);
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
        overflow: hidden;
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .tile .img {
        aspect-ratio: 4 / 3;
        border-radius: 12px;
        background: var(--fill-strong) center / cover no-repeat;
      }
      .tile b {
        font-size: 13px;
        font-weight: 600;
      }
      .tile span {
        color: var(--ink-3);
        font-size: 11px;
      }
      .save {
        align-self: flex-start;
        height: 28px;
        padding: 0 12px;
        border-radius: var(--r-field);
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }

      .composer {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px 16px 12px;
        border-radius: 16px;
        background: var(--panel);
        box-shadow: var(--card);
      }
      .composer p {
        margin: 0;
        color: var(--ink-3);
        font-size: 15px;
        line-height: 1.7;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--fill);
        color: var(--ink-2);
        font-size: 13px;
        font-weight: var(--w-btn);
        white-space: nowrap;
      }
      .chip.icon {
        width: 32px;
        padding: 0;
        justify-content: center;
      }
      .cost {
        margin-left: auto;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 11px;
      }
      .go {
        height: 32px;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="switch" role="toolbar" aria-label="对比开关">
      <div class="group">
        <span>① 按钮字</span>
        <span class="seg" data-var="w">
          <button aria-pressed="true" data-v="a">A 中等</button>
          <button aria-pressed="false" data-v="b">B 常规</button>
        </span>
        <kbd>1/2</kbd>
      </div>
      <div class="group">
        <span>② 标题</span>
        <span class="seg" data-var="h">
          <button aria-pressed="true" data-v="a">A 15</button>
          <button aria-pressed="false" data-v="b">B 20</button>
        </span>
        <kbd>3/4</kbd>
      </div>
      <div class="group">
        <span>③ 舞台内距</span>
        <span class="seg" data-var="p">
          <button aria-pressed="true" data-v="a">A 18</button>
          <button aria-pressed="false" data-v="b">B 32</button>
        </span>
        <kbd>5/6</kbd>
      </div>
      <div class="group">
        <span>④ 搜索框和键</span>
        <span class="seg" data-var="r">
          <button aria-pressed="true" data-v="a">A 小圆角</button>
          <button aria-pressed="false" data-v="b">B 全圆</button>
        </span>
        <kbd>7/8</kbd>
      </div>
      <div class="group">
        <span>窗口</span>
        <span class="seg" data-var="narrow">
          <button aria-pressed="true" data-v="a">宽</button>
          <button aria-pressed="false" data-v="b">窄</button>
        </span>
        <kbd>0</kbd>
      </div>
    </div>

    <div class="frame">
      <div class="board">
        <aside class="chat">
          <div class="me">把衣服那张模板套上，换成冬天的版本</div>
          <div>套好了，提示词在右边输入框里，你看一眼再生成。</div>
        </aside>
        <main class="bench">
          <section class="stage">
            <div class="head">
              <h1>我的图片模板 · 6</h1>
              <label class="search">⌕ <input placeholder="搜索模板" /></label>
              <button class="btn">＋ 新建模板</button>
              <button class="btn">返回结果</button>
            </div>
            <div class="grid">
              <div class="tile">
                <div class="img"></div>
                <b>当前提示词</b>
                <span>先写好提示词</span>
                <button class="save">存下</button>
              </div>
              <div class="tile">
                <div
                  class="img"
                  style="background-image: url(../home-v6/media/production/quad/quad-gpt-image-2.webp)"
                ></div>
                <b>衣服</b>
                <span>提取图中的衣服并且生成三视图</span>
              </div>
              <div class="tile">
                <div
                  class="img"
                  style="background-image: url(../home-v6/media/production/quad/quad-gemini-3-pro.webp)"
                ></div>
                <b>人设图</b>
                <span>电影分镜级人设图，包含三视图</span>
              </div>
              <div class="tile">
                <div
                  class="img"
                  style="background-image: url(../home-v6/media/production/quad/quad-seedream-5-0.webp)"
                ></div>
                <b>提取人物</b>
                <span>动作画风人物服装都和原图一致</span>
              </div>
            </div>
          </section>
          <section class="composer">
            <p>描述动作、场景或表情…</p>
            <div class="row">
              <button class="chip icon" aria-label="加图">＋</button>
              <button class="chip">先搜再画</button>
              <button class="chip">从图读串</button>
              <button class="chip">改图</button>
              <button class="chip">模板</button>
              <button class="chip">角色</button>
              <button class="chip">Seedream 5.0 Lite ▾</button>
              <button class="chip">1:1 · 1 张 ▾</button>
              <button class="chip">专属</button>
              <span class="cost">约 $0.03</span>
              <button class="go">生成</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script>
      const set = (name, v) => {
        const cls = name === 'narrow' ? 'narrow' : name + '-b'
        document.body.classList.toggle(cls, v === 'b')
        document
          .querySelectorAll(`.seg[data-var="${name}"] button`)
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)))
      }
      document.querySelectorAll('.seg').forEach((seg) =>
        seg.addEventListener('click', (e) => {
          const b = e.target.closest('button')
          if (b) set(seg.dataset.var, b.dataset.v)
        }),
      )
      const keys = { 1: ['w', 'a'], 2: ['w', 'b'], 3: ['h', 'a'], 4: ['h', 'b'], 5: ['p', 'a'], 6: ['p', 'b'], 7: ['r', 'a'], 8: ['r', 'b'] }
      addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return
        if (keys[e.key]) set(...keys[e.key])
        if (e.key === '0') set('narrow', document.body.classList.contains('narrow') ? 'a' : 'b')
      })
      const q = new URLSearchParams(location.search)
      for (const k of ['w', 'h', 'p', 'r', 'narrow']) if (q.get(k)) set(k, q.get(k))
    </script>
  </body>
</html>
