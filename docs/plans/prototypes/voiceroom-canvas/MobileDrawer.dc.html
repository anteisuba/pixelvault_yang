<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #0a0a0a; }
    a { color: #0a0a0a; } a:hover { color: #616167; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; }
    .serif { font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; }
    .ava { border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 700; }
    .rm { border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .dot { width: 15px; height: 15px; border-radius: 999px; border: 2px solid #ffffff; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #e6e6e2;">
    <svg width="15" height="12" viewBox="0 0 15 12"><path d="M0 1h15M0 6h15M0 11h15" stroke="#0a0a0a" stroke-width="1.5"></path></svg>
    <span style="font-size: 13px; font-weight: 700;">画展之夜</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px;">
      <span class="mono" style="font-size: 9.5px; padding: 4px 9px; border: 1px solid #d3d3ce; border-radius: 999px;">素材库 <span style="color: #616167;">· 23</span></span>
      <span style="font-size: 10.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #0a0a0a; color: #ffffff;">合成 · 0:12</span>
    </span>
  </div>
  <div style="flex: 1;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(10,10,10,0.28);"></div>

  <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 76%; background: #ffffff; border-right: 1px solid #e6e6e2; display: flex; flex-direction: column; gap: 8px; padding: 16px 12px; box-shadow: 20px 0 60px -30px rgba(10,10,10,0.4);">
    <span class="mono" style="font-size: 9.5px; letter-spacing: 0.2em; color: #616167; text-transform: uppercase; padding: 0 4px 4px;">房间</span>
    <div class="mono" style="display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #616167; border: 1px dashed #d3d3ce; border-radius: 12px; padding: 10px 12px;">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0v10M0 5h10" stroke="#616167" stroke-width="1.4"></path></svg>
      <span>新房间</span>
    </div>
    <div class="rm" style="background: #f4f4f1; border-color: #e6e6e2;">
      <span class="serif" style="font-size: 13.5px; font-weight: 700;">画展之夜</span>
      <span style="display: flex; align-items: center; gap: 6px; min-height: 15px;">
        <span style="display: flex;">
          <span class="ava dot" style="background: linear-gradient(135deg, #c98da8, #8a4160);"></span>
          <span class="ava dot" style="margin-left: -5px; background: linear-gradient(135deg, #7fa3c9, #33506b);"></span>
          <span class="ava dot" style="margin-left: -5px; background: linear-gradient(135deg, #c9b47f, #8a6f33);"></span>
          <span class="ava dot" style="margin-left: -5px; background: linear-gradient(135deg, #8a94a6, #3a4356);"></span>
        </span>
        <span class="mono" style="font-size: 9px; color: #616167; margin-left: auto;">刚刚</span>
      </span>
    </div>
    <div class="rm">
      <span class="serif" style="font-size: 13.5px; font-weight: 400; color: #616167;">未命名房间</span>
      <span style="display: flex; align-items: center; min-height: 15px;">
        <span class="mono" style="font-size: 9px; color: #616167; margin-left: auto;">空</span>
      </span>
    </div>
    <div class="rm">
      <span class="serif" style="font-size: 13.5px; font-weight: 700;">睡前故事 · 第三章</span>
      <span style="display: flex; align-items: center; gap: 6px; min-height: 15px;">
        <span style="display: flex;">
          <span class="ava dot" style="background: linear-gradient(135deg, #c9b47f, #8a6f33);"></span>
          <span class="ava dot" style="margin-left: -5px; background: linear-gradient(135deg, #87b096, #33584a);"></span>
        </span>
        <span class="mono" style="font-size: 9px; color: #616167; margin-left: auto;">昨天</span>
      </span>
    </div>
    <div class="rm">
      <span class="serif" style="font-size: 13.5px; font-weight: 700;">广告 15 秒 · 三版</span>
      <span style="display: flex; align-items: center; gap: 6px; min-height: 15px;">
        <span style="display: flex;">
          <span class="ava dot" style="background: linear-gradient(135deg, #7fa3c9, #33506b);"></span>
          <span class="ava dot" style="margin-left: -5px; background: linear-gradient(135deg, #8a94a6, #3a4356);"></span>
        </span>
        <span class="mono" style="font-size: 9px; color: #616167; margin-left: auto;">周三</span>
      </span>
    </div>
    <p class="mono" style="margin: auto 0 0; font-size: 9px; color: #616167; line-height: 1.7; padding: 0 4px;">每个房间自带<br>班底 · 底垫 · 素材</p>
  </div>

</div>
</x-dc>
</body>
</html>
