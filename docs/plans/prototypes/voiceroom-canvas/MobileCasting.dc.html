<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #0a0a0a; }
    a { color: #0a0a0a; } a:hover { color: #616167; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; }
    .ava { border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 700; }
    .f { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 9.5px; padding: 4px 10px; border: 1px solid #d3d3ce; border-radius: 999px; color: #616167; flex: none; }
    .vc { border: 1px solid #e6e6e2; border-radius: 13px; padding: 11px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; }
    .wv { display: flex; align-items: center; gap: 2px; height: 13px; }
    .wv i { display: block; width: 2.5px; border-radius: 2px; background: #0a0a0a; opacity: 0.75; }
    .play { width: 18px; height: 18px; border-radius: 999px; flex: none; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; }
    .join { font-size: 10.5px; font-weight: 600; padding: 6px 0; border-radius: 999px; border: 1px solid #0a0a0a; background: #ffffff; color: #0a0a0a; text-align: center; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid #e6e6e2;">
    <span style="font-size: 13px; font-weight: 700;">选角</span>
    <span style="display: flex; gap: 2px;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.08em; padding: 4px 9px; color: #0a0a0a; border-bottom: 2px solid #0a0a0a;">音色库</span>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.08em; padding: 4px 9px; color: #616167; border-bottom: 2px solid transparent;">我的克隆</span>
    </span>
    <span style="margin-left: auto;"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1 1l9 9M10 1l-9 9" stroke="#616167" stroke-width="1.3"></path></svg></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 11px 14px; border-bottom: 1px solid #e6e6e2;">
    <span class="mono" style="display: flex; align-items: center; gap: 8px; border: 1px solid #e6e6e2; border-radius: 999px; padding: 8px 13px; font-size: 10.5px; color: #616167;">搜嗓子——「低沉的男声」…</span>
    <div style="display: flex; gap: 6px; overflow: hidden;">
      <span class="f" style="border-color: #0a0a0a; color: #0a0a0a;">全部</span>
      <span class="f">中文</span>
      <span class="f">英文</span>
      <span class="f">日文</span>
      <span class="f">女</span>
      <span class="f">男</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; padding: 12px 14px; align-content: start;">
    <div class="vc">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="ava" style="width: 28px; height: 28px; font-size: 11px; background: linear-gradient(135deg, #c98da8, #8a4160);">晴</span>
        <div>
          <div style="font-size: 12px; font-weight: 700;">晴</div>
          <div class="mono" style="font-size: 8.5px; color: #616167;">女 · 温柔 · zh</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="play"><svg width="7" height="8" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
        <span class="wv"><i style="height: 10px;"></i><i style="height: 7px;"></i><i style="height: 11px;"></i><i style="height: 8px;"></i><i style="height: 10px;"></i></span>
        <span class="mono" style="font-size: 9px; color: #616167;">0:06</span>
      </div>
      <span class="join" style="border-color: #d3d3ce; color: #616167;">已在班底</span>
    </div>
    <div class="vc">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="ava" style="width: 28px; height: 28px; font-size: 11px; background: linear-gradient(135deg, #7fb8b0, #2f5e57);">澜</span>
        <div>
          <div style="font-size: 12px; font-weight: 700;">澜</div>
          <div class="mono" style="font-size: 8.5px; color: #616167;">女 · 电台夜话 · zh</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="play"><svg width="7" height="8" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
        <span class="wv"><i style="height: 8px;"></i><i style="height: 10px;"></i><i style="height: 6px;"></i><i style="height: 9px;"></i><i style="height: 8px;"></i></span>
        <span class="mono" style="font-size: 9px; color: #616167;">0:07</span>
      </div>
      <span class="join">请进房间</span>
    </div>
    <div class="vc">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="ava" style="width: 28px; height: 28px; font-size: 11px; background: linear-gradient(135deg, #b89a7f, #6b4a2f);">沉</span>
        <div>
          <div style="font-size: 12px; font-weight: 700;">沉</div>
          <div class="mono" style="font-size: 8.5px; color: #616167;">男 · 低音纪录片 · zh</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="play"><svg width="7" height="8" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
        <span class="wv"><i style="height: 9px;"></i><i style="height: 12px;"></i><i style="height: 7px;"></i><i style="height: 12px;"></i><i style="height: 10px;"></i></span>
        <span class="mono" style="font-size: 9px; color: #616167;">0:05</span>
      </div>
      <span class="join">请进房间</span>
    </div>
    <div class="vc">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="ava" style="width: 28px; height: 28px; font-size: 11px; background: linear-gradient(135deg, #a58ac9, #5c3f82);">雨</span>
        <div>
          <div style="font-size: 12px; font-weight: 700;">小雨（克隆）</div>
          <div class="mono" style="font-size: 8.5px; color: #616167;">克隆 · 8 段样本</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="play"><svg width="7" height="8" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
        <span class="wv"><i style="height: 9px;"></i><i style="height: 10px;"></i><i style="height: 7px;"></i><i style="height: 11px;"></i><i style="height: 8px;"></i></span>
        <span class="mono" style="font-size: 9px; color: #616167;">0:04</span>
      </div>
      <span class="join">请进房间</span>
    </div>
    <div class="vc" style="border-style: dashed; align-items: center; justify-content: center; text-align: center; gap: 5px;">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="#616167" stroke-width="1.5"></path></svg>
      <span style="font-size: 11.5px; font-weight: 600;">克隆新声音</span>
      <span class="mono" style="font-size: 8.5px; color: #616167; line-height: 1.6;">8 段样本 · 每段 ≤10MB</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
