<title>画布节点打磨</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap"
/>
<style>
  /* 单一浅色：画布是浅色媒体工作面（ui-defaults §2.1），刻意不做暗色档；所有颜色都显式给出。 */
  :root {
    --ink: #0a0a0a;
    --ink-2: #474744;
    --muted: #696969;
    --faint: rgba(105, 105, 105, 0.75); /* muted-foreground/75 */
    --canvas: #f1f1f1;
    --shell: #ebebeb;
    --card: #ffffff;
    --line: rgba(10, 10, 10, 0.08);
    --line-2: #e5e5e5; /* --border */
    --fill: rgba(10, 10, 10, 0.04); /* --surface-fill */
    --fill-2: rgba(10, 10, 10, 0.07); /* --surface-fill-hover */
    --fill-3: rgba(10, 10, 10, 0.11); /* --surface-fill-track */
    --dot: rgba(64, 58, 47, 0.2);
    --glass: rgba(255, 255, 255, 0.7);
    --sh-card: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px -12px rgb(0 0 0 / 0.18);
    --sh-float: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 28px -12px rgb(0 0 0 / 0.32);
    --sh-overlay:
      0 1px 2px rgb(0 0 0 / 0.06), 0 18px 44px -18px rgb(0 0 0 / 0.38);
    --sh-paper:
      0 2px 4px rgb(0 0 0 / 0.05), 0 26px 60px -22px rgb(0 0 0 / 0.3); /* --shadow-node-card-expanded */
    --r-node: 18px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font:
      Geist, 'Noto Sans SC', system-ui, -apple-system, 'PingFang SC', sans-serif;
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--shell);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  svg.i {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }
  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  /* ── 原型控制条（不属于产品界面） ── */
  .proto {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    padding-block: 10px;
    padding-inline: 16px;
    background: #fbfbfa;
    border-bottom: 1px solid var(--line-2);
  }
  .proto .pt {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .proto .pt span {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
    margin-left: 6px;
  }
  .seg {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 10px;
    background: var(--fill);
  }
  .seg .lab {
    font-size: 11px;
    color: var(--muted);
    padding: 0 6px 0 4px;
    letter-spacing: 0.02em;
  }
  .seg button {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    transition:
      background-color 120ms,
      color 120ms;
  }
  .seg button.on {
    background: #fff;
    color: var(--ink);
    font-weight: 500;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  }
  .seg button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .pbtn {
    height: 30px;
    padding: 0 11px;
    border-radius: 8px;
    border: 1px solid var(--line-2);
    background: #fff;
    font-size: 12px;
    white-space: nowrap;
  }
  .pbtn:active {
    transform: scale(0.96);
  }
  .tog {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .proto .say {
    flex: 1 1 320px;
    font-size: 12px;
    line-height: 18px;
    color: var(--muted);
    min-width: 0;
  }

  /* ── 应用窗口 ── */
  .win {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-height: 620px;
    overflow: hidden;
  }
  .rail {
    width: 58px;
    flex: none;
    background: var(--shell);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-top: 20px;
    color: var(--ink-2);
  }
  .rail .on {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    background: var(--canvas);
    border-top-left-radius: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  .world svg.edges {
    position: absolute;
    left: -4000px;
    top: -4000px;
    width: 8000px;
    height: 8000px;
    overflow: visible;
    pointer-events: none;
  }
  .edges path {
    fill: none;
    stroke: #9a9a94;
    stroke-width: calc(1.5px / var(--z));
  }
  .edges path.hot {
    stroke: var(--ink);
  }

  /* 卡 */
  .node {
    position: absolute;
  }
  .node .nm {
    position: absolute;
    left: 0;
    bottom: 100%;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
    font-size: 12px;
    line-height: 16px;
    padding: 0 3px 6px;
    box-sizing: border-box;
    transition: color 120ms;
  }
  .mode-after .node .nm {
    font-size: calc(12px / var(--z));
    line-height: calc(16px / var(--z));
    padding: 0 calc(3px / var(--z)) calc(6px / var(--z));
  }
  .node.sel .nm {
    color: var(--ink);
  }
  .face {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: var(--r-node);
    background: var(--card);
    box-shadow: var(--sh-card);
    overflow: hidden;
    cursor: default;
  }
  .node.sel .face {
    box-shadow:
      0 0 0 calc(2px / var(--z)) var(--ink),
      var(--sh-card);
  }
  .port {
    position: absolute;
    top: 50%;
    width: calc(12px / var(--z));
    height: calc(12px / var(--z));
    margin-top: calc(-6px / var(--z));
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 calc(1.5px / var(--z)) var(--ink);
    opacity: 0;
    transition: opacity 120ms;
  }
  .port.l {
    left: calc(-6px / var(--z));
  }
  .port.r {
    right: calc(-6px / var(--z));
  }
  .node:hover .port,
  .node.sel .port {
    opacity: 1;
  }
  .art {
    position: absolute;
    inset: 0;
  }
  .dur {
    position: absolute;
    right: 10px;
    bottom: 9px;
    font-size: 11px;
    line-height: 14px;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(10, 10, 10, 0.45);
    color: #fff;
  }
  .vload {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mode-after .vload {
    background: var(--fill-2);
  }
  .mode-after .vload .pg {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(10, 10, 10, 0.45);
  }
  .mode-now .vload {
    background: #fff;
  }
  .mode-now .vload .pg,
  .mode-now .vload .dur {
    display: none;
  }
  .empty {
    position: absolute;
    inset: 0;
    border-radius: var(--r-node);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .mode-now .node.is-empty .face {
    background: #fff;
    box-shadow: var(--sh-card);
  }
  .mode-now .empty {
    border: 1px dashed rgba(10, 10, 10, 0.12);
  }
  .mode-after .node.is-empty .face {
    background: transparent;
    box-shadow: none;
  }
  .mode-after .empty {
    border: calc(1.5px / var(--z)) dashed rgba(10, 10, 10, 0.24);
  }
  .node.is-empty.sel .face {
    box-shadow: 0 0 0 calc(2px / var(--z)) var(--ink);
  }
  .empty .plus {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--fill);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }
  .aud {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .aud .play {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--fill);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .aud .wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 30px;
    overflow: hidden;
  }
  .mode-after .aud .wave {
    flex: 1;
    min-width: 0;
  }
  .aud .wave i {
    display: block;
    width: 3px;
    flex: none;
    border-radius: 3px;
    background: rgba(105, 105, 105, 0.55);
  }
  .aud .t {
    font-size: 12px;
    color: var(--muted);
    width: 38px;
    text-align: right;
    flex: none;
    margin-left: auto;
  }
  .txt {
    position: absolute;
    inset: 0;
    padding: 18px 20px;
    font-size: 14px;
    line-height: 23px;
    color: var(--ink);
    overflow: hidden;
  }
  .txt::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60px;
    background: linear-gradient(transparent, #fff);
  }
  .txt h4 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .txt p {
    margin: 0 0 8px;
  }
  .vdots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 2px 0;
  }
  .vdots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fill-3);
  }
  .vdots i.on {
    background: var(--ink);
  }

  /* 选中的两样（屏幕坐标） */
  .chrome {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cw {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    pointer-events: auto;
  }
  .tb {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 14px;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    box-shadow: var(--sh-float);
    white-space: nowrap;
  }
  .tb .k {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tb .k:hover {
    background: var(--fill);
  }
  .tb .k:active,
  .tb .lead:active {
    transform: scale(0.96);
  }
  .tb .lead {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 13px 0 11px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    margin-right: 4px;
  }
  .tb .sep {
    width: 1px;
    height: 18px;
    background: var(--line-2);
    margin: 0 4px;
  }
  .pcol {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .pb {
    box-sizing: border-box;
    border-radius: var(--r-node);
    padding: 12px 8px 8px 14px;
    box-shadow: var(--sh-float);
  }
  .mode-after .pb {
    background: #fff;
    box-shadow:
      0 0 0 1px var(--line-2),
      var(--sh-float);
  }
  .mode-now .pb {
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
  }
  .pb .refs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pb .ref {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    position: relative;
    flex: none;
  }
  .pb .ref b {
    position: absolute;
    right: -4px;
    top: -4px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    box-sizing: border-box;
  }
  .pb .ref.add {
    border: 1.5px dashed rgba(10, 10, 10, 0.24);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    box-sizing: border-box;
  }
  .pb .ph {
    font-size: 14px;
    line-height: 20px;
    color: var(--faint);
    min-height: 40px;
    padding-right: 6px;
  }
  .pb .ph.v {
    color: var(--ink);
  }
  .pb .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .pb .plus {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--fill);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--fill);
    font-size: 12px;
    white-space: nowrap;
  }
  .chip.o {
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--ink-2);
  }
  .chip .s {
    color: var(--muted);
  }
  .send {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
    flex: none;
  }

  /* 外壳 */
  .shellx {
    transition: opacity 200ms var(--ease);
  }
  .shell-hidden .shellx {
    opacity: 0;
    pointer-events: none;
  }
  .pill {
    position: absolute;
    left: 17px;
    top: 16px;
    height: 36px;
    padding: 0 12px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--sh-float);
    font-weight: 600;
    font-size: 14px;
  }
  .pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #16794c;
  }
  .icol {
    position: absolute;
    left: 17px;
    top: 66px;
    width: 44px;
    padding: 4px 0;
    border-radius: 12px;
    background: #fff;
    box-shadow: var(--sh-float);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .icol button {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
  }
  .icol button.on {
    background: var(--fill-2);
    color: var(--ink);
  }
  .panel {
    position: absolute;
    left: 70px;
    top: 66px;
    bottom: 16px;
    width: 264px;
    border-radius: 16px;
    background: #fff;
    box-shadow: var(--sh-float);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: 0 0;
  }
  .panel[hidden] {
    display: none !important;
  }
  .panel .ph2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 10px 16px;
    font-weight: 600;
    font-size: 14px;
  }
  .panel .srch {
    margin: 0 12px 8px;
    height: 34px;
    border-radius: 10px;
    background: var(--fill);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    color: var(--faint);
    font-size: 13px;
  }
  .panel .grp {
    font-size: 11px;
    color: var(--muted);
    padding: 10px 16px 4px;
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.02em;
  }
  .panel .li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    margin: 0 4px;
    border-radius: 10px;
    text-align: left;
    width: calc(100% - 8px);
  }
  .panel .li:hover {
    background: var(--fill);
  }
  .panel .li .th {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex: none;
    background: var(--fill);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    overflow: hidden;
    position: relative;
  }
  .panel .li .nn {
    font-size: 13px;
    line-height: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel .li .ss {
    font-size: 11px;
    color: var(--muted);
  }
  .tr {
    position: absolute;
    right: 16px;
    top: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .tr .ed {
    height: 36px;
    padding: 0 13px;
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--sh-float);
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .tr .av {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d9c7ef, #7a64b3);
    box-shadow: var(--sh-float);
  }
  .bbar {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    height: 44px;
    padding: 0 6px;
    border-radius: 14px;
    background: #fff;
    box-shadow: var(--sh-float);
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .bbar button {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
  }
  .bbar button:hover {
    background: var(--fill);
  }
  .bbar button.on {
    background: var(--fill-2);
    color: var(--ink);
  }
  .bbar .zp {
    width: 48px;
    font-size: 12px;
    text-align: center;
    color: var(--ink-2);
  }
  .bbar .sep {
    width: 1px;
    height: 20px;
    background: var(--line-2);
    margin: 0 4px;
  }
  .mini {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 194px;
    height: 128px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: var(--sh-float);
    overflow: hidden;
  }
  .mini i {
    position: absolute;
    background: #cfcfca;
    border-radius: 2px;
  }
  .mini .vp {
    position: absolute;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    background: rgba(10, 10, 10, 0.03);
  }
  .hint {
    position: absolute;
    left: 17px;
    bottom: 22px;
    font-size: 11px;
    color: var(--faint);
    max-width: 330px;
    line-height: 16px;
  }

  /* 打开态 */
  .open {
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .open[hidden] {
    display: none !important;
  }
  .bd {
    position: absolute;
    inset: 0;
  }
  .paper {
    position: absolute;
    background: #fff;
    border-radius: 18px;
    border: 1px solid var(--line-2);
    box-sizing: border-box;
    box-shadow: var(--sh-paper);
    overflow: hidden;

    const CANVAS_MEDIA = [

    function refTile(key, k, n) {
      const isVid = n.type === 'video'

    function refsRow(n) {

    function promptHTML(n) {

        <div class="row">${plus}<span class="chip ${now ? 'o2' : ''}" data-chip="frame">画面 <span class="s" data-chip-val>${S.frame || '16:9'} · 2K</span>${I.chev}</span><span class="chip" data-chip="model">${model}${I.chev}</span>${send}</div>`

        const pchip = `<span class="chip ${now ? 'o2' : ''}" data-chip="frame"><span data-chip-val>${S.frame || '16:9'}</span> · 720p · 4s${I.chev}</span>`
        const mchip = `<span class="chip" data-chip="model">${modelLabel(n)}${I.chev}</span>`

    /* ── 提示词栏里的弹层：「+」菜单与 chip 弹层（屏幕坐标，从触发键长出来） ── */
    let pop = null
    function closePop(instant) {
      if (!pop) return
      const p = pop
      pop = null
      p.trigger.classList.remove('is-open')
      if (instant) {
        p.el.remove()
        return
      }
      const a = p.el.animate(
        [
          { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
          { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
        ],
        {
          duration: T(S.mode === 'now' ? 120 : 200),
          easing: EASE_IN,
          fill: 'forwards',
        },
      )
      a.onfinish = () => p.el.remove()
    }
    function placePop(el, trigger) {
      const st = stage.getBoundingClientRect(),
        tr = trigger.getBoundingClientRect(),
        sa = safeArea()
      const w = el.offsetWidth,
        h = el.offsetHeight
      let left = tr.left - st.left,
        top = tr.bottom - st.top + 8
      let below = true
      if (top + h > sa.b) {
        top = tr.top - st.top - 8 - h
        below = false
      }
      left = Math.min(Math.max(left, sa.l), sa.r - w)
      top = Math.max(top, sa.t)
      el.style.left = left + 'px'
      el.style.top = top + 'px'
      const ox = tr.left - st.left + tr.width / 2 - left
      el.style.transformOrigin = `${ox}px ${below ? 0 : h}px`
    }
    function openAddMenu(trigger, nodeId) {
      if (pop && pop.trigger === trigger) {

      } else {
        const accept =
          n.type === 'audio'
            ? ['wav']
            : n.type === 'video'
              ? ['night', 'girl', 'shot', 'rooftop', 'wav']

        const have = new Set(REFS[nodeId] || [])

            (m) =>
              `<button class="gt ${m.key === 'wav' ? 'wav' : ''} ${have.has(m.key) ? 'on' : ''}" data-pick="${m.key}" title="${m.label}" aria-label="挂上 ${m.label}" style="${m.key === 'wav' ? '' : `background:${ART[m.key]}`}">${m.key === 'wav' ? I.wav : ''}</button>`,

        el.innerHTML = `<button class="mi">${I.down.replace('M8 2.5v8M4.5 7L8 10.5 11.5 7', 'M8 10.5v-8M4.5 6L8 2.5 11.5 6')}上传文件<kbd>⌘U</kbd></button>
        <button class="mi">${I.img}从素材库选…</button>
        ${n.type === 'audio' ? `<button class="mi">${I.wav}声音库…</button>` : ''}
        <div class="sec"><span>画布上的</span><span>点一下就挂上</span></div><div class="gridc">${tiles}</div>`
      }
      chrome.appendChild(el)
      placePop(el, trigger)
      trigger.classList.add('is-open')
      pop = { el, trigger, nodeId }
      if (S.mode === 'now')
        el.animate(
          [
            { opacity: 0, transform: 'scale(.95)' },
            { opacity: 1, transform: 'scale(1)' },
          ],
          { duration: T(150), easing: EASE },
        )
      else
        el.animate(
          [
            { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
            { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
          ],
          { duration: T(340), easing: reduce ? 'linear' : SLOT },
        )
      el.addEventListener('click', (e) => {
        const t = e.target.closest('[data-pick]')
        if (!t) return
        const list = REFS[nodeId] || (REFS[nodeId] = [])
        const key = t.dataset.pick
        if (list.includes(key)) {
          closePop()
          return
        }
        list.push(key)
        closePop()
        refreshPrompt(nodeId, key)
      })
    }
    function openFramePop(trigger) {
      if (pop && pop.trigger === trigger) {
        closePop()
        return
      }
      closePop(true)
      const el = document.createElement('div')
      el.className = 'ppop'
      const cur = S.frame || '16:9'
      el.innerHTML = `<div class="lbl2">比例</div><div class="segx">${['1:1', '16:9', '9:16', '4:3', '3:4'].map((r) => `<button data-ratio="${r}" class="${r === cur ? 'on' : ''}">${r}</button>`).join('')}</div>
      <div class="lbl2">张数</div><div class="segx" style="margin-bottom:2px"><button class="on">1</button><button>2</button><button>4</button></div>`
      chrome.appendChild(el)
      placePop(el, trigger)
      trigger.classList.add('is-open')
      pop = { el, trigger }
      el.animate(
        [
          { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
          { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
        ],
        { duration: T(340), easing: reduce ? 'linear' : SLOT },
      )
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-ratio]')
        if (!b) return
        S.frame = b.dataset.ratio
        el.querySelectorAll('[data-ratio]').forEach((x) =>
          x.classList.toggle('on', x === b),
        )
        const v = trigger.querySelector('[data-chip-val]')
        if (v)
          v.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: T(120) })
        if (v) v.textContent = v.textContent.replace(/^[0-9:]+/, S.frame)
        setTimeout(() => closePop(), T(160))
      })
    }
    function refreshPrompt(nodeId, addedKey) {
      if (!chromeEls || chromeEls.id !== nodeId) return
      const holder = chromeEls.pb.firstElementChild
      const origin = holder.style.transformOrigin
      chromeEls.pb.innerHTML = promptHTML(byId[nodeId])
      chromeEls.pb.firstElementChild.style.transformOrigin = origin
      layoutChrome()
      const tile = chromeEls.pb.querySelector(`[data-ref="${addedKey}"]`)
      if (tile)
        tile.animate(
          [
            { opacity: 0, transform: 'scale(.72)' },
            { opacity: 1, transform: 'scale(1)' },
          ],
          { duration: T(340), easing: reduce ? 'linear' : SLOT },
        )
    }
    chrome.addEventListener('click', (e) => {
      if (!chromeEls) return
      const add = e.target.closest('[data-add]')
      if (add) {
        openAddMenu(add, chromeEls.id)
        return
      }
      const chip = e.target.closest('[data-chip="frame"]')
      if (chip) {
        openFramePop(chip)
        return
      }
      const mchip = e.target.closest('[data-chip="model"]')
      if (mchip) {
        openModelPop(mchip, chromeEls.id)
        return
      }
    })
    document.addEventListener(
      'pointerdown',
      (e) => {
        if (
          pop &&
          !pop.el.contains(e.target) &&
          !pop.trigger.contains(e.target)
        )
          closePop()
      },
      true,
    )
    let chromeEls = null
    function showChrome(id) {
      closePop(true)
      const old = chromeEls
      chromeEls = null
      if (old) {
        for (const el of [old.tb, old.pb]) {
          const inner = el.firstElementChild
          const a = inner.animate(
            [
              { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
              { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
            ],
            { duration: T(200), easing: EASE_IN, fill: 'forwards' },
          )
          a.onfinish = () => el.remove()
        }
      }
      if (!id) return
      const n = byId[id]
      const tb = document.createElement('div')
      tb.className = 'cw'
      tb.innerHTML = `<div class="tb">${toolbarHTML(n)}</div>`
      if (n.empty && S.mode === 'after') tb.style.display = 'none'
      const pb = document.createElement('div')
      pb.className = 'cw'
      pb.innerHTML = promptHTML(n)
      chrome.append(tb, pb)
      chromeEls = { id, tb, pb }
      layoutChrome()
      for (const [el, top] of [
        [tb, true],
        [pb, false],
      ]) {
        const inner = el.firstElementChild
        inner.style.transformOrigin =
          el.dataset.origin || (top ? '50% 100%' : '50% 0')
        inner.animate(
          [
            { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
            { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
          ],
          { duration: T(340), easing: reduce ? 'linear' : SLOT },
        )
      }
      tb.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act="open"]')
        if (b) openNode(id)
      })
    }
    function layoutChrome() {
      if (!chromeEls) return
      const n = byId[chromeEls.id],
        r = screenRect(n),
        z = S.vp.z
      const k = Math.min(1, Math.max(0.6, z))
      const sa = safeArea()
      const cx = r.x + r.w / 2
      const nameRow = 22
      const { tb, pb } = chromeEls
      const tw = tb.firstElementChild.offsetWidth * k,
        th = tb.firstElementChild.offsetHeight * k
      const pw = pb.firstElementChild.offsetWidth * k,
        ph = pb.firstElementChild.offsetHeight * k
      let tl = cx - tw / 2,
        tt = r.y - nameRow - 8 - th
      let pl = cx - pw / 2,
        pt = r.y + r.h + 10
      let visible = true
      if (S.mode === 'after') {
        const off =
          r.x + r.w < sa.l || r.x > sa.r || r.y + r.h < sa.t || r.y > sa.b
        visible = !off
        tl = Math.min(Math.max(tl, sa.l), sa.r - tw)
        pl = Math.min(Math.max(pl, sa.l), sa.r - pw)
        if (tt < sa.t) tt = sa.t
        if (pt + ph > sa.b) pt = sa.b - ph
        const miniL = sa.W - 16 - 194 - 12,
          miniT = sa.H - 16 - 128 - 12
        if (pt + ph > miniT && pl + pw > miniL) pl = Math.max(sa.l, miniL - pw)
      }
      for (const [el, l, t, top] of [
        [tb, tl, tt, true],
        [pb, pl, pt, false],
      ]) {
        el.style.transform = `translate(${l}px,${t}px) scale(${k})`
        el.style.visibility = visible ? 'visible' : 'hidden'
        const ox = Math.min(Math.max((cx - l) / k, 0), (top ? tw : pw) / k)
        el.firstElementChild.style.transformOrigin = `${ox}px ${top ? '100%' : '0'}`
      }
    }
    function select(id) {
      if (S.sel === id) return
      S.sel = id
      world
        .querySelectorAll('.node')
        .forEach((e) => e.classList.toggle('sel', e.dataset.id === id))
      renderEdges()
      showChrome(id)
    }

    /* ── 小地图 ── */
    function bounds() {
      let x0 = 1e9,
        y0 = 1e9,
        x1 = -1e9,
        y1 = -1e9
      for (const n of NODES) {
        x0 = Math.min(x0, n.x)
        y0 = Math.min(y0, n.y - 24)
        x1 = Math.max(x1, n.x + n.w)
        y1 = Math.max(y1, n.y + n.h)
      }
      return { x0, y0, x1, y1 }
    }
    function renderMini() {
      const m = $('#mini'),
        pad = 12,
        W = 194,
        H = 128
      const { W: sw, H: sh } = stageSize(),
        { x, y, z } = S.vp
      const c = bounds(),
        b = {
          x0: Math.min(c.x0, -x / z),
          y0: Math.min(c.y0, -y / z),
          x1: Math.max(c.x1, (sw - x) / z),
          y1: Math.max(c.y1, (sh - y) / z),
        }
      const s = Math.min(
        (W - pad * 2) / (b.x1 - b.x0),
        (H - pad * 2) / (b.y1 - b.y0),
      )
      const ox = pad + (W - pad * 2 - (b.x1 - b.x0) * s) / 2,
        oy = pad + (H - pad * 2 - (b.y1 - b.y0) * s) / 2
      const vx = (-x / z - b.x0) * s + ox,
        vy = (-y / z - b.y0) * s + oy,
        vw = (sw / z) * s,
        vh = (sh / z) * s
      m.innerHTML =
        NODES.map(
          (n) =>
            `<i style="left:${(n.x - b.x0) * s + ox}px;top:${(n.y - b.y0) * s + oy}px;width:${n.w * s}px;height:${n.h * s}px"></i>`,
        ).join('') +
        `<span class="vp" style="left:${vx}px;top:${vy}px;width:${vw}px;height:${vh}px"></span>`
    }

    /* ── 节点一览 ── */
    function renderRows() {

        ['text', '文本'],

                return `<button class="li" data-id="${n.id}">${th}<span style="min-width:0"><div class="nn">${name}</div><div class="ss">${n.sub}</div></span></button>`
              })

    function setPanel(on) {
      S.panel = on

      $('#bList').classList.toggle('on', on)
      if (on)
        panel.animate(
          [
            { opacity: 0, transform: 'scale(.96)' },

    function locate(id) {
      const n = byId[id]
      const { W, H } = stageSize()
      if (S.mode === 'now') {
        // 现状：单卡 fitView，上限 200%，不选中。
        const z = Math.min(2, (W * 0.9) / n.w, (H * 0.9) / n.h)
        animateVP(
          { x: W / 2 - (n.x + n.w / 2) * z, y: H / 2 - (n.y + n.h / 2) * z, z },
          320,
        )
        return
      }
      const sa = safeArea()
      let z = S.vp.z
      if (n.w * z < 160) z = 1
      const chromeH = 170,
        availH = sa.b - sa.t,
        availW = sa.r - sa.l
      if (n.h * z + chromeH > availH || n.w * z > availW - 40)
        z = Math.min(z, (availH - chromeH) / n.h, (availW - 40) / n.w, 1)
      const cx = (sa.l + sa.r) / 2,
        cy = sa.t + (availH - chromeH) / 2 + 30
      if (S.sel && S.sel !== id) select(null)
      animateVP(
        { x: cx - (n.x + n.w / 2) * z, y: cy - (n.y + n.h / 2) * z, z },
        320,
        () => select(id),
      )
    }

    /* ── 打开态 ── */
    function fit(w, h, mw, mh) {
      const s = Math.min(mw / w, mh / h)
      return { w: Math.round(w * s), h: Math.round(h * s) }
    }
    function kindOf(n) {
      return n.type === 'image'
        ? 'look'
        : n.type === 'video'
          ? 'frame'
          : n.type === 'text'
            ? 'doc'
            : null
    }
    function dirNow() {
      return S.mode === 'now' ? 'now' : S.dir
    }

    function buildLook(d, n, W, H) {
      const aspect = { w: 3840, h: 3840 * (n.h / n.w) }
      const sizeLabel = `${aspect.w}×${Math.round(aspect.h)}`
      const acts = `<button class="xb" aria-label="下载">${I.down}</button><button class="xb" data-close aria-label="关闭">${I.x}</button>`
      if (d === 'A') {
        // 与视频画中框同一张纸（owner 09-30「图片打开态设计成视频的同款」）：上面是图，下面是参考 · 提示词 · 页脚
        const pw = Math.min(720, W - 96)
        const rest = 52 + 14 + 44 + 14 + 70 + 58
        const im = fit(
          aspect.w,
          aspect.h,
          pw - 40,
          Math.max(200, H - 96 - rest),
        )
        const ph = Math.min(rest + im.h, H - 96)
        const refs = (REFS[n.id] || [])
          .map(
            (k) =>
              `<span class="rt" style="background:${ART[k] || '#e9e9e4'}"></span>`,
          )
          .join('')
        const v = n.versions || 1
        return {
          bd: 'rgba(10,10,10,.24)',
          hideShell: true,
          html: `<div class="paper" data-grow style="left:${(W - pw) / 2}px;top:${(H - ph) / 2}px;width:${pw}px;height:${ph}px">
        <div class="fh late"><span class="fn">${n.name}</span><span class="cap mono">${sizeLabel} · ${v} / ${v}</span><span style="flex:1"></span><button class="xb" aria-label="下载">${I.down}</button><button class="xb" data-close aria-label="关闭">${I.x}</button></div>

    }

    function openNode(id) {
      const n = byId[id],
        kind = kindOf(n)
      if (!kind || n.empty || S.open) return
      const d = dirNow()
      const { W, H } = stageSize()
      const spec = (
        kind === 'look' ? buildLook : kind === 'frame' ? buildFrame : buildDoc
      )(d, n, W, H)
      openEl.innerHTML = `<div class="bd" data-close style="background:${spec.bd}"></div>${spec.html}`
      openEl.hidden = false
      S.open = { id, spec }
      if (spec.hideShell) win.classList.add('shell-hidden')
      chrome.style.display = 'none'
      const g = openEl.querySelector('[data-grow]')
      const R = g.getBoundingClientRect(),
        stR = stage.getBoundingClientRect(),
        C = screenRect(n)
      const sx = C.w / R.width,
        sy = C.h / R.height
      const tx = C.x - (R.left - stR.left),
        ty = C.y - (R.top - stR.top)
      const uniform = kind !== 'look'
      const s0 = uniform ? `scale(${sx})` : `scale(${sx},${sy})`
      g.style.transformOrigin = '0 0'
      g.animate(
        [
          {
            transform: `translate(${tx}px,${ty}px) ${s0}`,
            opacity: 0.5,
            borderRadius: '18px',
          },
          { transform: 'none', opacity: 1 },
        ],
        { duration: T(320), easing: EASE },
      )
      openEl
        .querySelector('.bd')
        .animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: T(200),
          easing: EASE,
        })
      openEl
        .querySelectorAll('.late')
        .forEach((el) =>
          el.animate(
            [{ opacity: 0 }, { opacity: 0, offset: 0.375 }, { opacity: 1 }],
            { duration: T(320), easing: 'linear' },
          ),
        )
    }
    function closeOpen() {
      if (!S.open) return
      const n = byId[S.open.id],
        g = openEl.querySelector('[data-grow]')
      const R = g.getBoundingClientRect(),
        stR = stage.getBoundingClientRect(),
        C = screenRect(n)
      const kind = kindOf(n),
        uniform = kind !== 'look'
      const sx = C.w / R.width,
        sy = C.h / R.height
      const tx = C.x - (R.left - stR.left),
        ty = C.y - (R.top - stR.top)
      openEl
        .querySelectorAll('.late')
        .forEach((el) =>
          el.animate([{ opacity: 1 }, { opacity: 0 }], {
            duration: T(120),
            fill: 'forwards',
          }),
        )
      openEl
        .querySelector('.bd')
        .animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: T(240),
          easing: EASE_IN,
          fill: 'forwards',
        })
      const a = g.animate(
        [
          { transform: 'none', opacity: 1 },
          {
            transform: `translate(${tx}px,${ty}px) ${uniform ? `scale(${sx})` : `scale(${sx},${sy})`}`,
            opacity: 0.4,
          },
        ],
        { duration: T(240), easing: EASE_IN, fill: 'forwards' },
      )
      win.classList.remove('shell-hidden')
      a.onfinish = () => {
        openEl.hidden = true
        openEl.innerHTML = ''
        S.open = null
        chrome.style.display = ''
        layoutChrome()
      }

      const node = e.target.closest('.node')
      drag = {
        x: e.clientX,
        y: e.clientY,
        vx: S.vp.x,
        vy: S.vp.y,
        moved: false,
        node: node ? node.dataset.id : null,
        pid: e.pointerId,
      }
    })
    stage.addEventListener('pointermove', (e) => {
      if (!drag) return
      const dx = e.clientX - drag.x,
        dy = e.clientY - drag.y
      if (!drag.moved && Math.hypot(dx, dy) > 4) {
        drag.moved = true
        stage.setPointerCapture(drag.pid)
      }
      if (drag.moved && !drag.node) {
        S.vp.x = drag.vx + dx
        S.vp.y = drag.vy + dy
        applyVP()
      }
    })
    stage.addEventListener('pointerup', () => {
      if (!drag) return
      if (!drag.moved) select(drag.node)
      drag = null
    })

            e.clientY - r.top,

          S.vp.y -= e.deltaY

      const wx = (W / 2 - x) / z,

      return {
        x: W / 2 - ((b.x0 + b.x1) / 2) * z,

            ],
          ],
          ['配乐', [['mmm', 'MiniMax Music', '平台免费额度 · 剩 5 首']]],
        ],
      },
    }
    const PICKED = {}
    function modelOf(n) {
      const set = MODELS[n.type]
      if (!set) return null
      const id = PICKED[n.id] || set.def
      for (const [series, rows] of set.groups)
        for (const r of rows) if (r[0] === id) return { series, row: r }
      return null
    }
    function modelLabel(n) {
      const m = modelOf(n)
      if (!m) return '写作模型'
      if (m.series === '语音' || m.series === '配乐') return m.row[1]
      return `${m.series} <span class="s">${m.row[1]}</span>`
    }
    function modelRows(n) {
      const set = MODELS[n.type],
        cur = (modelOf(n) || {}).row?.[0]
      const row = (series, r) =>
        `<button class="mr ${r[4] ? 'nokey' : ''}" data-model="${r[0]}"><span><div class="mn">${r[1]}</div><div class="mc">${r[2]}</div></span>${r[0] === cur ? `<span class="ck">${'<svg class="i" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>'}</span>` : r[3] ? `<span class="chn">${r[3]} ›</span>` : ''}</button>`
      const find = (id) => {
        for (const [se, rs] of set.groups)
          for (const r of rs) if (r[0] === id) return [se, r]
      }
      const recent = set.recent
        .map(find)
        .filter(Boolean)
        .map(([se, r]) =>
          row(se, [
            r[0],
            se === '语音' || se === '配乐' ? r[1] : `${se} ${r[1]}`,
            r[2],
            r[3],
            r[4],
          ]),
        )
        .join('')
      return (
        `<div class="mg">最近</div>${recent}` +
        set.groups
          .map(
            ([se, rs]) =>
              `<div class="mg">${se}</div>` +
              rs.map((r) => row(se, r)).join(''),
          )
          .join('')
      )
    }
    const NOW_MODEL_ROWS = `<div class="mg">GPT Image</div><button class="mr"><span class="mn">OpenAI GPT Image 2.5 Flare</span></button><button class="mr"><span class="mn">OpenAI GPT Image 2.5 Sunburst</span></button><button class="mr"><span class="mn">OpenAI GPT Image 2</span></button>
    <div class="mg">Seedream</div><button class="mr"><span class="mn">5.0 Pro</span><span class="chn mono">$0.0675 / 张</span></button><button class="mr"><span class="mn">5.0 Lite</span><span class="chn">—</span></button><button class="mr"><span class="mn">5.0</span></button>
    <div class="mg">NovelAI</div><button class="mr"><span class="mn">Diffusion V4.5 Curated</span></button><button class="mr"><span class="mn">Diffusion V5 Full</span></button>`
    function rectOf(el) {
      const st = stage.getBoundingClientRect(),
        r = el.getBoundingClientRect()
      return { x: r.left - st.left, y: r.top - st.top, w: r.width, h: r.height }
    }
    function hit(a, b) {
      return (
        a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y
      )
    }
    function openModelPop(trigger, nodeId) {
      if (pop && pop.trigger === trigger) {
        closePop()
        return
      }
      closePop(true)
      const n = byId[nodeId]
      const el = document.createElement('div')
      el.className = 'mpop' + (S.mode === 'now' ? ' now' : '')
      el.innerHTML = `<div class="ms"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2l3.3 3.3"/></svg>搜索模型…</div><div class="ml">${S.mode === 'now' ? NOW_MODEL_ROWS : modelRows(n)}</div><div class="mf"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg>配置渠道与 key…</div>`
      chrome.appendChild(el)
      const sa = safeArea(),
        tr = rectOf(trigger),
        card = screenRect(n),
        bar = rectOf(chromeEls.pb.querySelector('.pb'))
      const w = el.offsetWidth,
        h = el.offsetHeight
      let pos, origin
      if (S.mode === 'now') {
        pos = { x: tr.x, y: tr.y - 8 - h }
        origin = `${tr.w / 2}px ${h}px`
      } else {
        // 先下、再右、再左、最后才往上；⛔ 盖住正在编辑的卡
        const cands = [
          [{ x: tr.x, y: bar.y + bar.h + 8 }, `${tr.w / 2}px 0`],
          [{ x: bar.x + bar.w + 8, y: bar.y }, `0 ${tr.y - bar.y}px`],
          [{ x: bar.x - 8 - w, y: bar.y }, `${w}px ${tr.y - bar.y}px`],
          [
            { x: bar.x + bar.w + 8, y: Math.max(bar.y, card.y + card.h + 8) },
            `0 0`,
          ],
          [
            { x: bar.x - 8 - w, y: Math.max(bar.y, card.y + card.h + 8) },
            `${w}px 0`,
          ],
          [{ x: tr.x, y: tr.y - 8 - h }, `${tr.w / 2}px ${h}px`],
        ]
        // 每个候选先夹进安全区，再看压不压到正在编辑的卡和提示词栏
        const clampP = (p) => ({
          x: Math.min(Math.max(p.x, sa.l), sa.r - w),
          y: Math.min(Math.max(p.y, sa.t), sa.b - h),
        })
        const ok = (p) =>
          !hit({ x: p.x, y: p.y, w, h }, card) &&
          !hit({ x: p.x, y: p.y, w, h }, bar)
        const pick = cands
          .map(([p, o]) => [clampP(p), o])
          .find(([p]) => ok(p)) || [clampP(cands[0][0]), cands[0][1]]
        pos = pick[0]
        origin = pick[1]
      }
      el.style.left = pos.x + 'px'
      el.style.top = pos.y + 'px'
      el.style.transformOrigin = origin
      trigger.classList.add('is-open')
      pop = { el, trigger }
      if (S.mode === 'now')
        el.animate(
          [
            { opacity: 0, transform: 'scale(.95)' },
            { opacity: 1, transform: 'scale(1)' },
          ],
          { duration: T(150), easing: EASE },
        )
      else
        el.animate(
          [
            { opacity: 0, transform: 'scale(.72)', filter: 'blur(4px)' },
            { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
          ],
          { duration: T(340), easing: reduce ? 'linear' : SLOT },
        )
      el.addEventListener('click', (e) => {
        const r = e.target.closest('[data-model]')
        if (!r || r.classList.contains('nokey') || S.mode === 'now') return
        PICKED[nodeId] = r.dataset.model
        trigger.innerHTML = modelLabel(n) + I.chev
        trigger.animate([{ opacity: 0.2 }, { opacity: 1 }], {
          duration: T(120),
        })
        setTimeout(() => closePop(), T(160))
      })
    }

    /* ── 镜头 4：首帧加载 ── */
    S.loaded = false
    let loadTimer = null
    function renderFace(id, fade) {
      const n = byId[id],
        el = world.querySelector(`.node[data-id="${id}"] .face`)
      if (!el) return
      el.innerHTML = faceHTML(n)
      if (fade)
        el.firstElementChild.animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: T(200),
          easing: 'linear',
        })
    }
    function replayLoad() {
      clearTimeout(loadTimer)
      S.loaded = false
      renderFace('vid2')
      loadTimer = setTimeout(() => {
        S.loaded = true
        renderFace('vid2', true)
      }, 1600 * S.slow)
    }

    /* ── 助手：现状 / A 侧板 / B 浮板 / C 底部条 ── */
    S.asstOpen = false
    S.asstDir = 'A'
    const asst = $('#asst'),
      gutter = $('#gutter'),
      bAsst = $('#bAsst')
    function asstHTML(compact) {
      return `<div class="ah"><span class="av2"></span><span class="tt">达妮娅 · 雨夜分镜</span><button class="xb" aria-label="更多">${I.more}</button><button class="xb" data-asst-close aria-label="收起助手">${I.x}</button></div>
      <div class="ab">
        ${compact ? '' : '<div class="you">把镜头 3 改成从远景慢慢推近，配上秧秧那段语音。</div>'}
        <div class="me">改好了：镜头 3 的说明换成推镜，挂上了「秧秧 · 语音 2」。你看一下再发。</div>
        <div class="chg"><div><i style="background:${ART.shot}"></i>镜头 3 · 改了说明、挂了语音</div><div><i style="background:#e9e9e4"></i>秧秧 · 语音 2 · 连到镜头 3</div></div>
      </div>
      <div class="ac"><div class="ph">继续说，或把素材挂进来…</div><div class="row"><span class="plus" style="width:28px;height:28px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center">${I.plus}</span><span class="chip">Gemini <span class="s">3.8 Flash</span>${I.chev}</span><button class="send">${I.send}</button></div></div>`
    }
    function springRun(from, to, step, done) {
      const k = 220,
        c = 26
      let x = from,
        v = 0,
        last = performance.now()
      const tick = (now) => {
        const dt = Math.min(0.032, (now - last) / 1000) / S.slow
        last = now
        const a = -k * (x - to) - c * v
        v += a * dt
        x += v * dt
        if (reduce || (Math.abs(v) < 0.5 && Math.abs(x - to) < 0.5)) {
          step(to)
          done && done()
          return
        }
        step(x)
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)
    }
    function setStageRight(px) {
      const prev = parseFloat(stage.style.marginRight || '0')
      stage.style.marginRight = px + 'px'
      S.vp.x -= (px - prev) / 2
      applyVP()
    }
    function panelW() {
      return Math.max(320, Math.round(win.clientWidth * 0.3))
    }
    function openAsst() {
      if (S.asstOpen) return
      closePop(true)
      const d = S.mode === 'now' ? 'now' : 'A'
      S.asstOpen = true
      S.asstNow = d
      asst.innerHTML = asstHTML(false)
      asst.hidden = false
      asst.style.cssText = ''
      if (d === 'now') {
        // 现状：画布推窄，让出来的那条露出舞台底色（黑），面板浮在里面，头像消失
        const W = 446
        Object.assign(asst.style, {
          right: '16px',
          top: '60px',
          bottom: '16px',
          width: '410px',
          borderRadius: '16px',
        })
        gutter.style.background = '#14120f'
        bAsst.style.opacity = '0'
        springRun(0, W, (x) => {
          setStageRight(x)
          gutter.style.width = x + 'px'
        })
        asst.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(320) })
        return
      }
      // 布局 A（与图片 / 视频工作台同一套）：头像留在原位；画布让出「面板宽 + 20 + 18」，地台同色；
      // 面板是白卡，顶 66、底 18、右 18，从右边整块滑进来，与画布同一根弹簧、同一刻起步
      const w = panelW(),
        Y = w + 20 + 18
      Object.assign(asst.style, {
        right: '18px',
        top: '66px',
        bottom: '18px',
        width: w + 'px',
        borderRadius: '18px',
        boxShadow: '0 0 0 1px var(--line-2)',
      })
      asst.querySelector('.av2').style.display = 'none'
      gutter.style.background = '#f4f4f1'
      stage.classList.add('yield')
      springRun(0, Y, (x) => {
        setStageRight(x)
        gutter.style.width = x + 'px'
        stage.style.borderRadius = `16px ${Math.min(18, x / 2)}px ${Math.min(18, x / 2)}px 0`
        asst.style.transform = `translateX(${Y - x}px)`
      })
    }
    function closeAsst(instant) {
      if (!S.asstOpen) return
      const d = S.asstNow
      S.asstOpen = false
      const fin = () => {
        asst.hidden = true
        asst.innerHTML = ''
        bAsst.style.opacity = ''
        stage.classList.remove('yield')
        stage.style.borderRadius = ''
        gutter.style.width = '0'
        layoutChrome()
      }
      if (instant) {
        setStageRight(0)
        fin()
        return
      }
      if (d === 'now') {
        asst.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: T(200),
          fill: 'forwards',
        })
        springRun(
          446,
          0,
          (x) => {
            setStageRight(x)
            gutter.style.width = x + 'px'
          },
          fin,
        )
        setTimeout(() => {
          bAsst.style.opacity = ''
        }, T(200))
        return
      }
      const Y = parseFloat(stage.style.marginRight || '0')
      springRun(
        Y,
        0,
        (x) => {
          setStageRight(x)
          gutter.style.width = x + 'px'
          stage.style.borderRadius = `16px ${Math.min(18, x / 2)}px ${Math.min(18, x / 2)}px 0`
          asst.style.transform = `translateX(${Y - x}px)`
        },
        fin,
      )
    }
    bAsst.addEventListener('click', () =>
      S.asstOpen ? closeAsst() : openAsst(),
    )
    asst.addEventListener('click', (e) => {
      if (e.target.closest('[data-asst-close]')) closeAsst()
    })
    $('#bReload').onclick = () => replayLoad()

    window.__mock = {
      S,
      applyVP,
      select,
      setMode,
      openNode,
      closeOpen,
      setPanel,
      locate,
      setDir: (d) => {
        S.dir = d
      },
      openAsst: () => {
        closeAsst(true)
        openAsst()
      },
      closeAsst: () => closeAsst(true),
      openModelPop: () => {
        const c = chrome.querySelector('[data-chip="model"]')
        if (c && chromeEls) openModelPop(c, chromeEls.id)
      },
      setLoaded: (v) => {
        clearTimeout(loadTimer)
        S.loaded = v
        renderFace('vid2')
      },
      openAddMenu: () => {
        const b = chrome.querySelector('[data-add]')
        if (b && chromeEls) openAddMenu(b, chromeEls.id)
      },
      openFramePop: () => {
        const c = chrome.querySelector('[data-chip="frame"]')
        if (c) openFramePop(c)
      },
    }
    setMode('after')
    requestAnimationFrame(() => {
      const { W, H } = stageSize()
      S.vp = { x: W / 2 - 160, y: H / 2 - 190, z: 0.9 }
      applyVP()
      select('vid1')
      replayLoad()
    })
  })()
</script>
