<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixelVault · A 媒体优先关键切片</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17191d;
        --muted: #6e737b;
        --line: #dfe2e7;
        --line-strong: #cfd3d9;
        --paper: #fff;
        --wash: #f4f5f7;
        --well: #e9ebee;
        --accent: #17191d;
        --shadow: 0 34px 90px rgba(29, 33, 39, 0.18), 0 8px 24px rgba(29, 33, 39, 0.08);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        background: #e8eaed;
      }
      button, textarea, input { font: inherit; }
      button { color: inherit; }

      .canvas {
        position: fixed;
        inset: 0;
        background-image: radial-gradient(#bfc3c9 0.8px, transparent 0.8px);
        background-size: 22px 22px;
      }
      .canvas::after {
        position: absolute;
        inset: 0;
        content: "";
        background: rgba(244, 245, 247, 0.72);
      }

      .note {
        position: fixed;
        z-index: 20;
        top: 14px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 14px;
        transform: translateX(-50%);
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 14px;
        background: rgba(255,255,255,.95);
        box-shadow: 0 8px 22px rgba(30,34,40,.1);
        font-size: 11px;
        white-space: nowrap;
      }
      .note strong { font-size: 12px; }
      .note span { color: var(--muted); }

      .overlay {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 68px 26px 22px;
      }

      .panel {
        position: relative;
        display: grid;
        width: min(1320px, calc(100vw - 52px));
        height: min(810px, calc(100vh - 90px));
        min-height: 650px;
        grid-template-rows: 62px minmax(0,1fr) 58px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.92);
        border-radius: 22px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .sigil {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 10px;
        color: #51565e;
        background: #eceef2;
        font-size: 11px;
        font-weight: 800;
      }
      .crumb { color: #8a8f97; font-size: 9px; }
      h1 { margin: 1px 0 0; font-size: 15px; letter-spacing: -.02em; }
      .header-actions { display: flex; gap: 5px; }
      .icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }
      .icon:hover { background: var(--wash); }

      .body {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-columns: minmax(0,1fr) 384px;
      }

      .stage {
        position: relative;
        display: grid;
        min-width: 0;
        min-height: 0;
        place-items: center;
        overflow: hidden;
        padding: 22px;
        border-right: 1px solid var(--line);
        background:
          linear-gradient(122deg, rgba(255,255,255,.74), transparent 36%),
          repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,.18) 18px 19px),
          var(--well);
      }
      .media {
        position: relative;
        width: min(100%, 900px);
        aspect-ratio: 16/9;
        overflow: hidden;
        border: 1px solid rgba(55,61,70,.14);
        border-radius: 14px;
        background:
          radial-gradient(circle at 66% 34%, rgba(232,159,128,.43), transparent 15%),
          linear-gradient(180deg,#12334c 0%,#17334b 35%,#526776 35%,#687681 62%,#222a31 63%,#161c21 100%);
        box-shadow: 0 16px 32px rgba(29,39,49,.21);
      }
      .media::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 34%;
        content: "";
        opacity: .48;
        background: repeating-linear-gradient(90deg,transparent 0 74px,rgba(255,255,255,.15) 75px 77px);
        transform: perspective(300px) rotateX(58deg);
        transform-origin: bottom;
      }
      .osd {
        position: absolute;
        z-index: 2;
        right: 10px;
        bottom: 10px;
        display: flex;
        gap: 5px;
      }
      .osd span {
        padding: 5px 7px;
        border-radius: 7px;
        color: white;
        background: rgba(10,13,16,.58);
        font-family: "Iowan Old Style", "Songti SC", serif;
        font-size: 10px;
      }

      .editor {
        position: relative;
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-rows: auto minmax(0,1fr);
        background: var(--paper);
      }
      .composer {
        position: relative;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      textarea {
        width: 100%;
        min-height: 108px;
        resize: none;
        border: 0;
        outline: 0;
        color: #272b31;
        background: transparent;
        font-size: 12px;
        line-height: 1.65;
      }
      .controls { display: flex; flex-wrap: wrap; gap: 7px; }
      .control {
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--line-strong);
        border-radius: 11px;
        background: white;
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
      }
      .model-trigger {
        display: flex;
        flex: 1 1 178px;
        align-items: center;
        justify-content: space-between;
      }
      .model-trigger span:first-child::before {
        margin-right: 7px;
        content: "●";
        color: #22a66c;
        font-size: 7px;
      }

      .source-pane { min-width: 0; min-height: 0; overflow: auto; }
      .source-content, .manager { min-height: 100%; padding: 15px 16px; }
      .source-actions { display: flex; gap: 6px; margin-bottom: 10px; }
      .soft-action {
        min-height: 32px;
        padding: 0 10px;
        border: 0;
        border-radius: 10px;
        background: var(--wash);
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
      }
      .reference {
        display: grid;
        min-height: 46px;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 9px;
        padding: 5px;
        border-radius: 11px;
        background: var(--wash);
      }
      .thumb { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(140deg,#8b9cac,#d9c5b7); }
      .reference strong { display: block; font-size: 10px; }
      .reference small { color: var(--muted); font-size: 8px; }
      .relation {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 9px;
      }

      .manager { display: none; padding: 0; background: #fafbfc; }
      .manager[data-open="true"] { display: block; }
      .source-pane:has(.manager[data-open="true"]) .source-content { display: none; }
      .manager-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .manager-head strong { font-size: 11px; }
      .tabs { display: flex; gap: 4px; padding: 10px; }
      .tabs button {
        flex: 1;
        min-height: 29px;
        border: 0;
        border-radius: 9px;
        color: var(--muted);
        background: transparent;
        font-size: 9px;
      }
      .tabs button:first-child { color: var(--ink); background: #e9ecf0; }
      .manager-empty {
        display: grid;
        min-height: 170px;
        place-items: center;
        padding: 18px;
        color: var(--muted);
        text-align: center;
        font-size: 9px;
        line-height: 1.6;
      }

      .model-menu {
        position: absolute;
        z-index: 8;
        top: 194px;
        right: 14px;
        display: none;
        width: 320px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
        box-shadow: 0 18px 46px rgba(31,35,41,.15);
      }
      .model-menu[data-open="true"] { display: block; }
      .model-search {
        width: calc(100% - 20px);
        min-height: 38px;
        margin: 10px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .provider {
        display: grid;
        min-height: 50px;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        gap: 9px;
        padding: 6px 11px;
      }
      .provider:hover { background: var(--wash); }
      .provider-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 9px;
        background: #eef0f3;
        font-size: 9px;
        font-weight: 800;
      }
      .provider strong { display: block; font-size: 10px; }
      .provider small, .provider > span:last-child { color: var(--muted); font-size: 8px; }

      .dock {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        background: rgba(255,255,255,.98);
        box-shadow: 0 -9px 22px rgba(25,29,35,.05);
      }
      .dock strong { display: block; font-size: 10px; }
      .dock small { color: var(--muted); font-size: 8px; }
      .primary {
        min-width: 126px;
        min-height: 38px;
        padding: 0 18px;
        border: 0;
        border-radius: 11px;
        color: white;
        background: var(--accent);
        cursor: pointer;
        font-size: 11px;
        font-weight: 800;
      }

      @media (max-width: 1120px) {
        .overlay { padding: 60px 14px 14px; }
        .panel {
          width: calc(100vw - 28px);
          height: calc(100vh - 74px);
          min-height: 720px;
        }
        .body {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(420px, 1.25fr) minmax(230px, .75fr);
        }
        .stage { padding: 14px 28px; border-right: 0; border-bottom: 1px solid var(--line); }
        .media { width: min(90%, 790px); }
        .editor { grid-template-columns: minmax(0,1.15fr) minmax(310px,.85fr); grid-template-rows: 1fr; }
        .composer { border-right: 1px solid var(--line); border-bottom: 0; }
        textarea { min-height: 88px; }
        .model-menu { top: auto; right: auto; bottom: 8px; left: 14px; }
      }

      @media (max-width: 680px) {
        body { overflow: auto; }
        .note { display: none; }
        .overlay { position: relative; display: block; min-height: 100svh; padding: 0; }
        .panel {
          width: 100%;
          height: 100svh;
          min-height: 0;
          border: 0;
          border-radius: 0;
          grid-template-rows: 56px minmax(0,1fr) 62px;
        }
        .header { padding: 0 12px; }
        .body { display: block; overflow-y: auto; }
        .stage { min-height: 245px; padding: 14px; }
        .media { width: 100%; }
        .editor { display: block; }
        .composer { border-right: 0; }
        .source-pane { overflow: visible; }
        .model-menu { position: fixed; top: auto; right: 10px; bottom: 68px; left: 10px; width: auto; }
        .dock { padding-bottom: max(9px, env(safe-area-inset-bottom)); }
      }
    </style>
  </head>
  <body>
    <div class="canvas" aria-hidden="true"></div>
    <div class="note"><strong>A · 媒体优先</strong><span>关键切片：视频详情 × 管理素材</span></div>
    <main class="overlay">
      <article class="panel" role="dialog" aria-modal="true" aria-labelledby="title">
        <header class="header">
          <div class="identity">
            <span class="sigil">V</span>
            <div><div class="crumb">画布 / 视频生成</div><h1 id="title">镜头 07 · 海上夜景</h1></div>
          </div>
          <div class="header-actions"><button class="icon" aria-label="适应窗口">↙↗</button><button class="icon" aria-label="收起">×</button></div>
        </header>

        <div class="body">
          <section class="stage" aria-label="视频预览">
            <div class="media"><div class="osd"><span>00:05</span><span>16:9 · 720P</span></div></div>
          </section>

          <aside class="editor" aria-label="视频编辑">
            <section class="composer">
              <div class="kicker"><span>本次编辑</span><span>0 / 2000</span></div>
              <textarea aria-label="生成提示词">5 秒镜头。人物靠在甲板栏杆旁，远处灯塔划过海面，风吹动衣角，镜头缓慢向前推进。</textarea>
              <div class="controls">
                <button class="control model-trigger" data-model-trigger><span>Seedance · 快速</span><span>⌄</span></button>
                <button class="control">720P · 5 秒 · 16:9 ⌄</button>
              </div>
              <div class="model-menu" data-model-menu data-open="false" role="dialog" aria-label="选择视频模型">
                <input class="model-search" aria-label="搜索模型" placeholder="搜索视频模型…" />
                <div class="provider"><span class="provider-mark">V</span><span><strong>VolcEngine</strong><small>Seedance · 3 个模型</small></span><span>›</span></div>
                <div class="provider"><span class="provider-mark">F</span><span><strong>fal.ai</strong><small>8 个视频模型</small></span><span>›</span></div>
                <div class="provider"><span class="provider-mark">M</span><span><strong>MiniMax</strong><small>4 个视频模型</small></span><span>›</span></div>
              </div>
            </section>

            <section class="source-pane" aria-label="参考素材区域">
              <div class="source-content">
                <div class="kicker"><span>参考素材</span><span>1 / 3</span></div>
                <div class="source-actions"><button class="soft-action" data-manager-open>管理素材</button><button class="soft-action">素材库</button><button class="soft-action">Studio ↗</button></div>
                <div class="reference"><span class="thumb"></span><span><strong>甲板夜景</strong><small>图片 · 上游节点</small></span><span>×</span></div>
                <div class="relation"><span>被 2 个节点使用</span><span>查看关系 →</span></div>
              </div>
              <div class="manager" data-manager data-open="false">
                <div class="manager-head"><strong>管理素材</strong><button class="icon" data-manager-close aria-label="关闭素材管理">×</button></div>
                <div class="tabs"><button>全部</button><button>角色</button><button>场景</button><button>镜头</button></div>
                <div class="manager-empty">没有匹配的素材<br />从底部动作添加；提示词与模型始终保持可见。</div>
              </div>
            </section>
          </aside>
        </div>

        <footer class="dock"><div><strong>全能参考</strong><small>当前素材可直接生成</small></div><button class="primary">重新生成视频</button></footer>
      </article>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const manager = document.querySelector('[data-manager]');
      const modelMenu = document.querySelector('[data-model-menu]');
      if (params.get('state') === 'manager') manager.dataset.open = 'true';
      if (params.get('state') === 'model') modelMenu.dataset.open = 'true';
      document.querySelector('[data-manager-open]').addEventListener('click', () => { manager.dataset.open = 'true'; });
      document.querySelector('[data-manager-close]').addEventListener('click', () => { manager.dataset.open = 'false'; });
      document.querySelector('[data-model-trigger]').addEventListener('click', () => { modelMenu.dataset.open = modelMenu.dataset.open === 'true' ? 'false' : 'true'; });
    </script>
  </body>
</html>
