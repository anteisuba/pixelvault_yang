<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #0a0a0a; }
    a { color: #0a0a0a; } a:hover { color: #616167; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; }
    .c { font-size: 11px; padding: 6px 13px; border: 1px solid #d3d3ce; border-radius: 999px; background: #ffffff; }
    .con { background: #0a0a0a; color: #ffffff; border-color: #0a0a0a; }
    .k { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 9px; letter-spacing: 0.18em; color: #616167; text-transform: uppercase; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #e6e6e2;">
    <svg width="15" height="12" viewBox="0 0 15 12"><path d="M0 1h15M0 6h15M0 11h15" stroke="#0a0a0a" stroke-width="1.5"></path></svg>
    <span style="font-size: 13px; font-weight: 700;">画展之夜</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px;">
      <span class="mono" style="font-size: 9.5px; padding: 4px 9px; border: 1px solid #d3d3ce; border-radius: 999px;">素材库 <span style="color: #616167;">· 23</span></span>
      <span style="font-size: 10.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #0a0a0a; color: #ffffff;">合成 · 0:12</span>
    </span>
  </div>
  <div style="flex: 1;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(10,10,10,0.28);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e6e6e2; border-radius: 22px 22px 0 0; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -20px 60px -30px rgba(10,10,10,0.4);">
    <span style="width: 36px; height: 4px; border-radius: 999px; background: #d3d3ce; align-self: center;"></span>
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 13px; font-weight: 700;">参数</span>
      <span class="mono" style="font-size: 9px; color: #616167;">管接下来生成的念法 · 单句纠错点气泡角标</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="k">语速</span>
      <div style="display: flex; gap: 6px;"><span class="c">慢</span><span class="c con">正常</span><span class="c">快</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="k">表现力</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;"><span class="c con">自动</span><span class="c">克制</span><span class="c">自然</span><span class="c">戏剧化</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="k">朗读风格</span>
      <div style="display: flex; gap: 6px;"><span class="c con">默认</span><span class="c">旁白</span><span class="c">对话</span></div>
    </div>
    <div class="mono" style="display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: #616167; border-top: 1px solid #e6e6e2; padding-top: 11px;">
      <span>高级 · 温度 / Top-P / 音量</span>
      <svg style="margin-left: auto;" width="8" height="6" viewBox="0 0 8 6"><path d="M0.5 0.5l3.5 4.5 3.5-4.5" stroke="#616167" stroke-width="1.2" fill="none"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
