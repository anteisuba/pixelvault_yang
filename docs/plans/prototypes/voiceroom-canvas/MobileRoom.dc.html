<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #0a0a0a; }
    a { color: #0a0a0a; } a:hover { color: #616167; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace; }
    .ava { border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 700; }
    .who { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: #616167; }
    .bub { border: 1px solid #e6e6e2; border-radius: 4px 13px 13px 13px; background: #f4f4f1; padding: 8px 11px; font-size: 12px; line-height: 1.5; }
    .voice { display: flex; align-items: center; gap: 7px; border: 1px solid #e6e6e2; border-radius: 999px; padding: 6px 11px; background: #ffffff; }
    .play { width: 20px; height: 20px; border-radius: 999px; flex: none; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; }
    .wv { display: flex; align-items: center; gap: 2px; height: 15px; }
    .wv i { display: block; width: 2.5px; border-radius: 2px; background: #0a0a0a; opacity: 0.75; }
    .dur { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 10px; color: #616167; }
    .emo { font-family: ui-monospace, Consolas, 'PingFang SC', monospace; font-size: 9px; letter-spacing: 0.08em; padding: 3px 7px; border: 1px solid #d3d3ce; border-radius: 999px; color: #616167; background: #ffffff; }
    .pick { width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 11px; font-weight: 700; opacity: 0.4; border: 2px solid transparent; flex: none; }
    .talkbar { display: block; width: 2.5px; border-radius: 2px; background: #0a0a0a; opacity: 0.6; animation: talk 1s ease-in-out infinite; }
    @keyframes talk { 0%, 100% { height: 4px; } 50% { height: 11px; } }
    .cur { width: 6px; height: 12px; background: #0a0a0a; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #e6e6e2;">
    <svg width="15" height="12" viewBox="0 0 15 12"><path d="M0 1h15M0 6h15M0 11h15" stroke="#0a0a0a" stroke-width="1.5"></path></svg>
    <span style="font-size: 13px; font-weight: 700;">画展之夜</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px;">
      <span class="mono" style="font-size: 9.5px; padding: 4px 9px; border: 1px solid #d3d3ce; border-radius: 999px;">素材库 <span style="color: #616167;">· 23</span></span>
      <span style="font-size: 10.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #0a0a0a; color: #ffffff;">合成 · 0:12</span>
    </span>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 13px; padding: 15px 13px;">

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #c98da8, #8a4160);">晴</span>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 86%;">
        <span class="who">晴 · Fish 温柔女声</span>
        <span class="bub">各位晚上好——今晚的画展，八点开始。</span>
        <span style="display: flex; align-items: center; gap: 7px;">
          <span class="voice">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 13px;"></i><i style="height: 12px;"></i><i style="height: 8px;"></i><i style="height: 6px;"></i><i style="height: 11px;"></i><i style="height: 13px;"></i><i style="height: 10px;"></i><i style="height: 5px;"></i><i style="height: 9px;"></i><i style="height: 13px;"></i></span>
            <span class="dur">0:04</span>
          </span>
          <span class="emo">平静</span>
        </span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #7fa3c9, #33506b);">磊</span>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 86%;">
        <span class="who">磊 · Fish 少年音</span>
        <span class="bub">好，我把海报再改一版，八点前挂出来！</span>
        <span style="display: flex; align-items: center; gap: 7px;">
          <span class="voice">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv"><i style="height: 9px;"></i><i style="height: 6px;"></i><i style="height: 11px;"></i><i style="height: 13px;"></i><i style="height: 12px;"></i><i style="height: 6px;"></i><i style="height: 9px;"></i><i style="height: 13px;"></i></span>
            <span class="dur">0:03</span>
          </span>
          <span class="emo" style="display: inline-flex; align-items: center; gap: 3px;">兴奋 <svg width="6" height="4" viewBox="0 0 7 5"><path d="M0.5 0.5l3 3.5 3-3.5" stroke="#616167" stroke-width="1.2" fill="none"></path></svg></span>
        </span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #8a94a6, #3a4356);">效</span>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 86%;">
        <span class="who">音效师 · SFX</span>
        <span class="bub">『木门缓缓推开，门轴吱呀作响』</span>
        <span style="display: flex; align-items: center; gap: 7px;">
          <span class="voice" style="border-style: dashed; background: #f4f4f1;">
            <span class="play"><svg width="8" height="9" viewBox="0 0 9 10"><path d="M0.5 0.5l8 4.5-8 4.5z" fill="currentColor"></path></svg></span>
            <span class="wv" style="opacity: 0.55;"><i style="height: 4px;"></i><i style="height: 5px;"></i><i style="height: 12px;"></i><i style="height: 14px;"></i><i style="height: 13px;"></i><i style="height: 9px;"></i><i style="height: 6px;"></i></span>
            <span class="dur">0:02</span>
          </span>
          <span class="emo">音效</span>
        </span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <span class="ava" style="width: 34px; height: 34px; font-size: 13px; background: linear-gradient(135deg, #c98da8, #8a4160);">晴</span>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 86%;">
        <span class="who">晴 · Fish 温柔女声</span>
        <span class="bub">而此刻，馆里的灯一盏盏亮了。</span>
        <span class="mono" style="display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e6e6e2; border-radius: 999px; padding: 6px 11px; background: #ffffff; font-size: 9.5px; color: #616167; align-self: flex-start;">
          <span style="display: flex; gap: 2.5px; align-items: center; height: 12px;">
            <i class="talkbar"></i><i class="talkbar" style="animation-delay: 0.12s;"></i><i class="talkbar" style="animation-delay: 0.24s;"></i><i class="talkbar" style="animation-delay: 0.36s;"></i>
          </span>
          <span>正在开口</span>
        </span>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-top: 1px solid #e6e6e2; background: #f4f4f1; font-size: 10.5px;">
    <span class="ava" style="width: 28px; height: 28px; font-size: 11px; background: linear-gradient(135deg, #87b096, #33584a);">乐</span>
    <span class="mono" style="font-size: 9px; letter-spacing: 0.14em; color: #616167;">底垫</span>
    <span style="font-weight: 600;">画廊之夜</span>
    <span class="mono" style="font-size: 9px; color: #616167;">循环 · −14dB</span>
    <span style="margin-left: auto; width: 26px; height: 15px; border-radius: 999px; background: #0a0a0a; position: relative; flex: none;">
      <span style="position: absolute; top: 2px; right: 2px; width: 11px; height: 11px; border-radius: 999px; background: #ffffff;"></span>
    </span>
  </div>

  <div style="border-top: 1px solid #e6e6e2; display: flex; flex-direction: column; gap: 9px; padding: 10px 12px 13px;">
    <div style="display: flex; gap: 6px; align-items: center;">
      <span class="mono" style="font-size: 9px; color: #616167; flex: none; padding-right: 2px;">谁开口</span>
      <span class="pick" style="opacity: 1; border-color: #0a0a0a; background: linear-gradient(135deg, #c98da8, #8a4160);">晴</span>
      <span class="pick" style="background: linear-gradient(135deg, #7fa3c9, #33506b);">磊</span>
      <span class="pick" style="background: linear-gradient(135deg, #c9b47f, #8a6f33);">客</span>
      <span class="pick" style="background: linear-gradient(135deg, #8a94a6, #3a4356);">效</span>
      <span class="pick" style="background: linear-gradient(135deg, #87b096, #33584a);">乐</span>
      <span class="pick" style="background: #d3d3ce; opacity: 1;"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M5 0v10M0 5h10" stroke="#616167" stroke-width="1.4"></path></svg></span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="mono" style="flex: 1; display: flex; align-items: center; gap: 6px; border: 1px solid #e6e6e2; border-radius: 999px; padding: 9px 13px; font-size: 11px; color: #616167;">晴的台词… <span class="cur"></span></span>
      <span class="mono" style="font-size: 10px; padding: 8px 11px; border: 1px solid #d3d3ce; border-radius: 999px; background: #ffffff; color: #616167; flex: none;">参数</span>
      <span style="font-size: 11px; font-weight: 600; padding: 9px 16px; border-radius: 999px; background: #0a0a0a; color: #ffffff; flex: none;">生成</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
